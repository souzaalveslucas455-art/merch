# Mantem o projeto do Supabase acordado no plano gratuito.
# Roda toda segunda e quinta as 9h de Brasilia, e tambem pelo botao Run workflow.

name: Manter Supabase ativo

on: {schedule: [{cron: "0 12 * * 1,4"}], workflow_dispatch: {}}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o banco
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          CHAVE: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$CHAVE" ]; then
            echo "Faltam os segredos SUPABASE_URL e SUPABASE_ANON_KEY."
            exit 1
          fi
          codigo=$(curl -sS -o resposta.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $CHAVE" -H "Content-Type: application/json" -d "{}")
          echo "Resposta do banco: $(cat resposta.txt)"
          if [ "$codigo" != "200" ]; then
            echo "O banco respondeu $codigo. Confira se o projeto esta pausado."
            exit 1
          fi
          echo "Banco acordado."
