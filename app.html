/* -------------------- 1. contagem e ruptura ------------------
   Conta em caixa E unidade. O total em unidades e calculado com o fator de
   caixa do produto, entao o repositor nao precisa fazer conta.

   Duas regras que o app cobra:
   - gondola zerada obriga informar o motivo. Zerado sem motivo e um dado que
     nao serve para ninguem.
   - abaixo do que a loja costuma comprar vira aviso. Vinte caixas e muito num
     bar e pouco num atacarejo; a referencia vem do historico DAQUELA loja.
------------------------------------------------------------ */

const fator=p=>Number(p.fator_cx)>0?Number(p.fator_cx):1;

/* A volumetria e escolhida uma vez, no topo da tela, e vale para todos os
   produtos. Antes eram quatro campos por produto (gondola cx, gondola un,
   deposito cx, deposito un) e ninguem conta assim: o repositor conta tudo
   em caixa OU tudo em unidade, conforme a loja.

   O banco continua guardando as quatro colunas, entao o painel sabe em que
   volumetria foi contado. O que mudou e so o que a tela pede. */
const unidAtual=()=>guarda.ler("unid")||"cx";
function valorDe(p,onde){          // onde: 'g' (gondola) ou 'd' (deposito)
  const c=p.contagem||{};
  return unidAtual()==="cx" ? c[onde+"cx"] : c[onde+"un"];
}
function poeValor(p,onde,v){
  p.contagem=p.contagem||{};
  if(unidAtual()==="cx"){ p.contagem[onde+"cx"]=v; p.contagem[onde+"un"]=null; }
  else                  { p.contagem[onde+"un"]=v; p.contagem[onde+"cx"]=null; }
}
/* Trocar a volumetria converte o que ja foi digitado. Como o fator de caixa
   e conhecido, a conta e exata nos dois sentidos. */
function converterTudo(cat,de,para){
  cat.forEach(p=>{ const c=p.contagem; if(!c) return; const f=fator(p);
    ["g","d"].forEach(o=>{
      if(de==="cx"&&c[o+"cx"]!=null){ c[o+"un"]=Math.round(c[o+"cx"]*f); c[o+"cx"]=null; }
      else if(de==="un"&&c[o+"un"]!=null){ c[o+"cx"]=Math.round((c[o+"un"]/f)*100)/100; c[o+"un"]=null; }
    });
  });
}

function totais(p){
  const c=p.contagem||{}, f=fator(p);
  const gu=(Number(c.gcx)||0)*f+(Number(c.gun)||0);
  const du=(Number(c.dcx)||0)*f+(Number(c.dun)||0);
  const tocou=["gcx","gun","dcx","dun"].some(k=>c[k]!=null&&c[k]!=="");
  return {gu, du, total:gu+du, cx:(gu+du)/f, tocou, gondolaZerada: tocou && gu===0};
}
function estaBaixo(p){
  const t=totais(p); if(!t.tocou) return false;
  const m=Number(p.media_cx); if(!m) return false;
  return t.cx < m*((DIA.percentual_estoque_baixo||30)/100);
}
function enviaContagem(p){
  const c=p.contagem||{}, t=totais(p);
  grava("contagem","visita_id,produto_id",{
    visita_id:LOJA.visita?LOJA.visita.id:null, loja_id:LOJA.id,
    produto_id:p.produto_id, data:DIA.data,
    gondola_cx:c.gcx??null, gondola_un:c.gun??null,
    deposito_cx:c.dcx??null, deposito_un:c.dun??null,
    estoque_gondola: t.tocou? Math.round(t.gu) : null,
    estoque_deposito: t.tocou? Math.round(t.du) : null,
    ruptura:!!c.ruptura, ruptura_motivo:c.ruptura?(c.motivo||null):null,
    preco:c.preco==null?null:c.preco, preco_promocional:c.promo==null?null:c.promo});
}
function resumoContagem(cat){
  const rup=cat.filter(p=>p.contagem&&p.contagem.ruptura).length;
  const semMotivo=cat.filter(p=>p.contagem&&p.contagem.ruptura&&!p.contagem.motivo).length;
  const baixo=cat.filter(estaBaixo).length;
  const feitos=cat.filter(p=>totais(p).tocou||(p.contagem&&p.contagem.ruptura)).length;
  return {rup, semMotivo, baixo, feitos, total:cat.length};
}

const MOTIVOS=[["sem_pedido","Não pediu"],["pedido_nao_chegou","Pedido não chegou"],
  ["sem_espaco","Sem espaço"],["concorrente_ocupou","Concorrente ocupou"],
  ["deposito_cheio","Tem no depósito"],["outro","Outro"]];

/* ----------------- 1. oportunidade do estoque ----------------
   So aparecem os produtos que o sistema classificou, comparando o que a loja
   PEDIU no mes com o que ela COMPRA NORMALMENTE:
     ruptura -> compra todo mes e nao pediu nada: nao estamos vendendo
     abaixo  -> pedindo bem menos que o normal para esta altura do mes
     excesso -> pediu mais que um mes normal inteiro
   A classificacao vem pronta do banco. O repositor anota ONDE o produto esta
   (gondola, deposito, ilha, checkout) e quanto tem em cada lugar.
------------------------------------------------------------- */
const LOCAIS=[["g","Gôndola"],["d","Depósito"],["i","Ilha"],["k","Checkout"]];
/* Quatro status. Os tres primeiros olham o que a loja JA compra; "nunca
   comprou" olha o que as lojas parecidas compram e esta nao: e a
   oportunidade de venda, nao um problema de estoque. */
/* Linguagem de loja, nao de planilha: o repositor bate o olho e sabe o que
   aconteceu com o produto e o que fazer agora. */
const CLASSE={ruptura:{t:"Ruptura", cor:"var(--verm)", bg:"var(--verm-bg)",
                       d:"compra todo mês e não pediu", fila:"sem compra no mês",
                       fazer:"A loja não comprou este mês. Procure na gôndola e no depósito e marque onde está e quanto tem. Se não tiver, marque Não tem e escolha o motivo: isso chega para o seu líder e o gerente."},
              abaixo: {t:"Abaixo do normal", curto:"Abaixo", cor:"var(--amb)", bg:"var(--amb-bg)",
                       d:"pedindo menos que o normal", fila:"comprando pouco",
                       fazer:"A loja está comprando menos que o normal. Confira se o produto está na gôndola, bem exposto e com preço, e marque onde está e quanto tem."},
              excesso:{t:"Excesso", cor:"var(--azul)", bg:"var(--azul-bg)",
                       d:"pediu acima do normal", fila:"comprou demais",
                       fazer:"A loja comprou mais que o normal. Marque onde está e quanto tem. Se estiver parado no depósito, ajude a girar: gôndola cheia, ponta ou ilha."},
              nunca:  {t:"Nunca comprou", cor:"var(--roxo)", bg:"var(--roxo-bg)",
                       d:"lojas parecidas vendem, esta nunca comprou", fila:"vende nas parecidas",
                       fazer:"Lojas parecidas vendem e esta nunca comprou. Veja se ela tem por outro fornecedor e avise o consultor."}};
const ORDEM_CLASSE=["ruptura","abaixo","excesso","nunca"];
/* O segmento vira frase, para o repositor usar como argumento com a loja:
   "87% dos supermercados vendem este produto". */
const SEG_FRASE={"SUPER":"dos supermercados","HIPER":"dos hipermercados","AS 1-4":"das lojas de autosserviço até 4 caixas",
  "CASH & CARRY":"dos atacarejos","ATACADO GROSSISTA":"dos atacados","REDE":"das lojas da rede"};
const segFrase=sg=>SEG_FRASE[String(sg||"").toUpperCase()]||("das lojas "+String(sg||"").toLowerCase());
const SEG_NOME={"SUPER":"supermercados","HIPER":"hipermercados","AS 1-4":"lojas de autosserviço",
  "CASH & CARRY":"atacarejos","ATACADO GROSSISTA":"atacados","REDE":"lojas da rede"};
const segNome=sg=>SEG_NOME[String(sg||"").toUpperCase()]||("lojas "+String(sg||"").toLowerCase());
/* Os tres meses da base, por extenso, a partir do mes atual ("202609"). */
function tresMeses(mes){ const N=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const a=Number(String(mes||"").slice(0,4)), m=Number(String(mes||"").slice(4));
  if(!a||!m) return "nos últimos três meses";
  const ns=[m-2,m-1,m].map(x=>N[(x+11)%12]); return `em ${ns[0]}, ${ns[1]} e ${ns[2]}`; }

function totalOport(it){
  const c=it.contagem||{}, f=fator(it); let u=0, tocou=false;
  for(const [k] of LOCAIS){
    const cx=c[k+"cx"], un=c[k+"un"];
    if(cx!=null||un!=null) tocou=true;
    u+=(Number(cx)||0)*f+(Number(un)||0);
  }
  return {un:u, cx:u/f, tocou:tocou||!!c.naoTem};
}
const zeradoOport=it=>{ const t=totalOport(it); return t.tocou && t.un===0; };
/* Zerado precisa de motivo; e "Outro" precisa dizer qual. "Nunca comprou"
   nao: a loja nao ter o produto e justamente o esperado. */
const semMotivoOport=it=>{ const c=it.contagem||{};
  return it.classe!=="nunca" && zeradoOport(it) && (!c.motivo || (c.motivo==="outro" && !String(c.obs||"").trim())); };
const rupturaOport=it=>it.classe!=="nunca" && zeradoOport(it);

function enviaOportunidade(it){
  const c=it.contagem||{}, t=totalOport(it);
  const val=k=>c[k]==null?null:c[k];
  grava("contagem","visita_id,produto_id",{
    visita_id:LOJA.visita?LOJA.visita.id:null, loja_id:LOJA.id,
    produto_id:it.produto_id, data:DIA.data,
    gondola_cx:val("gcx"), gondola_un:val("gun"),
    deposito_cx:val("dcx"), deposito_un:val("dun"),
    ilha_cx:val("icx"), ilha_un:val("iun"),
    checkout_cx:val("kcx"), checkout_un:val("kun"),
    estoque_gondola: t.tocou? Math.round((Number(c.gcx)||0)*fator(it)+(Number(c.gun)||0)) : null,
    estoque_deposito: t.tocou? Math.round((Number(c.dcx)||0)*fator(it)+(Number(c.dun)||0)) : null,
    ruptura: rupturaOport(it), ruptura_motivo: rupturaOport(it)?(c.motivo||null):null,
    ruptura_obs: rupturaOport(it)&&c.motivo==="outro"?(String(c.obs||"").trim()||null):null,
    oportunidade: it.classe});
}

function resumoOport(l){
  const o=oportDe(l), its=o.itens||[], n=k=>its.filter(x=>x.classe===k).length;
  return {total:its.length, feitos:its.filter(x=>totalOport(x).tocou).length,
          semMotivo:its.filter(semMotivoOport).length,
          ruptura:n("ruptura"), abaixo:n("abaixo"), excesso:n("excesso"), nunca:n("nunca")};
}

let VER_TODAS=false, FILTRO_OP="todos";
/* Enquanto os dados do modulo nao chegaram: diz isso, busca, e volta sozinho
   para o modulo quando chegarem. Sem botao de concluir. */
function telaEsperando(k, titulo, oque, buscar, depois){ montar(()=>{ TELA="espera:"+k; esconderTudo();
  topo(titulo, ()=>telaLoja(), "");
  const erro=ERRO_BUSCA[k];
  $("corpo").innerHTML = erro
    ? `<div class="aviso err"><b>Não consegui buscar ${oque} desta loja.</b><br>${esc(traduz(erro))}</div><button class="bt" id="tentaEsp">Tentar de novo</button>`
    : `<div class="vazio">${navigator.onLine?`Buscando ${oque} desta loja…`:`Sem sinal. ${oque[0].toUpperCase()+oque.slice(1)} aparecem quando a internet voltar.`}</div>`;
  rodape(`<button class="bt sec" id="volEsp">Voltar</button>`); $("volEsp").onclick=()=>telaLoja();
  /* uma tentativa por vez: se nao chegou, mostra o motivo e o botao, sem buscar de novo sozinha */
  const vai=async()=>{ delete ERRO_BUSCA[k]; try{ await buscar(); }catch(e){ ERRO_BUSCA[k]=e.message; }
    if(!chegou(k)) ERRO_BUSCA[k]=ERRO_BUSCA[k]||"O sistema não respondeu.";
    if(TELA==="espera:"+k) (chegou(k)?depois():telaEsperando(k,titulo,oque,buscar,depois)); };
  if($("tentaEsp")) $("tentaEsp").onclick=()=>{ $("corpo").innerHTML=`<div class="vazio">Buscando ${oque} desta loja…</div>`; vai(); };
  else if(navigator.onLine) vai();
});}
/* Na virada do mes, a Oportunidade mostra o mes que acabou de fechar (o banco
   decide, pelo ritmo do mes novo). Os rotulos dizem de qual mes e o numero. */
const nomeMesOport=m=>{ const N=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const k=Number(String(m||"").slice(4)); return N[k-1]||"o mês passado"; };
const mesFechado=m=>!!m&&!!DATA&&String(m)<DATA.slice(0,4)+DATA.slice(5,7);
const rotuloMesOport=m=>mesFechado(m)?`Comprou em ${nomeMesOport(m)}`:"Comprou este mês";
function telaOportunidade(){ if(!chegou("oport")) return telaEsperando("oport","Oportunidade de Estoque","as oportunidades",()=>buscarOportunidades(DATA),telaOportunidade);
  montar(()=>{ TELA="mod"; esconderTudo();
  const o=oportDe(LOJA), todas=o.itens||[], lim=o.limite||15;
  topo("Oportunidade de Estoque", ()=>{ VER_TODAS=false; FILTRO_OP="todos"; telaLoja(); }, "");

  if(o.sem_base || !todas.length){
    $("corpo").innerHTML=`<div class="vazio">${o.sem_base
      ?"A base de vendas ainda não foi carregada. Sem ela o app não sabe o que esta loja compra normalmente."
      :"Nenhuma oportunidade nesta loja: tudo o que ela compra com regularidade está pedindo dentro do normal, e ela já trabalha com o mix das lojas parecidas."}</div>`;
    rodape(botaoConcluir("contagem")||`<button class="bt sec" onclick="telaLoja()">Voltar</button>`);
    ligaConcluir(()=>({ok:true, resultado:"nada_a_registrar"}));
    return poeSolicitacoes("contagem");
  }

  const u=unidAtual(), rot=u==="cx"?"cx":"un";
  const r=resumoOport(LOJA);
  const fmt=n=>Number(n).toLocaleString("pt-BR",{maximumFractionDigits:1});
  const volumeTxt=(cx,it)=> u==="cx" ? `${fmt(cx)} cx`
    : `${Math.round(Number(cx)*fator(it)).toLocaleString("pt-BR")} un`;
  /* caixas (ou unidades) em jogo no filtro, na volumetria escolhida */
  const somaJogo=k=>todas.filter(x=>k==="todos"||x.classe===k)
    .reduce((a,x)=>a+Number(x.em_jogo_cx||0)*(u==="cx"?1:fator(x)),0);

  /* Os filtros sao os proprios cartoes de resumo: cada um mostra quantos e
     quantas caixas estao em jogo, e tocando filtra a lista. */
  const tiles=[["todos","Todos",null,todas.length], ...ORDEM_CLASSE.map(k=>[k,CLASSE[k].curto||CLASSE[k].t,CLASSE[k].cor,r[k]])]
    .filter(([k,,,n])=>k==="todos"||n>0);
  if(FILTRO_OP!=="todos"&&!r[FILTRO_OP]) FILTRO_OP="todos";
  const filtradas=todas.filter(x=>FILTRO_OP==="todos"||x.classe===FILTRO_OP);
  const lista=VER_TODAS?filtradas:filtradas.slice(0,lim);

  const cartao=(it,i)=>{
    const cl=CLASSE[it.classe]||{}, c=it.contagem||{}, t=totalOport(it), nunca=it.classe==="nunca";
    const ativos=c.locais||LOCAIS.map(x=>x[0]).filter(k=>c[k+"cx"]!=null||c[k+"un"]!=null);
    const valor=k=>u==="cx"?c[k+"cx"]:c[k+"un"];
    const pct=Number(it.normal_cx)>0?Number(it.pedido_cx)/Number(it.normal_cx):0;
    /* Conta que o repositor confere de cabeca: costuma comprar menos o que
       comprou. O ritmo do mes continua por dentro, so para decidir quem esta
       abaixo no meio do mes; aqui ele nao aparece. */
    const falta=Math.max(0, Number(it.normal_cx||0)-Number(it.pedido_cx||0));
    const aMais=Math.max(0, Number(it.pedido_cx||0)-Number(it.normal_cx||0));
    const quantas = it.lojas_segmento ? `${it.lojas_pares} de ${it.lojas_segmento}` : `${it.penetracao}%`;
    const met=nunca
      ? `<div><small>${esc(segNome(it.segmento))} que compram todo mês</small><b>${quantas}</b></div>
         <div><small>Cada um compra</small><b>${volumeTxt(it.normal_cx,it)}/mês</b></div>
         <div><small>Esta loja</small><b style="color:${cl.cor}">nunca comprou</b></div>`
      : `<div><small>Costuma comprar</small><b>${volumeTxt(it.normal_cx,it)}/mês</b></div>
         <div><small>${rotuloMesOport(o.mes)}</small><b>${volumeTxt(it.pedido_cx,it)}</b></div>
         ${it.classe==="excesso"
           ? `<div><small>Comprou a mais</small><b style="color:${cl.cor}">${volumeTxt(aMais,it)}</b></div>`
           : `<div><small>Falta para o mês normal</small><b style="color:${cl.cor}">${volumeTxt(falta,it)}</b></div>`}`;
    return `<div class="op" data-o="${i}" style="--c:${cl.cor};--cb:${cl.bg}">
      <div class="cab"><div class="nm">${esc(it.nome)}
          <div class="em">${esc(it.embalagem||"")}${fator(it)>1?` · 1 cx = ${fator(it)} un`:""}</div></div>
        <span class="tag">${cl.t}</span></div>
      <div class="met">${met}</div>
      <div class="fazer"><b>O que fazer:</b> ${nunca
        ? `<b>${it.lojas_segmento?`${it.lojas_pares} dos ${it.lojas_segmento} ${esc(segNome(it.segmento))}`:`${it.penetracao}% ${esc(segFrase(it.segmento))}`}</b>
           que a Bandeirantes atende compram este produto todo mês, e esta loja não comprou nenhuma vez ${esc(tresMeses(o.mes))}.
           Se ela tiver por outro fornecedor, marque onde está. Se não tiver, marque Não trabalha: isso chega para o seu líder e o gerente como oportunidade de venda.`
        : esc(cl.fazer)}</div>
      <div class="corpo-op">
        <div class="onde">${nunca?"Tem na loja?":"Onde está na loja?"}</div>
        <div class="locs" data-loc="${i}">
          ${LOCAIS.map(([k,n])=>`<button data-k="${k}" class="${ativos.includes(k)?"on":""}">${n}</button>`).join("")}
          <button data-k="x" class="nt ${c.naoTem?"on":""}">${nunca?"Não trabalha":"Não tem"}</button>
        </div>
        ${ativos.length?`<div class="qtds">${ativos.map(k=>`
          <div style="grid-column:1/-1"><label>${LOCAIS.find(x=>x[0]===k)[1]}</label>
            <div class="qt2">${fator(it)>1?`
              <span><input type="number" inputmode="decimal" min="0" step="0.5" data-q="${k}" data-u="cx" value="${c[k+"cx"]??""}" placeholder="0"><small>caixas</small></span>`:""}
              <span><input type="number" inputmode="numeric" min="0" step="1" data-q="${k}" data-u="un" value="${c[k+"un"]??""}" placeholder="0"><small>unidades</small></span>
            </div></div>`).join("")}
        </div>`:""}
        ${t.tocou&&!c.naoTem?`<div class="tot">Total contado <b>${u==="cx"?fmt(t.cx)+" cx":Math.round(t.un).toLocaleString("pt-BR")+" un"}</b>${fator(it)>1?` · ${u==="cx"?Math.round(t.un).toLocaleString("pt-BR")+" un":fmt(t.cx)+" cx"}`:""}</div>`:""}
        ${rupturaOport(it)?`<div class="onde">Por que não tem?</div><div class="pilha" data-mo="${i}" style="margin-top:0">
          ${MOTIVOS.map(m=>`<button class="${c.motivo===m[0]?"on meio":""}" data-v="${m[0]}">${m[1]}</button>`).join("")}</div>
          ${c.motivo==="outro"?`<textarea data-obs="${i}" rows="2" placeholder="Qual o motivo?"
            style="width:100%;margin-top:8px;font:inherit;padding:10px;border:1px solid ${String(c.obs||"").trim()?"var(--linha)":"var(--verm)"};border-radius:12px">${esc(c.obs||"")}</textarea>`:""}`:""}
      </div></div>`;
  };

  const grupo=k=>{ const its=lista.filter(x=>x.classe===k); if(!its.length) return "";
    return (FILTRO_OP==="todos"?`<h2 class="tit" style="color:${CLASSE[k].cor};margin-top:14px">${CLASSE[k].t.toUpperCase()} · ${its.length}
      <span style="font-weight:400;color:var(--ink3);text-transform:none;letter-spacing:0"> · ${CLASSE[k].d}</span></h2>`:"")
      + its.map(x=>cartao(x,todas.indexOf(x))).join(""); };

  $("corpo").innerHTML=`
    <div class="abas" id="unid" style="margin-bottom:12px">
      <button data-u="cx" class="${u==="cx"?"on":""}">Caixa física</button>
      <button data-u="un" class="${u==="un"?"on":""}">Unidade</button></div>
    <div class="st-fila" id="filtros">${tiles.map(([k,t,cor,n])=>`
      <button class="st ${FILTRO_OP===k?"on":""}" data-f="${k}" ${cor?`style="--c:${cor}"`:""}>
        <span class="rot">${cor?"<i></i>":""}${t}</span><span class="n">${n}</span>
        <span class="cx">${k==="todos"?"para conferir":CLASSE[k].fila}</span></button>`).join("")}</div>
    ${mesFechado(o.mes)?`<div class="aviso inf"><b>Começo de mês: estes números são de ${nomeMesOport(o.mes)}, que acabou de fechar.</b> Assim que a loja típica tiver comprado um quarto do mês, a lista passa a mostrar ${nomeMesOport(DATA.slice(0,4)+DATA.slice(5,7))}.</div>`:""}
    ${ERRO_BUSCA.oport?`<div class="aviso amb"><b>Não consegui atualizar as oportunidades</b>${guarda.ler("oport_em:"+DATA)?`; estes números são de ${new Date(guarda.ler("oport_em:"+DATA)).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`:""}.<br>${esc(traduz(ERRO_BUSCA.oport))}
      <button class="bt sec" id="tentaOp" style="margin-top:8px">Tentar de novo</button></div>`:""}
    ${r.semMotivo?`<div class="aviso err"><b>${r.semMotivo} ${r.semMotivo===1?"produto zerado sem motivo":"produtos zerados sem motivo"}.</b> Informe por que zerou antes de concluir.</div>`:""}
    <div class="emb" style="margin:2px 2px 4px">${lista.length<filtradas.length?`As ${lista.length} mais importantes, de ${filtradas.length}`:`${filtradas.length} ${filtradas.length===1?"produto":"produtos"}`}
      · ${filtradas.filter(x=>totalOport(x).tocou).length} registrados</div>
    ${FILTRO_OP==="todos"?ORDEM_CLASSE.map(grupo).join(""):lista.map(x=>cartao(x,todas.indexOf(x))).join("")}
    ${filtradas.length>lim?`<button class="bt sec" id="vertodas" style="margin-top:6px">${VER_TODAS?"Ver só as principais":`Ver todas as ${filtradas.length}`}</button>`:""}`;

  $("filtros").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ FILTRO_OP=b.dataset.f; VER_TODAS=false; telaOportunidade(); });
  if($("tentaOp")) $("tentaOp").onclick=async()=>{ $("tentaOp").textContent="Buscando…"; await buscarOportunidades(DATA); telaOportunidade(); };
  $("unid").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const novo=b.dataset.u, velho=unidAtual(); if(novo===velho) return;
    if(!exigeVisita()) return;
    /* So muda como os numeros aparecem: o que foi digitado em caixas e em
       unidades fica como esta. */
    guarda.por("unid",novo); salvarCache(); telaOportunidade();
  });
  if($("vertodas")) $("vertodas").onclick=()=>{ VER_TODAS=!VER_TODAS; telaOportunidade(); };

  const salva=it=>{ guarda.porJ("oport:"+DATA,OPORT); enviaOportunidade(it); };
  $("corpo").querySelectorAll("[data-loc]").forEach(g=>{ const it=todas[+g.dataset.loc];
    g.querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(!exigeVisita()) return;
      it.contagem=it.contagem||{}; const c=it.contagem, k=b.dataset.k;
      if(k==="x"){
        c.naoTem=!c.naoTem;
        if(c.naoTem){ LOCAIS.forEach(([q])=>{ c[q+"cx"]=null; c[q+"un"]=null; }); c.locais=[]; }
      } else {
        c.naoTem=false;
        const at=c.locais||LOCAIS.map(x=>x[0]).filter(q=>c[q+"cx"]!=null||c[q+"un"]!=null);
        c.locais=at.includes(k)?at.filter(q=>q!==k):[...at,k];
        if(!c.locais.includes(k)){ c[k+"cx"]=null; c[k+"un"]=null; }
      }
      salva(it); telaOportunidade(); }); });
  $("corpo").querySelectorAll("input[data-q]").forEach(inp=>inp.onchange=()=>{
    if(!exigeVisita()){ inp.value=""; return; }
    const it=todas[+inp.closest("[data-o]").dataset.o]; it.contagem=it.contagem||{};
    /* cada caixinha guarda o seu: caixas e unidades somam no total */
    const k=inp.dataset.q, un=inp.dataset.u||unidAtual(), v=inp.value===""?null:Number(inp.value);
    it.contagem[k+un]=v;
    if(rupturaOport(it)&&!it.contagem.motivo) alerta("Zerado. Informe por que não tem.");
    salva(it); telaOportunidade(); });
  $("corpo").querySelectorAll("[data-mo]").forEach(g=>{ const it=todas[+g.dataset.mo];
    g.querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(!exigeVisita()) return;
      it.contagem.motivo=b.dataset.v; salva(it); telaOportunidade();
      if(b.dataset.v==="outro"){ const tx=$("corpo").querySelector(`[data-obs="${g.dataset.mo}"]`); if(tx) tx.focus(); } }); });
  $("corpo").querySelectorAll("textarea[data-obs]").forEach(tx=>{ const it=todas[+tx.dataset.obs];
    tx.oninput=()=>{ it.contagem.obs=tx.value; guarda.porJ("oport:"+DATA,OPORT); };
    tx.onchange=()=>{ it.contagem.obs=tx.value.trim(); salva(it); telaOportunidade(); }; });

  rodape((r.ruptura||r.abaixo||r.excesso||r.nunca?botaoAvisar("ruptura").replace('class="bt"','class="bt sec"'):"")
    + botaoConcluir("contagem"));
  ligaAvisar();
  ligaConcluir(()=>{ const x=resumoOport(LOJA), alvo=Math.min(x.total, oportDe(LOJA).limite||15);
    if(x.semMotivo) return {ok:false, msg:`${x.semMotivo} ${x.semMotivo===1?"produto zerado":"produtos zerados"} sem motivo. Informe antes de concluir.`};
    if(!x.total) return {ok:true, resultado:"nada_a_registrar"};
    if(x.feitos<alvo) return {ok:true, confirmar:`Você registrou ${x.feitos} de ${alvo}. Concluir assim mesmo?`};
    return {ok:true}; });
  poeSolicitacoes("contagem");
});}
const telaContagem=telaOportunidade;   // nome antigo, caso algo ainda chame

/* ------------------ 2. controle de vencimentos -----------------
   O lote perto de vencer vira ACOMPANHAMENTO: fica ativo entre visitas, e a
   cada visita o repositor diz quanto sobrou, ate zerar. Qualquer repositor da
   loja ve e atualiza. Zerou ou retirou tudo, o acompanhamento fecha sozinho.

   Concluir o modulo exige contar TODOS os lotes ativos nesta visita. E isso
   que garante que o produto e acompanhado ate acabar, e nao esquecido.
   Quantidade em unidades: produto perto de vencer se conta na gondola.
------------------------------------------------------------- */
/* "So registrei e avisei" e "remarquei o preco" sairam da tela. Continuam no
   banco para o historico, mas nao sao mais oferecidas. */
const ACOES=[["girar","Mudei de lugar para girar"],["troca","Acionei troca"],
  ["retirar","Retirei da gôndola"],["outro","Outro"]];

function cardLote(x,i){
  const nv=nivelLote(x), ativo=x.status!=="encerrado", h=x.hoje||{};
  const ultimo=x.ultimo||(x.registrado_em?{quantidade:x.quantidade_inicial,em:x.registrado_em,por:x.registrado_por}:null);
  const ini=Number(x.quantidade_inicial)||0, atual=Number(x.quantidade_atual)||0;
  const giro=ini>0?Math.round((1-atual/ini)*100):null;
  return `<div class="item ${nv.k==="vencido"||nv.k==="critico"?"crit":nv.k==="atencao"?"aten":""}" data-l="${i}"
      style="${ativo?"":"opacity:.7"}">
    <div style="display:flex;gap:8px;align-items:flex-start">
      <div style="flex:1;min-width:0"><div class="nome">${esc(x.nome||"Produto")}</div>
        <div class="emb">${x.lote?`Lote ${esc(x.lote)} · `:""}vence ${dataBr(x.vence_em)}</div></div>
      <span class="selo" style="background:${ativo?nv.bg:"var(--verde-bg)"};color:${ativo?nv.cor:"var(--verde)"};flex:none">
        ${ativo?nv.t:x.encerramento==="retirado"?"retirado":"acabou"}</span></div>
    <div class="emb" style="margin-top:7px;color:var(--ink2)">
      ${ini?`Registrado: <b>${ini} un</b>`:""}${ultimo&&!x.registrado_hoje?` · última contagem <b>${Number(ultimo.quantidade)} un</b> em ${dataBr(String(ultimo.em).slice(0,10)).slice(0,5)}${ultimo.por?" por "+esc(String(ultimo.por).split(" ")[0]):""}`:""}
      ${giro!=null&&giro>0?` · <b style="color:var(--verde)">${giro}% já saiu</b>`:""}</div>
    ${x.registrado_hoje?`<div class="emb" style="margin-top:6px">Registrado agora. Na próxima visita o app pede a contagem.</div>`
    :ativo||h.quantidade!=null?`
      <label style="margin-top:10px">Quanto sobrou hoje (un)</label>
      <div class="ptm" style="margin-top:4px">
        <input type="number" inputmode="numeric" min="0" enterkeyhint="done" data-q="${i}"
          value="${x._rascQtd??h.quantidade??""}" placeholder="unidades">
        <button data-salvar="${i}" style="${x._pendente||h.quantidade==null?"":"background:var(--verde-bg);color:var(--verde)"}">
          ${x._pendente||h.quantidade==null?"Salvar":"Salvo \u2713"}</button>
        <button data-zero="${i}" style="background:var(--papel);color:var(--ink);border:1px solid var(--linha)">Acabou</button></div>
      <div class="pilha" data-a="${i}">${ACOES.map(a=>`<button class="${h.acao===a[0]?(a[0]==="outro"?"on meio":"on"):""}" data-v="${a[0]}">${a[1]}</button>`).join("")}</div>
      ${h.acao==="outro"?`<textarea data-obs="${i}" rows="2" placeholder="O que foi feito?"
        style="width:100%;margin-top:8px;font:inherit;padding:10px;border:1px solid ${String(h.obs||"").trim()?"var(--linha)":"var(--verm)"};border-radius:12px">${esc(h.obs||"")}</textarea>`:""}
      ${x._pendente?`<div class="emb" style="color:var(--verm);margin-top:6px">Alterado e ainda não salvo.</div>`:""}`:""}
  </div>`;
}

function telaValidade(){ if(!chegou("venc")) return telaEsperando("venc","Controle de Vencimentos","os lotes",()=>buscarVencimentos(DATA),telaValidade);
  montar(()=>{ TELA="mod"; esconderTudo();
  topo("Controle de Vencimentos", ()=>telaLoja(), "");
  const lotes=lotesDe(LOJA).slice().sort((a,b)=>String(a.vence_em).localeCompare(String(b.vence_em)));
  const ativos=lotes.filter(x=>x.status!=="encerrado"), fechados=lotes.filter(x=>x.status==="encerrado");
  const falta=ativos.filter(pedeContagem).length;
  const venc=ativos.filter(x=>diasAte(x.vence_em)<0).length, crit=ativos.filter(x=>nivelLote(x).k==="critico").length;
  $("corpo").innerHTML=`
    ${ativos.length?`<div class="aviso ${venc||crit?"err":"amb"}"><b>${ativos.length} ${ativos.length===1?"lote em acompanhamento":"lotes em acompanhamento"}</b>
      ${venc?` · ${venc} vencido`:""}${crit?` · ${crit} crítico`:""}<br>
      ${falta?`Falta contar ${falta}. Diga quanto sobrou de cada um até acabar.`:"Todos contados nesta visita."}</div>`
      :`<div class="aviso inf">Nenhum lote perto de vencer em acompanhamento nesta loja.</div>`}
    ${ativos.length?`<h2 class="tit">EM ACOMPANHAMENTO</h2>`+ativos.map(x=>cardLote(x,lotes.indexOf(x))).join(""):""}
    ${fechados.length?`<h2 class="tit">ENCERRADOS HOJE</h2>`+fechados.map(x=>cardLote(x,lotes.indexOf(x))).join(""):""}`;

  /* O Salvar e o unico ponto que grava. Antes a quantidade gravava quando o
     dedo saia do campo: invisivel para quem esta na loja, que nao sabia se
     tinha ficado. Acao e texto marcam o lote como alterado ate salvar. */
  const enviar=x=>{
    const hh=x.hoje||{};
    if(hh.quantidade==null){ alerta("Digite quanto sobrou antes de salvar."); return false; }
    if(hh.acao==="outro"&&!String(hh.obs||"").trim()){ alerta("Escreva o que foi feito no campo Outro."); return false; }
    grava("validade_movimento","validade_id,visita_id",{id:uid(), validade_id:x.id, visita_id:LOJA.visita.id,
      loja_id:LOJA.id, pessoa_id:DIA.pessoa.id, quantidade:hh.quantidade, acao:hh.acao||null,
      observacao:hh.acao==="outro"?String(hh.obs).trim():null});
    x.quantidade_atual=hh.quantidade;
    const fecha=Number(hh.quantidade)<=0||hh.acao==="retirar";
    x.status=fecha?"encerrado":"ativo"; x.encerramento=fecha?(hh.acao==="retirar"?"retirado":"esgotado"):null;
    delete x._pendente; delete x._rascQtd;
    salvaVenc(); return true;
  };
  const salvar=x=>{ if(!exigeVisita()) return;
    const inp=$("corpo").querySelector(`input[data-q="${lotes.indexOf(x)}"]`);
    const bruto=inp?inp.value:(x._rascQtd??"");
    const v=bruto===""?null:Math.max(0,Math.round(Number(bruto)));
    if(v==null) return alerta("Digite quanto sobrou antes de salvar.");
    const antes=Number(x.quantidade_atual)||0;          /* o saldo que o lote tem agora */
    if(antes&&v>antes&&!confirm(`Tinha ${antes} un e agora tem ${v}. Chegou mais do mesmo lote?`)) return;
    x.hoje=Object.assign({},x.hoje||{},{quantidade:v});
    if(enviar(x)) telaValidade(); };
  $("corpo").querySelectorAll("input[data-q]").forEach(inp=>{ const x=lotes[+inp.dataset.q];
    inp.oninput=()=>{ x._rascQtd=inp.value; x._pendente=true;       /* sem redesenhar: o teclado fica aberto */
      const b=$("corpo").querySelector(`[data-salvar="${inp.dataset.q}"]`);
      if(b){ b.textContent="Salvar"; b.removeAttribute("style"); } };
    inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); salvar(x); } }; });
  $("corpo").querySelectorAll("[data-salvar]").forEach(b=>b.onclick=()=>salvar(lotes[+b.dataset.salvar]));
  $("corpo").querySelectorAll("[data-zero]").forEach(b=>b.onclick=()=>{ if(!exigeVisita()) return;
    const x=lotes[+b.dataset.zero]; x.hoje=Object.assign({},x.hoje||{},{quantidade:0}); if(enviar(x)) telaValidade(); });
  $("corpo").querySelectorAll("[data-a]").forEach(g=>{ const x=lotes[+g.dataset.a];
    g.querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(!exigeVisita()) return;
      x.hoje=Object.assign({},x.hoje||{}); x.hoje.acao=x.hoje.acao===b.dataset.v?null:b.dataset.v;
      x._pendente=true; salvaVenc(); telaValidade();
      if(b.dataset.v==="outro"){ const tx=$("corpo").querySelector(`[data-obs="${g.dataset.a}"]`); if(tx) tx.focus(); } }); });
  $("corpo").querySelectorAll("textarea[data-obs]").forEach(tx=>{ const x=lotes[+tx.dataset.obs];
    tx.oninput=()=>{ x.hoje.obs=tx.value; x._pendente=true; salvaVenc(); }; });

  rodape(editavel()
    ? `<button class="bt sec" onclick="telaNovaValidade()">Registrar lote</button>` + botaoConcluir("validade")
    : null);
  if(ativos.length&&editavel()){
    const d=document.createElement("div"); d.innerHTML=botaoAvisar("validade").replace('class="bt"','class="bt sec" style="margin-top:6px"');
    $("corpo").appendChild(d.firstElementChild); }
  ligaAvisar();
  ligaConcluir(()=>{
    const pend=lotesDe(LOJA).filter(x=>x._pendente);
    if(pend.length) return {ok:false, msg:`${pend.length} ${pend.length===1?"lote foi alterado":"lotes foram alterados"} e não salvo: ${pend.slice(0,2).map(x=>x.nome).join(", ")}. Toque em Salvar.`};
    const semContar=lotesAtivos(LOJA).filter(pedeContagem);
    if(semContar.length) return {ok:false, msg:`Falta contar ${semContar.length} ${semContar.length===1?"lote":"lotes"}: ${semContar.slice(0,2).map(x=>x.nome).join(", ")}. Diga quanto sobrou.`};
    const vencSem=lotesAtivos(LOJA).filter(x=>diasAte(x.vence_em)<0&&Number(x.quantidade_atual)>0&&!(x.hoje&&x.hoje.acao)&&!x.registrado_hoje);
    if(vencSem.length) return {ok:false, msg:`${vencSem.length} ${vencSem.length===1?"lote vencido continua":"lotes vencidos continuam"} na loja sem ação. Diga o que foi feito.`};
    if(!lotesDe(LOJA).length) return {ok:true, resultado:"nada_a_registrar", confirmar:"Nenhum produto perto de vencer nesta loja. Concluir assim?"};
    return {ok:true}; });
  poeSolicitacoes("validade");
});}

function telaNovaValidade(){ montar(()=>{ TELA="mod"; esconderTudo();
  /* A lista junta o catalogo da loja com o que aparece na Oportunidade de
     Estoque, para achar o produto mesmo que ele tenha vendido pouco. */
  const vistos=new Set(), cat=[];
  [...(LOJA.catalogo||[]), ...(oportDe(LOJA).itens||[])].forEach(x=>{ if(!vistos.has(x.produto_id)){ vistos.add(x.produto_id); cat.push(x); } });
  cat.sort((a,b)=>String(a.nome).localeCompare(String(b.nome)));
  topo("Registrar lote", telaValidade, "");
  const novo={id:uid()};
  $("corpo").innerHTML=`
    <div class="aviso inf">O lote fica em acompanhamento: em cada visita o app pede quanto sobrou, até acabar.</div>
    <div class="campo"><label for="lotProd">Produto</label><select id="lotProd"><option value="">Escolha…</option>
      ${cat.map(x=>`<option value="${x.produto_id}">${esc(x.nome)}</option>`).join("")}</select></div>
    <div class="campo"><label for="lotVence">Vence em</label><input id="lotVence" type="date"></div>
    <div class="campo"><label for="lotLote">Lote, se tiver</label><input id="lotLote" autocapitalize="characters"></div>
    <div class="campo"><label for="lotQtd">Quantidade na loja agora (un)</label><input id="lotQtd" type="number" inputmode="numeric" min="1"></div>
    <div class="campo" id="fotoLote"><label>Foto do lote, se puder</label>${blocoFoto(novo)}</div><div id="lotErro"></div>`;
  /* A foto vai direto para o armazenamento e o lote aponta para ela ao salvar. */
  const ligaFotoLote=()=>{ $("fotoLote").innerHTML=`<label>Foto do lote, se puder</label>${blocoFoto(novo)}`;
    ligaFoto($("fotoLote"), novo, {tabela:"validade", semRegistro:true}, ligaFotoLote); };
  ligaFotoLote();
  rodape(`<button class="bt" id="ok">Salvar</button>`);
  $("ok").onclick=()=>{ if(!exigeVisita()) return;
    /* Nomes proprios nos campos: antes o "q" da quantidade era confundido com a
       caixa de busca da tela inicial, que tambem se chamava "q", e o lote nunca salvava. */
    const pid=$("lotProd").value, d=$("lotVence").value, q=$("lotQtd").value===""?null:Math.round(Number($("lotQtd").value));
    /* sem quantidade nao ha o que acompanhar */
    if(!pid||!d||!q||q<1){ $("lotErro").innerHTML=`<div class="aviso err">${!pid?"Escolha o produto.":!d?"Informe a data de vencimento.":"Informe a quantidade que está na loja agora."}</div>`; return; }
    const prod=cat.find(x=>x.produto_id===pid)||{};
    const reg={id:novo.id, ...base(), produto_id:pid, vence_em:d, lote:$("lotLote").value.trim()||null,
      quantidade:q, quantidade_inicial:q, quantidade_atual:q, status:"ativo", acao:null, foto_url:novo.foto_url||null};
    grava("validade","id",reg);
    VENC=VENC||{}; (VENC[LOJA.id]=VENC[LOJA.id]||[]).push({id:reg.id, produto_id:pid, nome:prod.nome, embalagem:prod.embalagem,
      lote:reg.lote, vence_em:d, quantidade_inicial:q, quantidade_atual:q, status:"ativo",
      registrado_em:new Date().toISOString(), registrado_por:DIA.pessoa.nome, registrado_hoje:true});
    salvaVenc(); telaValidade(); };
});}

/* ------------------- 3. informacoes de vendas -----------------
   Os pedidos da loja no desenho do RTM, que o comercial ja conhece: card com
   nota, loja, data, produtos, caixas, total e entrega; e o detalhe com o valor
   da caixa e o da unidade dentro dela.

   A situacao junta duas fontes: o status do ERP (aberta ou acertada) e o que
   o repositor viu na loja. Aberta nao quer dizer que nao chegou: pode ter
   chegado e nao ter acertado no caixa. Quem separa as duas coisas e o
   repositor, confirmando no detalhe.
------------------------------------------------------------- */
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto",
             "setembro","outubro","novembro","dezembro"];
const dataLonga=d=>{ const [a,m,dd]=String(d).slice(0,10).split("-").map(Number);
  return `${dd} de ${MESES[m-1]} de ${a}`; };
const reais=v=>"R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const cxTxt=n=>{ const v=Number(n||0); return `${v.toLocaleString("pt-BR",{maximumFractionDigits:1})} ${v===1?"Caixa":"Caixas"}`; };

/* A situacao que o repositor enxerga, em ordem de importancia. */
/* Origem do pedido, no desenho do RTM. */
const ORIGEM={"COKE TOGO":{t:"COKE TOGO",c:"#1672A8",b:"#E7F3FB",
    ic:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>'},
  "INFOCOM":{t:"INFOCOM",c:"#0E7C7B",b:"#E3F4F3",
    ic:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>'},
  "B2B":{t:"B2B",c:"#6D4BC4",b:"#F0EBFB",
    ic:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 21V8l9-5 9 5v13M9 21v-6h6v6"/></svg>'},
  "EDI":{t:"EDI",c:"#4B5563",b:"#EEF0F2",
    ic:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>'}};
const origemDe=o=>ORIGEM[String(o||"").toUpperCase()]||(o?{t:String(o).toUpperCase(),c:"#4B5563",b:"#EEF0F2",ic:""}:null);
const COR_CANAL={"COKE TOGO":"#1672A8","INFOCOM":"#0E7C7B","B2B":"#6D4BC4","EDI":"#9CA3AF"};

function situacaoPedido(n){
  const conf=n.conferido&&n.conferido.situacao;
  if(n.status==="ACERTADA") return {k:"entregue", t:"Acertado", cor:"var(--verde)", bg:"var(--verde-bg)"};
  if(conf==="chegou")       return {k:"entregue", t:"Chegou · sem acerto", cor:"var(--verde)", bg:"var(--verde-bg)"};
  if(conf==="nao_chegou")   return {k:"aberto",   t:"Não chegou", cor:"var(--verm)", bg:"var(--verm-bg)"};
  if(conf==="parcial")      return {k:"aberto",   t:"Chegou em parte", cor:"var(--amb)", bg:"var(--amb-bg)"};
  if(n.dias>0)              return {k:"aberto",   t:`Em aberto há ${n.dias} ${n.dias===1?"dia":"dias"}`, cor:"var(--amb)", bg:"var(--amb-bg)"};
  return                           {k:"caminho",  t:"A caminho", cor:"var(--azul)", bg:"var(--azul-bg)"};
}
const FILTROS=[["todos","Todos"],["caminho","A caminho"],["aberto","Em aberto"],["entregue","Acertados"]];
let FILTRO_PED="todos";

function textoPedido(n){
  const its=(n.itens||[]).map(i=>`• ${i.nome}: ${cxTxt(i.caixas)}`).join("\n");
  return `Pedido NF ${n.numero}\n${LOJA.codigo} · ${LOJA.nome}\nEmitido em ${dataBr(n.emissao)} · entrega ${dataBr(n.previsao)}\n`
    +`${cxTxt(n.caixas)} · ${reais(n.valor)}\nSituação: ${situacaoPedido(n).t}\n\n${its}`;
}
function compartilharPedido(n){
  const t=textoPedido(n);
  if(navigator.share) navigator.share({title:"Pedido NF "+n.numero, text:t}).catch(()=>{});
  else open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
}

/* Foto do produto vem do servidor de imagens do RTM. Se nao carregar (sem
   sinal, endereco mudou, produto sem foto), a imagem some e fica o nome no
   lugar, em vez do icone de imagem quebrada. */
function fotoFalhou(img){
  const nome=img.getAttribute("alt")||"";
  if(img.classList.contains("pifoto")){ const d=document.createElement("div"); d.className="semfoto"; d.textContent="foto não carregou"; img.replaceWith(d); }
  else { const sp=document.createElement("span"); sp.textContent=nome; img.replaceWith(sp); }
}
window.fotoFalhou=fotoFalhou;   /* chamada direto pela imagem (onerror): precisa estar a vista da pagina */
function cardPedido(n,i){
  const st=situacaoPedido(n), its=n.itens||[], og=origemDe(n.origem);
  return `<div class="ped" data-p="${i}">
    <div class="topo-ped">
      ${og?`<span class="orig" style="--oc:${og.c};--ob:${og.b}">${og.ic}${og.t}</span>`:`<span></span>`}
      <span class="selo" style="background:${st.bg};color:${st.cor};font-weight:600">${st.t}</span>
    </div>
    <div class="lin forte">${IC.nf}${og?"":"NF "}${esc(n.numero)}${n.imediato?` <span class="selo" style="background:var(--amb-bg);color:var(--amb);font-size:11px;margin-left:4px">Pedido imediato</span>`:""}</div>
    <div class="lin forte">${IC.lojaic}${esc(LOJA.codigo)} • ${esc(LOJA.nome)}</div>
    <div class="lin">${IC.cal}${dataLonga(n.emissao)}${n.hora?` às ${esc(n.hora)}`:""}</div>
    <div style="display:flex;align-items:flex-end;gap:10px">
      <div class="prods" style="flex:1;min-width:0">${(()=>{
        /* Com foto: as fotos dos produtos de maior valor, como no RTM. Sem
           nenhuma foto no pedido: os nomes, como antes. */
        const fotos=its.filter(x=>x.imagem).slice(0,4);
        if(fotos.length) return fotos.map(x=>`<img class="pfoto" src="${esc(x.imagem)}" alt="${esc(x.nome)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="fotoFalhou(this)">`).join("")
          + (its.length>fotos.length?`<span class="mais">+${its.length-fotos.length}</span>`:"");
        return its.slice(0,3).map(x=>`<span>${esc(x.nome)}</span>`).join("") + (its.length>3?`<span>+${its.length-3}</span>`:"");
      })()}
      </div>
      <button class="compart" data-c="${i}" aria-label="Compartilhar">${IC.comp}</button>
    </div>
    <div class="num3">
      <div><small>${IC.cx}Caixas</small><b>${cxTxt(n.caixas)}</b></div>
      <div><small>${IC.din}Total</small><b>${reais(n.valor)}</b></div>
      <div><small>${IC.cam2}Entrega</small><b>${n.previsao?dataBr(n.previsao).slice(0,5):"—"}</b></div>
    </div></div>`;
}



function telaPedidos(){ montar(()=>{ TELA="mod"; esconderTudo();
  topo("Informações de Vendas", ()=>{ FILTRO_PED="todos"; telaLoja(); }, "");
  const todos=pedidosDe(LOJA);
  if(!todos.length){
    $("corpo").innerHTML = ERRO_BUSCA.pedidos && !PEDIDOS
      ? `<div class="aviso err"><b>Não consegui buscar os pedidos.</b><br>${esc(traduz(ERRO_BUSCA.pedidos))}</div>
         <button class="bt" id="tentaPed">Tentar de novo</button>`
      : `<div class="vazio">${PEDIDOS?"Nenhum pedido desta loja neste mês nem no anterior."
         :!navigator.onLine?"Sem sinal. Os pedidos aparecem quando a internet voltar."
         :"Buscando os pedidos…"}</div>`;
    if($("tentaPed")) $("tentaPed").onclick=()=>{ $("corpo").innerHTML=`<div class="vazio">Buscando os pedidos…</div>`; buscarPedidos(DATA); };
    if(!PEDIDOS&&!ERRO_BUSCA.pedidos&&navigator.onLine) buscarPedidos(DATA);
    return rodape(`<button class="bt sec" onclick="telaLoja()">Voltar</button>`);
  }
  const conta=k=>todos.filter(n=>k==="todos"||situacaoPedido(n).k===k).length;
  const vis=todos.map((n,i)=>({n,i})).filter(x=>FILTRO_PED==="todos"||situacaoPedido(x.n).k===FILTRO_PED);
  const abertos=todos.filter(n=>situacaoPedido(n).k==="aberto").length;
  $("corpo").innerHTML=`
    <div class="aviso inf">Consulta: os pedidos desta loja e a situação de cada um no sistema.${abertos?` ${abertos} em aberto.`:""}</div>
    <div class="pilha" id="fped" style="margin:0 0 12px">
      ${FILTROS.map(([k,t])=>`<button data-f="${k}" class="${FILTRO_PED===k?"on":""}">${t} · ${conta(k)}</button>`).join("")}
    </div>
    ${vis.length?vis.map(x=>cardPedido(x.n,x.i)).join(""):`<div class="vazio">Nenhum pedido neste filtro.</div>`}`;
  $("fped").querySelectorAll("button").forEach(b=>b.onclick=()=>{ FILTRO_PED=b.dataset.f; telaPedidos(); });
  $("corpo").querySelectorAll(".ped").forEach(c=>c.onclick=e=>{
    if(e.target.closest(".compart")) return; telaPedido(todos[+c.dataset.p]); });
  $("corpo").querySelectorAll(".compart").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); compartilharPedido(todos[+b.dataset.c]); });
  rodape(`<button class="bt sec" onclick="telaLoja()">Voltar</button>`);
});}

function telaPedido(n){ montar(()=>{ TELA="mod"; esconderTudo();
  topo("Detalhes do pedido", telaPedidos, "");
  const st=situacaoPedido(n), conf=n.conferido;
  const passos=[
    {ok:true, t:n.origem?`Pedido feito pelo ${origemDe(n.origem).t==="COKE TOGO"?"Coke ToGo":n.origem}`:"Pedido faturado",
     d:dataLonga(n.emissao)+(n.hora?` às ${n.hora}`:"")},
    n.hora_expedicao?{ok:true, t:"Expedido", d:`às ${n.hora_expedicao}`}:null,
    {ok:true, al:n.dias>0&&n.status!=="ACERTADA"&&!(conf&&conf.situacao==="chegou"),
     t:`Previsão de entrega: ${dataBr(n.previsao)}`, d:n.imediato?"pedido imediato":"2 dias úteis após o pedido"},
    conf?{ok:conf.situacao==="chegou", al:conf.situacao==="parcial", mau:conf.situacao==="nao_chegou",
          t:{chegou:"Repositor confirmou: chegou",parcial:"Repositor confirmou: chegou em parte",
             nao_chegou:"Repositor confirmou: não chegou"}[conf.situacao]||"Conferido",
          d:`${conf.por?String(conf.por).split(" ")[0]+" · ":""}${new Date(conf.em).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`}
        :null,
    n.status==="ACERTADA"?{ok:true,t:"Acertado no caixa",d:"baixado no sistema"}
                         :{t:"Ainda não acertado no caixa",d:"aberto no sistema"}
  ];
  const algumaFoto=(n.itens||[]).some(x=>x.imagem);
  $("corpo").innerHTML=`
    ${cardPedido(n,0).replace('class="ped"','class="ped" style="cursor:default"')}
    <h2 class="tit">HISTÓRICO DE STATUS</h2>
    <div class="tl">${passos.filter(Boolean).map(x=>`<div class="p ${x.mau?"mau":x.al?"al":x.ok?"ok":""}"><span class="b"></span>
      <div>${esc(x.t)}<small>${esc(x.d)}</small></div></div>`).join("")}</div>
    <h2 class="tit">PRODUTOS · ${(n.itens||[]).length}</h2>
    <div class="tl">${(n.itens||[]).map(x=>{
      const vc=Number(x.caixas)>0?Number(x.valor)/Number(x.caixas):null;
      const vu=vc!=null&&Number(x.fator_cx)>0?vc/Number(x.fator_cx):null;
      /* O espaco da foto so existe quando o pedido tem pelo menos uma foto.
         Sem nenhuma, o detalhe fica como era antes das fotos. */
      const foto = !algumaFoto ? "" : x.imagem
        ? `<img class="pifoto" src="${esc(x.imagem)}" alt="${esc(x.nome)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="fotoFalhou(this)">`
        : `<div class="semfoto">sem foto</div>`;
      return `<div class="pi">${foto}<div style="flex:1;min-width:0">
        <div class="n">${esc(x.sku)} • ${esc(x.nome)}</div>
        <div class="g">
          <div><small>Caixas</small><b>${cxTxt(x.caixas)}</b></div>
          <div><small>Valor caixa</small><b>${vc!=null?reais(vc)+"/CX":"—"}</b></div>
          <div><small>Total</small><b>${reais(x.valor)}</b></div></div>
        ${vu!=null&&Number(x.fator_cx)>1?`<div class="un">A unidade dentro da caixa custou <b>${reais(vu)}/UN</b></div>`:""}
      </div></div>`; }).join("")}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 4px 4px;
      border-top:1px solid var(--linha);margin-top:4px;font-size:17px;font-weight:700">
      <span>Total</span><span>${reais(n.valor)}</span></div>`;
  $("corpo").querySelectorAll(".compart").forEach(b=>b.onclick=e=>{ e.stopPropagation(); compartilharPedido(n); });

  rodape(`<button class="bt sec" onclick="telaPedidos()">Voltar aos pedidos</button>`);
});}
const telaChegadas=telaPedidos;   // nome antigo, caso algo ainda chame

/* -------------------------- 4. exposicao --------------------- */
const PONTOS=[["gondola","Gôndola"],["ponta_gondola","Ponta de gôndola"],["ponto_extra","Ponto extra"],
  ["ilha","Ilha"],["checkout","Checkout"],["geladeira","Geladeira"]];
const SIT_EXP=[["montado","Montado"],["parcial","Parcial"],["ausente","Ausente"]];
function telaExposicao(){ montar(()=>{ TELA="mod"; esconderTudo(); const regs=LOJA.exposicoes||[];
  topo("Exposição", ()=>telaLoja(), "");
  $("corpo").innerHTML=PONTOS.map(pt=>{ const r=regs.find(x=>x.tipo===pt[0])||{};
    return `<div class="item" data-t="${pt[0]}"><div class="nome">${pt[1]}</div>
      <div class="pilha sit">${SIT_EXP.map(s=>`<button class="${r.situacao===s[0]?("on "+(s[0]==="ausente"?"mau":s[0]==="parcial"?"meio":"")):""}" data-s="${s[0]}">${s[1]}</button>`).join("")}</div>
      <div class="nums">
        <div><label>Frentes</label><input type="number" inputmode="numeric" min="0" data-c="frentes" value="${r.frentes==null?"":r.frentes}"></div>
        <div><label>Share %</label><input type="number" inputmode="numeric" min="0" max="100" data-c="share" value="${r.share==null?"":r.share}"></div>
      </div>${blocoFoto(r)}</div>`; }).join("");
  $("corpo").querySelectorAll("[data-t]").forEach(g=>{ const tipo=g.dataset.t;
    const atual=()=>{ LOJA.exposicoes=LOJA.exposicoes||[];
      let r=LOJA.exposicoes.find(x=>x.tipo===tipo); if(!r){ r={id:uid(),tipo:tipo}; LOJA.exposicoes.push(r); } return r; };
    const envia=r=>{ if(!r.situacao) r.situacao="montado";
      grava("exposicao","id",{id:r.id, ...base(), tipo:r.tipo, situacao:r.situacao,
        frentes:r.frentes==null?null:r.frentes, share:r.share==null?null:r.share}); };
    g.querySelectorAll(".sit button").forEach(b=>b.onclick=()=>{ if(!exigeVisita()) return;
      const r=atual(); r.situacao=b.dataset.s;
      g.querySelectorAll(".sit button").forEach(x=>x.classList.remove("on","mau","meio"));
      b.classList.add("on"); if(b.dataset.s==="ausente") b.classList.add("mau");
      if(b.dataset.s==="parcial") b.classList.add("meio"); envia(r); });
    g.querySelectorAll('input[type=number]').forEach(inp=>inp.onchange=()=>{ if(!exigeVisita()){ inp.value=""; return; }
      const r=atual(); r[inp.dataset.c]=inp.value===""?null:Number(inp.value); envia(r); });
    const r=atual();
    ligaFoto(g, r, {tabela:"exposicao", chave:"id", corpo:{id:r.id, ...base(), tipo:r.tipo,
      situacao:r.situacao||"montado", frentes:r.frentes==null?null:r.frentes,
      share:r.share==null?null:r.share}}, telaExposicao); });
  rodape(botaoConcluir("exposicao")||`<button class="bt sec" onclick="telaLoja()">Voltar</button>`);
  ligaConcluir(()=>((LOJA.exposicoes||[]).length?{ok:true}
    :{ok:true, resultado:"nada_a_registrar", confirmar:"Nenhum ponto registrado. Concluir a exposição assim?"}));
  poeSolicitacoes("exposicao");
});}

/* --------------------- 5. preco e concorrencia ---------------
   Grava SO o preco. Se mandasse gondola e deposito junto, passaria por cima
   do que o repositor acabou de anotar na Oportunidade do Estoque, porque as
   duas telas escrevem na mesma linha de contagem. */
function enviaPreco(p){ const c=p.contagem||{};
  grava("contagem","visita_id,produto_id",{
    visita_id:LOJA.visita?LOJA.visita.id:null, loja_id:LOJA.id,
    produto_id:p.produto_id, data:DIA.data,
    preco:c.preco==null?null:c.preco, preco_promocional:c.promo==null?null:c.promo}); }
function telaPreco(){ montar(()=>{ TELA="mod"; esconderTudo(); const cat=LOJA.catalogo||[], cc=LOJA.concorrentes||[];
  topo("Preço", ()=>telaLoja(), "");
  $("corpo").innerHTML=`<h2 class="tit">NOSSOS PRODUTOS</h2><div id="meus">${
    cat.map((p,i)=>{ const c=p.contagem||{};
      return `<div class="item"><div class="nome">${esc(p.nome)}</div><div class="emb">${esc(p.embalagem||"")}</div>
        <div class="nums" data-p="${i}">
          <div><label>Preço R$</label><input type="number" inputmode="decimal" step="0.01" min="0" data-c="preco" value="${c.preco==null?"":c.preco}"></div>
          <div><label>Promoção R$</label><input type="number" inputmode="decimal" step="0.01" min="0" data-c="promo" value="${c.promo==null?"":c.promo}"></div>
        </div></div>`; }).join("")}</div>

/* ------------------ 6. materiais e geladeiras -----------------
   Censo de ativos, uma vez por semana por loja. Geladeira com as duas
   perguntas do RTM; os outros ativos com perguntas proprias, porque
   perguntar se uma gondola esta 75% ocupada nao faz sentido.

   As perguntas vem do banco (app_meta.perguntas_ativos) e sao escritas para
   que SIM seja bom e NAO seja problema. Sim/Nao em vez de chave liga/desliga:
   a chave desligada nao diferencia "nao" de "esqueci de responder", e isso
   encheria o painel de problema falso. So envia com tudo respondido.

   Depois de enviado, o modulo vira o RESUMO do que foi feito na semana, com
   foto, PTM e respostas. Antes, o censo sumia da vista do repositor.
------------------------------------------------------------- */
const TIPOS_ATIVO=[["gondola","Gôndola"],["display","Display"],["ilha","Ilha"],
                   ["checkout","Checkout"],["material","Material de PDV"],["outro","Outro"]];
const NOME_TIPO={geladeira:"Geladeira",gondola:"Gôndola",display:"Display",ilha:"Ilha",
                 checkout:"Checkout",material:"Material de PDV",outro:"Outro ativo"};
const PERGUNTAS_PADRAO={
  geladeira:[{k:"visivel",t:"Geladeira visível no ponto de venda?"},{k:"ocupacao_ko_75",t:"Geladeira Coca-Cola (KO) 75% ocupada?"}],
  gondola:[{k:"abastecida",t:"Gôndola abastecida com nossos produtos?"},{k:"precificada",t:"Todos os nossos produtos com preço?"},
           {k:"planograma",t:"Produtos organizados conforme o planograma?"},{k:"sem_concorrente",t:"Nosso espaço está livre de produto concorrente?"}],
  display:[{k:"montado",t:"Display montado e completo?"},{k:"abastecido",t:"Display abastecido?"},
           {k:"posicao",t:"Em local visível e de fluxo de clientes?"},{k:"precificado",t:"Com preço?"}],
  ilha:[{k:"montada",t:"Ilha montada?"},{k:"abastecida",t:"Ilha abastecida?"},
        {k:"comunicacao",t:"Com material de comunicação, como cartaz ou splash?"},{k:"precificada",t:"Com preço?"}],
  checkout:[{k:"abastecido",t:"Checkout abastecido?"},{k:"visivel",t:"Visível para quem está no caixa?"},{k:"precificado",t:"Com preço?"}],
  material:[{k:"instalado",t:"Material instalado?"},{k:"vigente",t:"Campanha em vigor, sem estar vencida?"},{k:"conservado",t:"Em bom estado?"}],
  outro:[{k:"conservado",t:"Em bom estado?"},{k:"abastecido",t:"Abastecido com nossos produtos?"}]};
const perguntasDe=tipo=>((censoDe(LOJA).perguntas||{})[tipo])||PERGUNTAS_PADRAO[tipo]||PERGUNTAS_PADRAO.outro;
const temProblema=a=>Object.values(a.respostas||{}).some(v=>v===false);
const chaveRasc=()=>"rasc:"+LOJA.id+":"+DATA;
let REFAZER_CENSO=false;

function rascunhoCenso(){
  let r=guarda.lerJ(chaveRasc());
  if(r) return r;
  /* Refazer parte do que ja foi feito nesta semana; semana nova parte do
     ultimo censo anterior. Nos dois casos o patrimonio vem preenchido e as
     respostas e a foto sao novas: e isso que da valor ao censo. */
  const c=censoDe(LOJA), base=(REFAZER_CENSO&&c.desta_semana&&c.desta_semana.ativos)||c.anteriores||[];
  const mk=a=>({id:uid(),tipo:a.tipo,patrimonio:a.patrimonio||"",respostas:{},observacao:"",foto:null,veioDoAnterior:true});
  const gel=base.filter(a=>a.tipo==="geladeira").map(mk), out=base.filter(a=>a.tipo!=="geladeira").map(mk);
  return {tem_geladeira:gel.length>0, tem_outros:out.length>0, geladeiras:gel, outros:out};
}
const salvaRasc=r=>guarda.porJ(chaveRasc(),r);

function estadoCenso(l){
  const e=estadoModulo(l,"pdv"); if(e.k&&e.txt) return e;
  const c=censoDe(l);
  if(c.feito_na_semana) return {k:"feito", txt:`feito esta semana${c.feito_em?" em "+dataBr(c.feito_em).slice(0,5):""}`};
  if(c.obrigatorio_hoje) return {k:"obrig", txt:"obrigatório hoje: última visita da semana"};
  return {k:"pend", txt:"pendente esta semana"};
}

/* Foto do censo mora no balde privado: precisa do login para abrir. Busca com
   a credencial e guarda na memoria, para nao baixar de novo a cada tela. */
const FOTOS_MEM={};
async function fotoPrivada(caminho){
  if(!caminho) return null;
  if(FOTOS_MEM[caminho]) return FOTOS_MEM[caminho];
  try{
    const r=await fetch(URLB.replace(/\/+$/,"")+"/storage/v1/object/authenticated/fotos/"+caminho,
      {headers:{"apikey":CHAVE,"Authorization":"Bearer "+guarda.ler("token")}});
    if(!r.ok) return null;
    return FOTOS_MEM[caminho]=URL.createObjectURL(await r.blob());
  }catch(e){ return null; }
}
function carregaFotos(raiz){
  (raiz||document).querySelectorAll("img[data-foto-priv]").forEach(async img=>{
    const u=await fotoPrivada(img.dataset.fotoPriv); if(u) img.src=u; else img.replaceWith(Object.assign(document.createElement("span"),{textContent:"foto enviada",className:"emb"}));
  });
}


/* ===================== GELADEIRAS DA LOJA (COMODATO) =====================
   A lista vem da base de comodato: as geladeiras que a Bandeirantes tem na
   loja. Uma vez por semana o repositor confere cada uma: se esta na loja, a
   foto de como esta, o PTM com a foto da plaqueta, e os requisitos da marca.
   O primeiro PTM fica preso a geladeira; depois, PTM diferente vira alerta. */
let EQUIP=null;

const NOME_MARCA={"Total Ko":"Coca-Cola","Total Monster":"Monster","Total Hnk":"Heineken"};
const marcaTxt=m=>NOME_MARCA[m]||m||"Outra marca";
const portasTxt=p=>{ const n=String(p||"").replace(",","."); return n==="0.5"?"meia porta":/^\d+$/.test(n)?`${n} ${n==="1"?"porta":"portas"}`:""; };
const mesTxtEq=m=>m&&/^\d{6}$/.test(m)?`${m.slice(4)}/${m.slice(0,4)}`:"";
async function buscarEquipamentos(data){
  const g=guarda.lerJ("equip:"+data); if(g){ EQUIP=g; CARREGADO.equip=data; }
  if(!navigator.onLine) return;
  try{ const r=await api("/rest/v1/rpc/meus_equipamentos",{method:"POST",body:JSON.stringify({p_data:data})});
    if(data!==DATA) return; EQUIP=r||{lojas:{}}; CARREGADO.equip=data; guarda.porJ("equip:"+data,EQUIP); delete ERRO_BUSCA.equip;
    if(TELA==="loja") telaLoja(); }
  catch(e){ ERRO_BUSCA.equip=e.message; }
}
LISTAS.equip=()=>EQUIP&&EQUIP.lojas;
const equipDe=l=>(EQUIP&&EQUIP.lojas&&EQUIP.lojas[l.id])||[];
const confDaSemana=e=>EQ_CONF[e.id]||(e.na_semana?e.ultima:null);
function situacaoEq(c){ if(!c) return {k:"pendente", t:"Conferir esta semana", cor:"var(--amb)", bg:"var(--amb-bg)"};
  if(c.encontrado===false) return {k:"sumiu", t:"Não encontrada", cor:"var(--verm)", bg:"var(--verm-bg)"};
  const prob=Object.values(c.respostas||{}).filter(v=>v===false).length;
  if(c.ptm_status==="diferente") return {k:"ptm", t:"PTM diferente", cor:"var(--verm)", bg:"var(--verm-bg)"};
  return prob?{k:"prob", t:`${prob} ${prob===1?"problema":"problemas"}`, cor:"var(--amb)", bg:"var(--amb-bg)"}:{k:"ok", t:"Conforme", cor:"var(--verde)", bg:"var(--verde-bg)"}; }

function telaEquipamentos(){ if(!chegou("equip")) return telaEsperando("equip","Materiais e Geladeiras","as geladeiras",()=>buscarEquipamentos(DATA),telaEquipamentos);

  $("corpo").innerHTML=`
    <div class="aviso inf">Uma vez por semana, confira cada geladeira: se está na loja, a foto de como está, o PTM e os requisitos da marca.</div>
    <div class="cartao" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <b>${es.length?`${feitas} de ${es.length} conferidas nesta semana`:"Nenhuma geladeira em comodato nesta loja"}</b>
      <span class="mut" style="font-size:13px">${es.length?(es.length-feitas?`faltam ${es.length-feitas}`:"todas conferidas"):"pela base de comodato"}</span></div>

          <span class="selo" style="flex:none;background:${st.bg};color:${st.cor};font-weight:700">${st.t}</span></div>
        <div class="mut" style="font-size:13px;margin-top:4px">${esc(marcaTxt(e.marca))}${portasTxt(e.portas)?` · ${portasTxt(e.portas)}`:""}${mesTxtEq(e.instalado_mes)?` · instalada em ${mesTxtEq(e.instalado_mes)}`:""} · contrato ${esc(e.contrato)}</div>
        <div style="font-size:13px;margin-top:4px">${e.ptm?`PTM <b>${esc(e.ptm)}</b>`:`<span style="color:var(--amb)">PTM ainda não registrado</span>`}${e.meta_cx?` · meta ${Math.round(e.meta_cx)} cx/mês`:""}</div>
        ${acaoForte(e.acao_sugerida)?`<div style="font-size:12.5px;margin-top:6px;color:var(--verm);font-weight:600">Comercial: ${esc(e.acao_sugerida)}${e.situacao&&e.situacao!==e.acao_sugerida?` (${esc(e.situacao)})`:""}</div>`:""}
        ${c&&c.encontrado!==false&&st.k==="prob"?`<div style="font-size:12.5px;margin-top:4px;color:var(--amb)">${Object.entries(c.respostas||{}).filter(([,v])=>v===false).map(([k])=>esc(k)).join(" · ")}</div>`:""}
      </button>`; }).join("")}
    <button class="bt sec" id="eqExtra" style="margin-top:12px">+ Geladeira que não está na lista</button>`;
  $("corpo").querySelectorAll("[data-eq]").forEach(b=>b.onclick=()=>{ if(!exigeVisita()) return; telaConferirEquip(es[+b.dataset.eq]); });
  $("eqExtra").onclick=()=>{ if(!exigeVisita()) return; telaConferirEquip(null); };

    if(falta) return {ok:false, msg:`Faltam ${falta} ${falta===1?"geladeira":"geladeiras"} para conferir nesta semana.`};

function telaConferirEquip(e, st){ montar(()=>{ TELA="mod"; esconderTudo();
  const extra=!e, perg=(EQUIP&&EQUIP.perguntas)||{}, fotoPtmSempre=((EQUIP&&EQUIP.foto_ptm)||"sempre")==="sempre";
  st=st||{encontrado:null, motivo:"", obs:"", ptm:e&&e.ptm||"", fotoEq:null, fotoPtm:null, resp:{}, modelo:"", marca:"Total Ko"};
  const reqs=(perg[extra?st.marca:e.marca]||perg.padrao||["Ligada e gelando","Limpa e organizada","Visível para o cliente"]);
  const ptmMudou=e&&e.ptm&&st.ptm&&st.ptm.trim().toUpperCase()!==String(e.ptm).toUpperCase();
  const pedeFotoPtm=extra||fotoPtmSempre||!(e&&e.ptm)||ptmMudou;

  const repinta=()=>{ ["eqObs","eqPtm","eqModelo"].forEach(id=>{ if($(id)) st[{eqObs:"obs",eqPtm:"ptm",eqModelo:"modelo"}[id]]=$(id).value; }); telaConferirEquip(e,st); };
  const fotoBox=(f,id,rot)=>`<label>${rot}</label><button class="fotobox" id="${id}" style="width:120px;height:120px">${f?`<img src="${f.url}" alt="">`:`<span class="mais">+</span>Foto`}</button>`;
  $("corpo").innerHTML=`
    ${extra?`<div class="cartao"><label for="eqModelo" style="font-weight:600">Qual é a geladeira?</label>
        <input id="eqModelo" placeholder="Ex.: vertical 2 portas vermelha" value="${esc(st.modelo)}" style="width:100%;margin-top:8px">
        <div class="pilha" style="margin-top:10px;flex-wrap:wrap">${["Total Ko","Total Monster","Total Hnk"].map(m=>`<button data-mc="${m}" class="${st.marca===m?"on":""}" style="flex:none">${marcaTxt(m)}</button>`).join("")}</div></div>`
      :`<div class="cartao"><b style="font-size:15px">${esc(e.modelo)}${e.item>1?` · unidade ${e.item}`:""}</b>
        <div class="mut" style="font-size:13px;margin-top:4px">${esc(marcaTxt(e.marca))}${portasTxt(e.portas)?` · ${portasTxt(e.portas)}`:""} · contrato ${esc(e.contrato)}</div>
        ${e.ultima?`<div class="mut" style="font-size:12.5px;margin-top:4px">Última conferência: ${dataBr(e.ultima.data)} por ${esc(String(e.ultima.por||"").split(" ")[0])}</div>`:""}</div>
      <h2 class="tit">ENCONTROU NA LOJA?</h2>
      <div class="pilha" style="margin-top:0"><button data-enc="1" class="${st.encontrado===true?"on":""}">Sim, está aqui</button><button data-enc="0" class="${st.encontrado===false?"on mau":""}">Não encontrei</button></div>`}
    ${!extra&&st.encontrado===false?`<div class="cartao" style="margin-top:10px"><b>O que aconteceu?</b>
        <div class="pilha" style="margin-top:8px;flex-wrap:wrap">${["Foi retirada","Trocada por outra","Não localizei","Outro"].map(m=>`<button data-mot="${m}" class="${st.motivo===m?"on":""}" style="flex:none">${m}</button>`).join("")}</div>
        <textarea id="eqObs" rows="3" placeholder="${st.motivo==="Outro"?"Conte o que aconteceu":"Quer contar mais? (opcional)"}" style="width:100%;margin-top:10px;font:inherit">${esc(st.obs)}</textarea></div>`:""}
    ${extra||st.encontrado===true?`
      <div class="cartao" style="margin-top:10px">${fotoBox(st.fotoEq,"eqFotoEq","Foto da geladeira, de frente, mostrando a exposição")}</div>
      <div class="cartao" style="margin-top:10px"><label for="eqPtm" style="font-weight:600">PTM, o número do patrimônio</label>

        ${ptmMudou?`<div class="aviso err" style="margin-top:8px">Diferente do PTM registrado (${esc(e.ptm)}). Confira a plaqueta: se for outro equipamento, ele aparece para o gerente.</div>`:e&&e.ptm?`<div class="mut" style="font-size:12.5px;margin-top:6px">Registrado: ${esc(e.ptm)}. Confira se é o mesmo da plaqueta.</div>`:""}
        ${pedeFotoPtm?`<div style="margin-top:10px">${fotoBox(st.fotoPtm,"eqFotoPtm","Foto da plaqueta do PTM")}</div>`:""}</div>

      respostas:enc?st.resp:null, observacao:[enc?"":st.motivo, st.obs].filter(Boolean).join(" · ")||null,
      extra:extraDados});

    alerta(extra?"Geladeira registrada. Ela aparece para o gerente como fora da base.":enc?"Conferência salva.":"Registrado como não encontrada. O seu líder e o gerente veem isso.");
    telaEquipamentos();
  };
});}

/* Leitor de codigo de barras do patrimonio. Usa o leitor que ja vem no
   navegador do Android. No iPhone ele nao existe; ai o repositor digita. */
async function escanearPtm(){
  if(!("BarcodeDetector" in window)){
    alerta("Este celular não lê código pela câmera. Digite o número do patrimônio.");
    return null;
  }
  let formatos=["code_128","code_39","ean_13","ean_8","qr_code","itf","codabar","upc_a"];
  try{ const sup=await BarcodeDetector.getSupportedFormats(); formatos=formatos.filter(f=>sup.includes(f)); }catch(e){}
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}); }
  catch(e){ alerta("Não consegui abrir a câmera. Libere o acesso ou digite o número."); return null; }
  return new Promise(res=>{
    const cx=document.createElement("div"); cx.className="leitor";
    cx.innerHTML=`<video autoplay playsinline muted></video><div class="mira"></div>
      <p>Aponte para a etiqueta do patrimônio</p><button id="lfechar">Cancelar e digitar</button>`;
    document.body.appendChild(cx);
    const v=cx.querySelector("video"); v.srcObject=stream;
    const det=new BarcodeDetector({formats:formatos});
    let fim=false;
    const acaba=val=>{ if(fim) return; fim=true; stream.getTracks().forEach(t=>t.stop()); cx.remove(); res(val); };
    cx.querySelector("#lfechar").onclick=()=>acaba(null);
    const volta=async()=>{ if(fim) return;
      try{ const cods=await det.detect(v); if(cods&&cods.length) return acaba(String(cods[0].rawValue).trim()); }catch(e){}
      setTimeout(volta,250); };
    v.onloadedmetadata=()=>volta();
  });
}

function resumoCensoHTML(c){
  const ds=c.desta_semana, ats=(ds&&ds.ativos)||[];
  const linhaAtivo=a=>{
    const ps=perguntasDe(a.tipo), prob=temProblema(a);
    return `<div class="ativo" style="border-left:4px solid ${prob?"var(--verm)":"var(--verde)"}">
      <div style="display:flex;gap:12px">
        ${a.fotoLocal?`<img src="${a.fotoLocal}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:10px;flex:none">`
          :a.foto_url?`<img data-foto-priv="${esc(a.foto_url)}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:10px;flex:none;background:var(--fundo)">`:""}
        <div style="flex:1;min-width:0">
          <b style="font-size:15px">${NOME_TIPO[a.tipo]||"Ativo"}${a.patrimonio?" · PTM "+esc(a.patrimonio):""}</b>
          ${ps.map(q=>{ const v=(a.respostas||{})[q.k];
            return `<div style="font-size:13px;margin-top:4px;color:${v===false?"var(--verm)":v===true?"var(--ink2)":"var(--ink3)"}">
              ${v===true?"\u2713":v===false?"\u2717":"–"} ${esc(q.t)}</div>`; }).join("")}
          ${a.observacao?`<div class="emb" style="margin-top:5px">“${esc(a.observacao)}”</div>`:""}
        </div></div></div>`; };
  const gel=ats.filter(a=>a.tipo==="geladeira"), out=ats.filter(a=>a.tipo!=="geladeira");
  const probs=ats.filter(temProblema).length;
  return `<div class="aviso inf" style="background:var(--verde-bg);color:var(--verde)">
      <b>Censo feito em ${dataBr(ds.data)}${ds.por?" por "+esc(String(ds.por).split(" ")[0]):""}.</b><br>
      ${gel.length} ${gel.length===1?"geladeira":"geladeiras"} · ${out.length} ${out.length===1?"outro ativo":"outros ativos"}
      ${probs?` · <b style="color:var(--verm)">${probs} com problema</b>`:" · nada com problema"}</div>
    ${!ats.length?`<div class="vazio" style="padding:18px">Registrado que a loja não tem geladeira nem outro ativo.</div>`:""}
    ${gel.length?`<h2 class="tit">GELADEIRAS</h2>${gel.map(linhaAtivo).join("")}`:""}
    ${out.length?`<h2 class="tit">OUTROS ATIVOS</h2>${out.map(linhaAtivo).join("")}`:""}
    ${(c.historico||[]).length>1?`<h2 class="tit">SEMANAS ANTERIORES</h2><div class="tl">${c.historico.slice(1).map(h=>
      `<div class="p ${h.problemas?"al":"ok"}"><span class="b"></span><div>${dataBr(h.data)}${h.por?" · "+esc(String(h.por).split(" ")[0]):""}
        <small>${h.geladeiras} ${h.geladeiras===1?"geladeira":"geladeiras"} · ${h.outros} ${h.outros===1?"outro ativo":"outros ativos"}${h.problemas?` · ${h.problemas} com problema`:""}</small></div></div>`).join("")}</div>`:""}`;
}

function enviarCenso(r){
  if(!exigeVisita()) return;
  const gel=r.tem_geladeira?r.geladeiras:[], out=r.tem_outros?r.outros:[];
  const falta=[];
  gel.forEach((a,i)=>{ if(!a.foto) falta.push(`Geladeira ${i+1}: falta a foto`);
                        if(!a.patrimonio) falta.push(`Geladeira ${i+1}: falta o PTM`); });
  out.forEach((a,i)=>{ if(!a.foto) falta.push(`${NOME_TIPO[a.tipo]} ${i+1}: falta a foto`); });
  [...gel,...out].forEach((a,i)=>{ const sem=perguntasDe(a.tipo).filter(q=>typeof (a.respostas||{})[q.k]!=="boolean").length;
    if(sem) falta.push(`${NOME_TIPO[a.tipo]} ${a.patrimonio||""}: ${sem} ${sem===1?"pergunta sem resposta":"perguntas sem resposta"}`); });
  if(r.tem_geladeira&&!gel.length) falta.push("Marcou que tem geladeira, mas nenhuma foi registrada");
  if(falta.length) return alerta(falta.slice(0,3).join(" · "));
  if(!gel.length&&!out.length&&!confirm("Confirmar que esta loja não tem geladeira nem outro ativo?")) return;

  const censoId=uid();
  grava("censo_loja","id",{id:censoId, visita_id:LOJA.visita.id, loja_id:LOJA.id,
    pessoa_id:DIA.pessoa.id, data:DIA.data, tem_geladeira:gel.length>0, tem_outros:out.length>0});
  [...gel,...out].forEach(a=>grava("ativo_censo","id",{id:a.id, censo_id:censoId, loja_id:LOJA.id,
    pessoa_id:DIA.pessoa.id, tipo:a.tipo, patrimonio:a.tipo==="material"?null:(a.patrimonio||null),
    respostas:a.respostas||{}, observacao:(a.observacao||"").trim()||null,
    /* as duas colunas antigas continuam preenchidas na geladeira */
    visivel:a.tipo==="geladeira"?!!a.respostas.visivel:null,
    ocupacao_ko_75:a.tipo==="geladeira"?!!a.respostas.ocupacao_ko_75:null,
    foto_url:a.foto||null}));

  CENSO=CENSO||{};
  const c=CENSO[LOJA.id]=Object.assign(CENSO[LOJA.id]||{}, {feito_na_semana:true, feito_em:DATA,
    obrigatorio_hoje:false, enviado_aqui:true});
  c.desta_semana={id:censoId, data:DATA, por:DIA.pessoa.nome, tem_geladeira:gel.length>0, tem_outros:out.length>0,
    ativos:[...gel,...out].map(a=>({tipo:a.tipo, patrimonio:a.patrimonio, respostas:a.respostas,
      observacao:a.observacao, foto_url:a.foto, fotoLocal:a.fotoLocal}))};
  c.historico=[{data:DATA, por:DIA.pessoa.nome, geladeiras:gel.length, outros:out.length,
    problemas:[...gel,...out].filter(temProblema).length}, ...((c.historico||[]).filter(h=>h.data!==DATA))];
  guarda.porJ("censo:"+DATA,CENSO); guarda.tira(chaveRasc());
  REFAZER_CENSO=false;
  concluirModulo("pdv");
  alerta("Censo enviado.");
  telaAtivos();                       /* abre o resumo do que foi feito */
}

function pararRelogio(){ if(RELOGIO){ clearInterval(RELOGIO); RELOGIO=null; } }

async function abrirCanal(){
  try{
    CANAL=await api("/rest/v1/rpc/abrir_canal",{method:"POST",
      body:JSON.stringify({p_loja:LOJA.id, p_tipo:CANAL_TIPO})});
    pintaFio();
    await api("/rest/v1/rpc/marcar_lido",{method:"POST",body:JSON.stringify({p_canal:CANAL.canal_id})});
    if(NAOLIDAS[LOJA.id]) NAOLIDAS[LOJA.id].nao_lidas=0;
    /* O link do consultor e preparado AGORA, nao na hora do toque. O
       navegador so deixa abrir o WhatsApp como resposta direta a um toque;
       se houver espera de rede no meio, ele bloqueia em silencio. */
    if(CANAL_TIPO==="consultor") prepararConvite(PAPEL);
    pararRelogio();
    /* 15 segundos enquanto a tela esta aberta. Conexao aberta seria mais
       elegante e nao aguenta 233 aparelhos ao mesmo tempo; assim escala
       sem mudar nada depois. */
    RELOGIO=setInterval(()=>{ if(!document.hidden && TELA==="mod" && $("fio")) atualizarFio(); },15000);
  }catch(e){
    if($("fio")) $("fio").innerHTML=`<div class="aviso err">${esc(traduz(e.message))}</div>`;
  }
}

  try{ CANAL=await api("/rest/v1/rpc/abrir_canal",{method:"POST",

  el.innerHTML = cabeca + (ms.length ? (()=>{ let ult="";
