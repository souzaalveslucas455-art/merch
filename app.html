/* O que o repositor pode anexar. O numero de cada um vem do que ele
   registrou hoje, entao ele ve antes de mandar se ha conteudo. */
const CARTOES=[
  {k:"ruptura",  t:"Ruptura",   d:"itens faltando na gôndola"},
  {k:"validade", t:"Validade",  d:"produtos perto de vencer"},
  {k:"estoque",  t:"Estoque",   d:"o que foi contado hoje"},
  {k:"preco",    t:"Preço",     d:"preços e concorrência"},
  {k:"geladeira",t:"Materiais e Geladeiras", d:"ativos não visíveis ou abaixo de 75%"}
];
function quantos(k){
  const l=LOJA, cat=l.catalogo||[], lim=DIA.dias_alerta_validade||30;
  if(k==="ruptura")  return (oportDe(l).itens||[]).filter(rupturaOport).length;
  if(k==="validade") return lotesAtivos(l).filter(x=>diasAte(x.vence_em)<=lim).length;
  if(k==="estoque")  return (oportDe(l).itens||[]).filter(x=>totalOport(x).tocou).length;
  if(k==="preco")    return cat.filter(x=>x.contagem&&x.contagem.preco!=null).length+(l.concorrentes||[]).length;
  if(k==="geladeira"){ const c=censoDe(l), ds=c.desta_semana;   /* do censo enviado hoje */
    return ((ds&&ds.data===DATA&&ds.ativos)||[]).filter(temProblema).length; }
  return 0;
}
function telaAnexar(){ montar(()=>{ TELA="mod"; esconderTudo();
  topo("Anexar dados", telaConversa, "");
  $("corpo").innerHTML=`<div class="aviso inf">O cartão leva os números que você registrou hoje nesta loja.</div>`+
    CARTOES.map((c,i)=>{ const n=quantos(c.k);
      return `<button class="mod" data-c="${i}" ${n?"":"disabled style=opacity:.45"}>
        <span class="ic">${n}</span>
        <span class="txt"><b>${c.t}</b><span>${n?c.d:"nada registrado hoje"}</span></span>
        <span style="color:var(--ink3);font-size:22px">\u203a</span></button>`; }).join("");
  $("corpo").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>mandarCartao(CARTOES[+b.dataset.c].k));
  rodape(null);
});}

/* Atalho de avisar dentro do modulo. O momento de avisar e quando ele acabou
   de registrar, nao depois de navegar ate a conversa. */
function botaoAvisar(tipo){
  return `<button class="bt" id="avisar" data-t="${tipo}">Mandar para o líder</button>`;
}
function ligaAvisar(){
  const b=$("avisar"); if(!b) return;
  b.onclick=()=>{
    const tipo=b.dataset.t;
    if(!quantos(tipo)) return alerta("Registre alguma coisa antes de mandar para o líder.");
    const ctx=resumoParaLider(tipo), volta={ruptura:telaOportunidade, validade:telaValidade}[tipo]||telaLoja;
    telaNovaDemanda({modulo:tipo==="ruptura"?"oportunidade":tipo, texto:ctx.texto, contexto:ctx.contexto, volta});
  };
}
/* O que o repositor marcou no modulo, ja escrito para o lider. Ele confere,
   muda se quiser, e manda. */
function resumoParaLider(tipo){
  const itens=[];
  if(tipo==="ruptura"){
    const mot=Object.fromEntries(MOTIVOS);
    (oportDe(LOJA).itens||[]).forEach(it=>{ const c=it.contagem||{};
      if(c.naoTem) itens.push(`${it.nome}: ${it.classe==="nunca"?"a loja não trabalha":"não tem"+(c.motivo?` (${(mot[c.motivo]||c.motivo).toLowerCase()}${c.motivo==="outro"&&c.obs?`: ${c.obs}`:""})`:"")}`); });
  } else if(tipo==="validade"){
    lotesAtivos(LOJA).forEach(x=>{ const d=diasAte(x.vence_em), k=nivelLote(x).k;
      if(k==="vencido"||k==="critico") itens.push(`${x.produto||x.nome}, lote ${x.lote||"sem lote"}: ${d<0?"vencido":`vence em ${dataBr(x.vence_em)}`}${x.quantidade_atual!=null?`, ${x.quantidade_atual} un`:""}`); });
  }
  const tit={ruptura:"Produtos que não encontrei", validade:"Lotes vencendo"}[tipo]||"Registro da visita";
  return {texto: itens.length?`${tit} em ${LOJA.nome}:\n- ${itens.join("\n- ")}`:"", contexto:{tipo, itens}};
}

/* Numero com no maximo uma casa, do jeito brasileiro. */
const fmt1=n=>Number(n||0).toLocaleString("pt-BR",{maximumFractionDigits:1});
/* ===================== CONTAGEM DE ESTOQUE =====================
   Todos os produtos que a loja comprou nos meses da base, do mais vendido ao
   menos vendido. Conta a loja inteira (gondola, deposito, ilha e checkout
   juntos), em caixas e unidades. Obrigatoria a partir da primeira visita da
   semana ate ser feita; feita uma vez, a loja fica em dia ate a semana seguinte. */
let ESTOQUE=null, BUSCA_EST="";
const estoqueDe=l=>(ESTOQUE&&ESTOQUE[l.id])||[];
const contadoEstoque=x=>!!x.hoje&&(x.hoje.caixas!=null||x.hoje.unidades!=null);
async function buscarEstoque(data){
  const guardado=guarda.lerJ("estq:"+data); if(guardado){ ESTOQUE=guardado; CARREGADO.estoque=data; }
  if(!navigator.onLine) return;
  try{ const r=await api("/rest/v1/rpc/meu_estoque",{method:"POST",body:JSON.stringify({p_data:data})})||{};
    if(data!==DATA) return;
    /* o que foi contado hoje no aparelho continua valendo */
    for(const [lid,ps] of Object.entries(guardado||{})){ const novos=r[lid]; if(!novos) continue;
      const hj={}; ps.forEach(x=>{ if(x.hoje) hj[x.produto_id]=x.hoje; }); novos.forEach(x=>{ if(hj[x.produto_id]) x.hoje=hj[x.produto_id]; }); }
    ESTOQUE=r; CARREGADO.estoque=data; guarda.porJ("estq:"+data,ESTOQUE); delete ERRO_BUSCA.estoque;
  }catch(e){ ERRO_BUSCA.estoque=e.message; }
}
function telaEstoque(){ if(!chegou("estoque")) return telaEsperando("estoque","Contagem de Estoque","os produtos",()=>buscarEstoque(DATA),telaEstoque);
  montar(()=>{ TELA="mod"; esconderTudo();
  topo("Contagem de Estoque", telaLoja, "");
  const ps=estoqueDe(LOJA), n=ps.filter(contadoEstoque).length, feito=estadoModulo(LOJA,"estoque");
  const q=BUSCA_EST.trim().toLowerCase(), vis=q?ps.filter(x=>x.nome.toLowerCase().includes(q)):ps;
  const ult=x=>x.ultima?`Última: ${x.ultima.caixas!=null?fmt1(x.ultima.caixas)+" cx":""}${x.ultima.caixas!=null&&x.ultima.unidades!=null?" + ":""}${x.ultima.unidades!=null?Math.round(x.ultima.unidades)+" un":""} em ${dataBr(x.ultima.data).slice(0,5)}`:"Nunca contado";
  $("corpo").innerHTML=`
    ${feito.k==="feito"&&!n?`<div class="aviso ok">A contagem desta loja já foi feita esta semana (${esc(feito.txt.replace("feito esta semana em ",""))}). Pode contar de novo se quiser.</div>`
      :`<div class="aviso inf">Conte a loja inteira: gôndola, depósito, ilha e checkout juntos. Em caixas, em unidades, ou nos dois.</div>`}
    ${ERRO_BUSCA.estoque&&!ESTOQUE?`<div class="aviso err">Não consegui buscar os produtos. ${esc(traduz(ERRO_BUSCA.estoque))}</div>`:""}
    <div class="cartao" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <b>${n} de ${ps.length} contados</b><span class="mut" style="font-size:13px">${ps.length-n?`faltam ${ps.length-n}`:"todos contados"}</span></div>
    <input id="bEst" placeholder="Procurar produto" value="${esc(BUSCA_EST)}" style="width:100%;box-sizing:border-box;margin:10px 0;padding:11px 12px;border:1px solid var(--linha);border-radius:12px;font:inherit">
    ${vis.length?vis.map(x=>{ const i=ps.indexOf(x), h=x.hoje||{}, f=Number(x.fator_cx||1), zero=contadoEstoque(x)&&!Number(h.caixas)&&!Number(h.unidades);
      return `<div class="cartao" data-e="${i}" style="margin-bottom:8px;${contadoEstoque(x)?"border-left:4px solid var(--verde)":""}">
        <div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14.5px">${esc(x.nome)}</b>
          <button class="bt sec" data-zero="${i}" style="flex:none;width:auto;padding:6px 10px;font-size:13px;${zero?"background:var(--verm-bg);color:var(--verm);border-color:var(--verm)":""}">Não tem</button></div>
        <div class="mut" style="font-size:12.5px">${esc(x.embalagem||"")}${f>1?` · 1 cx = ${f} un`:""} · ${ult(x)}</div>
        ${(()=>{ /* Caixa OU unidade: o que ele digitar vale, e o outro campo mostra a conversao. */
          const cxCalc=h.caixas==null&&h.unidades!=null, unCalc=h.unidades==null&&h.caixas!=null;
          const cxV=h.caixas!=null?h.caixas:(cxCalc?+(h.unidades/f).toFixed(1):""), unV=h.unidades!=null?h.unidades:(unCalc?Math.round(h.caixas*f):"");
          return `<div class="qt2" style="margin-top:8px">${f>1?`<span><input type="number" inputmode="decimal" min="0" step="0.5" data-ec="${i}" data-f="${f}" value="${cxV}" placeholder="0" class="${cxCalc?"calc":""}"><small>${cxCalc?"caixas, calculado":"caixas"}</small></span>`:""}
          <span><input type="number" inputmode="numeric" min="0" step="1" data-eu="${i}" data-f="${f}" value="${unV}" placeholder="0" class="${unCalc?"calc":""}"><small>${unCalc?"unidades, calculado":"unidades"}</small></span></div>`; })()}
      </div>`; }).join(""):`<div class="vazio">${ps.length?"Nenhum produto com esse nome.":"Esta loja não tem produto comprado nos meses da base."}</div>`}`;
  const grava1=i=>{ if(!exigeVisita()) return false; const x=ps[i], h=x.hoje||{};
    grava("estoque_contagem","visita_id,produto_id",{visita_id:LOJA.visita.id, loja_id:LOJA.id, produto_id:x.produto_id,
      pessoa_id:DIA.pessoa.id, data:DIA.data, caixas:h.caixas??null, unidades:h.unidades??null});
    guarda.porJ("estq:"+DATA,ESTOQUE); return true; };
  $("bEst").oninput=e=>{ BUSCA_EST=e.target.value; const pos=e.target.selectionStart; telaEstoque(); const b=$("bEst"); b.focus(); b.setSelectionRange(pos,pos); };
  /* Enquanto digita: o outro campo mostra a conversao. Ao sair do campo: vale
     o que ele digitou (caixas OU unidades), e o outro fica so como conversao. */
  $("corpo").querySelectorAll("[data-ec],[data-eu]").forEach(inp=>{
    inp.oninput=()=>{ const f=Number(inp.dataset.f||1), v=inp.value===""?null:Number(inp.value);
      const outro=inp.closest(".qt2").querySelector(inp.dataset.ec!=null?"[data-eu]":"[data-ec]"); inp.classList.remove("calc");
      if(outro){ outro.value=v==null?"":(inp.dataset.ec!=null?Math.round(v*f):+(v/f).toFixed(1)); outro.classList.add("calc"); } };
    inp.onchange=()=>{
      const i=+(inp.dataset.ec??inp.dataset.eu), x=ps[i];
      const v=inp.value===""?null:Number(inp.value);
      x.hoje = v==null ? {} : (inp.dataset.ec!=null ? {caixas:v, unidades:null} : {caixas:null, unidades:v});
      if(!grava1(i)){ inp.value=""; return; } telaEstoque(); }; });
  $("corpo").querySelectorAll("[data-zero]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.zero, x=ps[i];
    x.hoje={caixas:0, unidades:0}; if(grava1(i)) telaEstoque(); });
  rodape(botaoConcluir("estoque"));
  ligaConcluir(()=>{ const falta=ps.filter(x=>!contadoEstoque(x)).length;
    if(!ps.length) return {ok:true, resultado:"nada_a_registrar"};
    if(falta) return {ok:false, msg:`Faltam ${falta} ${falta===1?"produto":"produtos"}. Conte, ou marque Não tem nos que a loja não tem.`};
    return {ok:true}; });
});}

/* ===================== VALIDADE NA ENTREGA =====================
   Os pedidos com entrega prevista para hoje (e nos dois dias antes). Para
   cada pedido, o repositor diz se chegou; se chegou, anota o vencimento de
   cada produto. "Ainda nao chegou" tambem resolve: nao trava o encerramento. */
let ENTREGAS=null, ABERTA_ENT=null;
const entregasDe=l=>(ENTREGAS&&ENTREGAS[l.id])||[];
async function buscarEntregas(data){
  const guardado=guarda.lerJ("entr:"+data); if(guardado&&!ENTREGAS) ENTREGAS=guardado;
  if(!navigator.onLine) return;
  try{ const r=await api("/rest/v1/rpc/minhas_entregas",{method:"POST",body:JSON.stringify({p_data:data})})||{};
    if(data!==DATA) return;
    for(const [lid,ps] of Object.entries(guardado||{})){ const novos=r[lid]; if(!novos) continue;
      ps.forEach(p=>{ const n=novos.find(x=>x.nr_pedido===p.nr_pedido); if(!n) return;
        if(p.conferencia&&!n.conferencia) n.conferencia=p.conferencia;
        (p.itens||[]).forEach(it=>{ const ni=(n.itens||[]).find(y=>y.produto_id===it.produto_id); if(ni&&it.vence_em&&!ni.vence_em){ ni.vence_em=it.vence_em; ni.lote=it.lote; } }); }); }
    ENTREGAS=r; guarda.porJ("entr:"+data,ENTREGAS); delete ERRO_BUSCA.entregas;
  }catch(e){ ERRO_BUSCA.entregas=e.message; }
}
function telaEntrega(){ montar(()=>{ TELA="mod"; esconderTudo();
  topo("Validade na Entrega", telaLoja, "");
  const es=entregasDe(LOJA);
  const dias=d=>Math.round((new Date(d+"T12:00")-new Date(DATA+"T12:00"))/864e5);
  const card=(p,i)=>{ const c=p.conferencia, aberta=ABERTA_ENT===p.nr_pedido, its=p.itens||[];
    return `<div class="cartao" style="margin-bottom:10px;${p.hoje&&!c?"border-left:4px solid var(--verm)":""}">
      <div style="display:flex;justify-content:space-between;gap:8px"><b>Pedido ${esc(p.nr_pedido)}</b>
        <span class="selo" style="background:${c?(c.situacao==="conferida"?"var(--verde-bg)":"var(--amb-bg)"):"var(--verm-bg)"};color:${c?(c.situacao==="conferida"?"var(--verde)":"var(--amb)"):"var(--verm)"}">${c?(c.situacao==="conferida"?"Conferida":"Não chegou"):p.hoje?"Chega hoje":"Previsto "+dataBr(p.previsao).slice(0,5)}</span></div>
      <div class="mut" style="font-size:13px;margin-top:4px">${esc(p.origem||"")}${p.origem?" · ":""}${its.length} ${its.length===1?"produto":"produtos"} · ${fmt1(p.caixas)} cx${c&&c.por?` · ${c.situacao==="conferida"?"conferida":"marcada"} por ${esc(c.por)}`:""}</div>
      ${aberta?`<div style="margin-top:10px">${its.map((it,j)=>{ const d=it.vence_em?dias(it.vence_em):null;
          return `<div style="padding:8px 0;border-top:1px solid var(--linha)"><div style="font-size:14px"><b>${esc(it.nome)}</b> <span class="mut">· ${fmt1(it.caixas)} cx</span></div>
            <div class="qt2"><span><input type="date" data-dv="${i}:${j}" value="${it.vence_em||""}"><small>vence em</small></span>
              <span><input data-dl="${i}:${j}" value="${esc(it.lote||"")}" placeholder="opcional" autocapitalize="characters"><small>lote</small></span></div>
            ${d!=null&&d<=30?`<div style="font-size:12.5px;color:${d<=20?"var(--verm)":"var(--amb)"};margin-top:3px">Validade curta: ${d<0?"já vencido":`vence em ${d} dias`}</div>`:""}</div>`; }).join("")}
          <button class="bt" data-salva="${i}" style="margin-top:8px">Salvar conferência</button></div>`
        : c&&c.situacao==="conferida" ? `<button class="bt sec" data-abre="${i}" style="margin-top:8px">Ver as datas</button>`
        : `<div class="pilha" style="margin-top:10px"><button class="bt" data-abre="${i}">Chegou: anotar as datas</button>${c?"":`<button class="bt sec" data-nchegou="${i}">Ainda não chegou</button>`}</div>`}
    </div>`; };
  const hoje=es.filter(p=>p.hoje), antes=es.filter(p=>!p.hoje);
  $("corpo").innerHTML=`
    ${ERRO_BUSCA.entregas&&!ENTREGAS?`<div class="aviso err">Não consegui buscar as entregas. ${esc(traduz(ERRO_BUSCA.entregas))}</div>`:""}
    <div class="aviso inf">Quando o pedido chegar, anote o vencimento de cada produto. Isso vai para o seu líder e o gerente.</div>
    <h2 class="tit">ENTREGA PREVISTA HOJE · ${hoje.length}</h2>
    ${hoje.length?hoje.map(p=>card(p,es.indexOf(p))).join(""):`<div class="vazio">Nenhuma entrega prevista para hoje nesta loja.</div>`}
    ${antes.length?`<h2 class="tit">PREVISTAS NOS ÚLTIMOS DIAS · ${antes.length}</h2>${antes.map(p=>card(p,es.indexOf(p))).join("")}`:""}`;
  const marca=(p,situacao)=>{ grava("entrega_conferencia","nr_pedido",{nr_pedido:p.nr_pedido, visita_id:LOJA.visita.id, loja_id:LOJA.id,
      pessoa_id:DIA.pessoa.id, situacao:situacao}); p.conferencia={situacao, por:DIA.pessoa.nome, em:new Date().toISOString()};
    guarda.porJ("entr:"+DATA,ENTREGAS); };
  $("corpo").querySelectorAll("[data-abre]").forEach(b=>b.onclick=()=>{ if(!exigeVisita()) return; ABERTA_ENT=es[+b.dataset.abre].nr_pedido; telaEntrega(); });
  $("corpo").querySelectorAll("[data-nchegou]").forEach(b=>b.onclick=()=>{ if(!exigeVisita()) return; marca(es[+b.dataset.nchegou],"nao_chegou"); telaEntrega(); });
  $("corpo").querySelectorAll("[data-dv]").forEach(inp=>inp.onchange=()=>{ const [i,j]=inp.dataset.dv.split(":").map(Number); es[i].itens[j].vence_em=inp.value||null; guarda.porJ("entr:"+DATA,ENTREGAS); telaEntrega(); });
  $("corpo").querySelectorAll("[data-dl]").forEach(inp=>inp.onchange=()=>{ const [i,j]=inp.dataset.dl.split(":").map(Number); es[i].itens[j].lote=inp.value.trim()||null; guarda.porJ("entr:"+DATA,ENTREGAS); });
  $("corpo").querySelectorAll("[data-salva]").forEach(b=>b.onclick=()=>{ if(!exigeVisita()) return; const p=es[+b.dataset.salva];
    const falta=(p.itens||[]).filter(it=>!it.vence_em).length;
    if(falta) return alerta(`Falta a data de ${falta} ${falta===1?"produto":"produtos"}.`);
    (p.itens||[]).forEach(it=>grava("entrega_validade","nr_pedido,produto_id",{nr_pedido:p.nr_pedido, produto_id:it.produto_id,
      visita_id:LOJA.visita.id, loja_id:LOJA.id, pessoa_id:DIA.pessoa.id, vence_em:it.vence_em, lote:it.lote||null}));
    marca(p,"conferida"); ABERTA_ENT=null; alerta("Conferência salva."); telaEntrega(); });
  rodape(`<button class="bt sec" id="volEnt">Voltar</button>`); $("volEnt").onclick=()=>telaLoja();
});}

/* ============================ DEMANDAS ============================
   No lugar da conversa. Nao e bate-papo: cada demanda tem um pedido, uma
   resposta e uma situacao.
   - Do lider para mim: respondo "Feito" ou "Nao consegui" (com motivo). As de
     uma loja tambem aparecem na loja, e com prazo vencido travam o
     encerramento, como sempre.
   - Minhas para o lider: mando, e vejo a resposta quando ele responder. */
let DEMANDAS=null;
async function buscarDemandas(){
  if(!navigator.onLine) return;
  try{ const d=await api("/rest/v1/rpc/minhas_demandas",{method:"POST",body:"{}"});
    /* o que mandei e ainda nao subiu continua na lista */
    const locais=(DEMANDAS&&DEMANDAS.para_lider||[]).filter(x=>x.local&&!(d.para_lider||[]).some(y=>y.id===x.id));
    const vistas=new Set(JSON.parse(guarda.ler("dem_vistas")||"[]"));
    (d.para_lider||[]).forEach(x=>{ if(vistas.has(x.id+":"+(x.respondido_em||""))) x.visto=true; });
    d.para_lider=[...locais,...(d.para_lider||[])];
    const resp=new Set(JSON.parse(guarda.ler("dem_respondidas")||"[]"));
    (d.do_lider||[]).forEach(t=>{ if(!t.resposta&&resp.has(t.id)) t.resposta={situacao:"enviando"}; });
    DEMANDAS=d; guarda.porJ("demandas",d);
    /* redesenha sem buscar de novo: senao a tela e a busca se chamariam para sempre */
    if(TELA==="home") pintaLojas(); else if(TELA==="dem") telaDemandas(true); else if(TELA==="loja") telaLoja();
  }catch(e){ ERRO_BUSCA.demandas=e.message; }
}
const demandasParaResponder=()=>(DEMANDAS&&DEMANDAS.do_lider||[]).filter(t=>!t.resposta);

      <div class="mut" style="margin-top:6px;font-size:13px">${quando(d.criado_em)}${d.loja?` · ${esc(d.loja)}`:""}</div>

/* Demanda para o lider: nao e mensagem. O repositor diz SOBRE O QUE e (uma
   geladeira, um produto, um lote, um pedido, a loja), QUAL, e O QUE ESTA
   ACONTECENDO. Comentario e foto completam. O lider recebe isso organizado. */
const TIPOS_DEM={
  ativo:{t:"Geladeira ou material", modulo:"pdv", motivos:["Danificada","Desligada","Suja","Com produto concorrente","Mal posicionada","Sem PTM","Outro"]},
  produto:{t:"Produto", modulo:"estoque", motivos:["Avariado","Sem preço","Fora do lugar","Estoque diferente do esperado","Validade curta","Falta na loja","Outro"]},
  vencimento:{t:"Vencimento", modulo:"validade", motivos:["Não está girando","Loja não aceita troca","Precisa recolher","Quantidade não confere","Outro"]},
  pedido:{t:"Pedido ou entrega", modulo:"entrega", motivos:["Não chegou","Chegou faltando","Chegou avariado","Produto errado","Validade curta na entrega","Outro"]},
  loja:{t:"A loja", modulo:null, motivos:["Gerente não libera espaço","Sem acesso ao depósito","Loja fechada","Problema de preço","Pedido de material","Outro"]},
  outro:{t:"Outro assunto", modulo:null, motivos:[]}};
const NOME_ATIVO={geladeira:"Geladeira",gondola:"Gôndola",display:"Display",ilha:"Ilha",checkout:"Checkout",material:"Material",outro:"Outro"};
function itensDemanda(tipo){
  if(!LOJA) return [];
  if(tipo==="ativo"){ const c=censoDe(LOJA), vistos=new Set();
    return [...((c.desta_semana&&c.desta_semana.ativos)||[]),...(c.anteriores||[])].filter(a=>{ const k=a.tipo+"|"+(a.patrimonio||""); if(vistos.has(k)) return false; vistos.add(k); return true; })
      .map((a,i)=>({k:"a"+i, t:`${NOME_ATIVO[a.tipo]||a.tipo}${a.patrimonio?` · PTM ${a.patrimonio}`:" · sem PTM"}`, dado:{tipo:a.tipo, patrimonio:a.patrimonio||null}})); }
  if(tipo==="produto"){ const m=new Map();
    [...((ESTOQUE&&ESTOQUE[LOJA.id])||[]),...(oportDe(LOJA).itens||[]),...(LOJA.catalogo||[])].forEach(x=>{ if(x.produto_id&&!m.has(x.produto_id)) m.set(x.produto_id,x); });
    return [...m.values()].sort((a,b)=>String(a.nome).localeCompare(String(b.nome))).map(x=>{ const h=x.hoje||{};
      const cont=h.caixas!=null||h.unidades!=null?` · contei ${h.caixas!=null?h.caixas+" cx":""}${h.caixas!=null&&h.unidades!=null?" + ":""}${h.unidades!=null?h.unidades+" un":""}`:"";
      return {k:x.produto_id, t:`${x.nome}${cont}`, dado:{produto_id:x.produto_id, nome:x.nome, contagem:(h.caixas!=null||h.unidades!=null)?{caixas:h.caixas??null, unidades:h.unidades??null}:null}}; }); }
  if(tipo==="vencimento") return lotesAtivos(LOJA).map(x=>({k:x.id, t:`${x.nome||x.produto} · lote ${x.lote||"sem lote"} · vence ${dataBr(x.vence_em).slice(0,5)}${x.quantidade_atual!=null?` · ${x.quantidade_atual} un`:""}`,
      dado:{validade_id:x.id, nome:x.nome||x.produto, lote:x.lote||null, vence_em:x.vence_em, quantidade:x.quantidade_atual??null}}));
  if(tipo==="pedido") return pedidosDe(LOJA).map(x=>({k:x.numero, t:`Pedido ${x.numero} · ${dataBr(x.emissao).slice(0,5)}${x.caixas?` · ${Math.round(x.caixas)} cx`:""}`, dado:{pedido:x.numero, emissao:x.emissao}}));
  return [];
}
function telaNovaDemanda(o){ o=o||{};
  /* vindo de um modulo ("Mandar para o lider"), ja chega com o assunto e o que ele marcou */
  const st=o._st||{tipo:o.modulo==="validade"?"vencimento":o.modulo==="oportunidade"?"produto":null, item:"", motivo:"", obs:o.texto||"", foto:{id:uid()}};
  montar(()=>{
  TELA="novadem"; esconderTudo(); const volta=o.volta||telaDemandas;
  topo("Demanda para o líder", ()=>volta(), "");
  const tipos=LOJA?Object.keys(TIPOS_DEM):["outro"];
  if(!LOJA&&!st.tipo) st.tipo="outro";
  const T=st.tipo&&TIPOS_DEM[st.tipo], itens=st.tipo?itensDemanda(st.tipo):[];
  const chips=(lista,at,attr)=>`<div class="pilha" style="flex-wrap:wrap;gap:8px;margin-top:8px">${lista.map(([k,t])=>`<button class="${k===at?"on":""}" ${attr}="${esc(k)}" style="flex:none">${esc(t)}</button>`).join("")}</div>`;
  $("corpo").innerHTML=`
    ${LOJA?"":`<div class="aviso inf">Para falar de uma geladeira, um produto, um lote ou um pedido, abra a demanda de dentro da loja.</div>`}
    <div class="cartao"><b>Sobre o quê?</b>${chips(tipos.map(k=>[k,TIPOS_DEM[k].t]),st.tipo,"data-tipo")}</div>
    ${T&&itens.length?`<div class="cartao" style="margin-top:10px"><b>Qual?</b>
      <select id="demItem" style="width:100%;margin-top:8px"><option value="">Escolha…</option>${itens.map(x=>`<option value="${esc(x.k)}" ${x.k===st.item?"selected":""}>${esc(x.t)}</option>`).join("")}</select></div>`
      :T&&["ativo","produto","vencimento","pedido"].includes(st.tipo)?`<div class="aviso amb" style="margin-top:10px">Nada registrado desta loja para escolher. Conte no comentário qual é.</div>`:""}
    ${T&&T.motivos.length?`<div class="cartao" style="margin-top:10px"><b>O que está acontecendo?</b>${chips(T.motivos.map(m=>[m,m]),st.motivo,"data-mot")}</div>`:""}
    ${T?`<div class="cartao" style="margin-top:10px"><label for="demObs" style="font-weight:600">${st.tipo==="outro"||st.motivo==="Outro"?"Conte o que precisa":"Quer contar mais? (opcional)"}</label>
      <textarea id="demObs" rows="4" style="width:100%;box-sizing:border-box;margin-top:8px;font:inherit">${esc(st.obs)}</textarea></div>
    <div class="cartao" id="demFoto" style="margin-top:10px"><label style="font-weight:600">Foto, se ajudar a mostrar</label>${blocoFoto(st.foto)}</div>`:""}
    <div id="demErro"></div>`;
  const repinta=()=>{ if($("demObs")) st.obs=$("demObs").value; telaNovaDemanda({...o,_st:st}); };
  $("corpo").querySelectorAll("[data-tipo]").forEach(b=>b.onclick=()=>{ if(st.tipo!==b.dataset.tipo){ st.tipo=b.dataset.tipo; st.item=""; st.motivo=""; } repinta(); });
  $("corpo").querySelectorAll("[data-mot]").forEach(b=>b.onclick=()=>{ st.motivo=b.dataset.mot; repinta(); });
  if($("demItem")) $("demItem").onchange=e=>{ st.item=e.target.value; };
  if($("demObs")) $("demObs").oninput=e=>{ st.obs=e.target.value; };
  if($("demFoto")){ const ligaF=()=>{ $("demFoto").innerHTML=`<label style="font-weight:600">Foto, se ajudar a mostrar</label>${blocoFoto(st.foto)}`;
    ligaFoto($("demFoto"), st.foto, {tabela:"demanda", semRegistro:true}, ligaF); }; ligaF(); }
  rodape(`<button class="bt sec" id="demVolta">Cancelar</button><button class="bt" id="demEnvia">Mandar</button>`);
  $("demVolta").onclick=()=>volta();
  $("demEnvia").onclick=()=>{
    if($("demObs")) st.obs=$("demObs").value.trim();
    const erro=m=>$("demErro").innerHTML=`<div class="aviso err" style="margin-top:10px">${m}</div>`;
    if(!st.tipo) return erro("Escolha sobre o quê é a demanda.");
    const T=TIPOS_DEM[st.tipo], it=itensDemanda(st.tipo).find(x=>x.k===st.item);
    if(itensDemanda(st.tipo).length&&!it) return erro("Escolha qual "+({ativo:"geladeira ou material",produto:"produto",vencimento:"lote",pedido:"pedido"}[st.tipo]||"item")+".");
    if(T.motivos.length&&!st.motivo) return erro("Escolha o que está acontecendo.");
    if((st.tipo==="outro"||st.motivo==="Outro")&&!st.obs) return erro("Conte o que precisa.");
    const texto=`${T.t}${it?` · ${it.t}`:""}${st.motivo?`: ${st.motivo}`:""}${st.obs?`\n${st.obs}`:""}`;
    const d=grava("demanda","id",{id:uid(), de_pessoa:DIA.pessoa.id, loja_id:LOJA?LOJA.id:null, modulo:T.modulo||o.modulo||null,
      tipo:st.tipo, texto:texto, contexto:{tipo:st.tipo, assunto:T.t, item:it?it.dado:null, item_texto:it?it.t:null, motivo:st.motivo||null, obs:st.obs||null, de_modulo:o.contexto||null},
      foto_url:st.foto.foto_url||null});
    DEMANDAS=DEMANDAS||{do_lider:[],para_lider:[]};
    DEMANDAS.para_lider=[{...d, loja:LOJA?LOJA.nome:null, criado_em:new Date().toISOString(), local:true}, ...(DEMANDAS.para_lider||[])];
    guarda.porJ("demandas",DEMANDAS);
    alerta("Mandado para o seu líder."); volta();
  };
});}

async function mandarCartao(tipo){
  if(!navigator.onLine) return alerta("Sem sinal. Cartão não é fila: mande quando voltar.");
  if(!CANAL) return alerta("Abra a conversa primeiro.");
  try{
    await api("/rest/v1/rpc/mandar_cartao",{method:"POST",
      body:JSON.stringify({p_canal:CANAL.canal_id, p_tipo:tipo})});

}

async function enviarMensagem(){
  const t=$("txt").value.trim(); if(!t||!CANAL) return;
  if(!navigator.onLine) return alerta("Sem sinal. Mensagem não é fila: mande quando voltar.");
  const b=$("env"); b.disabled=true;
  try{
    await api("/rest/v1/mensagem",{method:"POST",
      headers:{"Prefer":"return=minimal"},
      body:JSON.stringify({id:uid(), canal_id:CANAL.canal_id, autor_id:DIA.pessoa.id, texto:t})});

  }catch(e){ alerta(traduz(e.message)); }

}

async function prepararConvite(papel){

function copiarLink(){
  if(!CONVITE) return alerta(CONVITE_ERRO||"O link ainda está sendo preparado.");

  if(navigator.clipboard) navigator.clipboard.writeText(t)

/* --------------------------- visita -------------------------- */
/* Distancia ate a loja, em metros, e como dizer isso ao repositor. */
const RAIO_VISITA=()=>(DIA&&DIA.raio_visita_m)||300;
function distLoja(g,l){ if(!g||!l||l.gps_lat==null||l.gps_lon==null) return null;
  const r=x=>x*Math.PI/180, dLa=r(l.gps_lat-g.lat), dLo=r(l.gps_lon-g.lon);
  const a=Math.sin(dLa/2)**2+Math.cos(r(g.lat))*Math.cos(r(l.gps_lat))*Math.sin(dLo/2)**2; return Math.round(2*6371000*Math.asin(Math.sqrt(a))); }
const distTxt=m=>m<1000?`${m} m`:`${(m/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})} km`;
function avisoLocal(g, momento, l){ l=l||LOJA;
  if(!g) return alerta(`Sem GPS agora. ${momento==="inicio"?"A visita começou":"A visita foi encerrada"} assim mesmo, sem a localização.`);
  const d=distLoja(g,l);
  if(d==null) return alerta(`${momento==="inicio"?"Visita iniciada":"Visita encerrada"}. Esta loja não tem localização cadastrada para comparar.`);
  if(d<=RAIO_VISITA()) return alerta(`${momento==="inicio"?"Visita iniciada":"Visita encerrada"} na loja, a ${distTxt(d)}.`);
  alerta(`Atenção: você está a ${distTxt(d)} da loja. ${momento==="inicio"?"A visita começou":"A visita foi encerrada"} assim mesmo, e o seu líder vê essa distância.`);
}
function posicao(){ return new Promise(res=>{
  if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(
    p=>res({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}),
    ()=>res(null),{enableHighAccuracy:true,timeout:8000,maximumAge:0}); }); }
async function iniciarVisita(){
  const b=$("ini"); if(b){ b.disabled=true; b.textContent="Localizando…"; }
  const g=await posicao();
  const v={id:uid(), pessoa_id:DIA.pessoa.id, rota_id:DIA.rota?DIA.rota.id:null, loja_id:LOJA.id,
    data:DIA.data, hora_inicio:agora(), situacao:"em_andamento",
    gps_lat:g?g.lat:null, gps_lon:g?g.lon:null, gps_acc:g?g.acc:null};
  LOJA.visita={id:v.id,situacao:"em_andamento",hora_inicio:v.hora_inicio,hora_fim:null};
  grava("visita","pessoa_id,loja_id,data",v); telaLoja();
  avisoLocal(g,"inicio");
}
async function encerrarVisita(){
  /* O que trava o encerramento, nesta ordem:
       1. produto zerado sem motivo na Oportunidade de Estoque
       2. modulo obrigatorio desta visita sem concluir
       3. modulo semanal na ultima visita da semana, se ninguem fez
       4. solicitacao da lideranca com prazo vencido e sem resposta   */
  const r=resumoOport(LOJA);
  if(r.semMotivo){
    alerta(`${r.semMotivo} ${r.semMotivo===1?"produto zerado está":"produtos zerados estão"} sem motivo. Abra a Oportunidade de Estoque e informe.`);
    return telaOportunidade();
  }
  const falta=modulosAtivos().filter(m=>estadoModulo(LOJA,m.k).k==="obrig");
  if(falta.length){
    alerta(`Falta concluir: ${falta.map(m=>m.nome).join(", ")}.`);
    return falta[0].tela();
  }
  const venc=tarefasDe(LOJA).filter(tarefaVencida);
  if(venc.length){
    alerta(`${venc.length} ${venc.length===1?"solicitação vencida está":"solicitações vencidas estão"} sem resposta.`);
    return telaTarefa(venc[0]);
  }
  /* a hora do encerramento e a do toque; a localizacao vem logo depois */
  LOJA.visita.hora_fim=agora(); LOJA.visita.situacao="concluida";
  const loja=LOJA, b=$("fim"); if(b){ b.disabled=true; b.textContent="Localizando…"; }
  const g=await posicao();
  grava("visita","pessoa_id,loja_id,data",{id:loja.visita.id, pessoa_id:DIA.pessoa.id,
    rota_id:DIA.rota?DIA.rota.id:null, loja_id:loja.id, data:DIA.data,
    hora_inicio:loja.visita.hora_inicio, hora_fim:loja.visita.hora_fim, situacao:"concluida",
    gps_fim_lat:g?g.lat:null, gps_fim_lon:g?g.lon:null, gps_fim_acc:g?g.acc:null});
  telaVisitas(); avisoLocal(g,"fim",loja);
}

/* botao fisico de voltar */
history.pushState({t:"home"},"");
addEventListener("popstate",()=>{ history.pushState({t:TELA},"");
  if($("menu").classList.contains("on")) return fecharMenu();
  if(TELA==="mod"){ pararRelogio(); telaLoja(); }
  else if(TELA==="mapa") fecharMapa();
  else if(TELA==="loja"||TELA==="outra") telaVisitas(); });

function enderecoValido(u){ return /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(String(u||"").trim().replace(/\/+$/,"")); }

function limparDiasGuardados(){
  /* So limpa se nao houver nada esperando para ser enviado. O que esta na
     fila aponta para a visita guardada; apagar antes de enviar poderia
     separar a contagem da visita dela. Se tiver fila, espera a proxima. */
  if(fila.itens().length) return false;
  const ks=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(k&&(k.startsWith("dia:")||k.startsWith("oport:")||k.startsWith("pedidos:")||k.startsWith("censo:")||k.startsWith("obrig:")||k.startsWith("venc:")||k==="semana")) ks.push(k); } }catch(e){}
  ks.forEach(guarda.tira); SEMANA=[];
  return true;
}
if(guarda.ler("versao")!==VERSAO_APP && limparDiasGuardados()) guarda.por("versao",VERSAO_APP);

montar(()=>{ pintaFila();
  if(!URLB||!CHAVE) return telaConfig();
  /* Endereco torto trava o app com erro que nao explica nada. Melhor barrar
     aqui, com texto que diz onde esta o problema. */
  if(!enderecoValido(URLB)){
    esconderTudo();
    $("topo").innerHTML=`<h1 style="padding-left:14px">Configuração</h1>`;
    $("corpo").innerHTML=`<div class="aviso err"><b>O endereço do sistema está incompleto.</b><br><br>
      Está gravado como:<br><code style="word-break:break-all">${esc(URLB||"(vazio)")}</code><br><br>
      Deveria ser parecido com <code>https://xxxxxxxx.supabase.co</code>, sem barra no fim.
      Mostre esta tela ao seu líder.</div>`;
    return rodape(`<button class="bt sec" id="lim">Digitar de novo</button>`),
      ($("lim").onclick=()=>{["url","chave"].forEach(guarda.tira);URLB="";CHAVE="";telaConfig();});
  }
  if(!guarda.ler("token")) return telaLogin();
  if(guarda.ler("pin")) return telaPin("conferir");
  carregarDia(hojeIso()); });
</script>
