<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Merchandising</title>
<style>
:root{
  --verm:#E4002B; --verm-bg:#FDE7EC; --verm-esc:#B80022;
  --azul:#1E6FD9; --azul-bg:#E9F1FC;
  --ink:#1A1D21; --ink2:#6B7280; --ink3:#9CA3AF;
  --linha:#E5E7EB; --papel:#FFF; --fundo:#F2F3F5;
  --verde:#0F7A52; --verde-bg:#E6F4EE;
  --amb:#96620F; --amb-bg:#FDF2DC;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sombra:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --topo:env(safe-area-inset-top,0px); --base:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior-y:contain}
body{background:var(--fundo);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---- barra de topo ---- */
.topo{flex:none;background:var(--papel);padding:calc(8px + var(--topo)) 8px 8px;
  display:flex;align-items:center;gap:4px;min-height:0;border-bottom:1px solid var(--linha)}
.avatar{flex:none;width:37px;height:37px;border-radius:50%;background:var(--verm-bg);color:var(--verm);
  border:none;font:inherit;font-weight:700;font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.icone{flex:none;width:40px;height:40px;border:none;background:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.icone.verm{color:var(--verm)}
.topo h1{font-size:18px;font-weight:600;margin:0;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
svg{display:block}

/* ---- menu lateral ---- */
.sombra-menu{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:40;display:none}
.sombra-menu.on{display:block}
.menu{position:fixed;left:0;right:0;bottom:0;background:var(--papel);z-index:41;
  border-radius:18px 18px 0 0;transform:translateY(102%);transition:transform .2s ease;
  padding-bottom:calc(14px + var(--base));max-height:88%;overflow-y:auto;
  box-shadow:0 -8px 30px rgba(16,24,40,.16)}
.menu.on{transform:none}
.puxador{width:40px;height:4px;border-radius:4px;background:#D7DBE0;margin:10px auto 4px}
.menu .perfil{display:flex;gap:14px;align-items:center;padding:14px 20px 16px}
.menu .bolota{width:48px;height:48px;border-radius:50%;background:var(--verm-bg);color:var(--verm);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
.menu .perfil b{display:block;font-size:16.5px;font-weight:600}
.menu .perfil span{font-size:13px;color:var(--ink2)}
.menu .sinc{margin:0 20px;width:calc(100% - 40px);background:var(--verm);color:#fff;border:none;
  border-radius:12px;padding:15px;font-size:16px;font-weight:600;display:flex;align-items:center;
  justify-content:center;gap:10px;cursor:pointer;font-family:inherit}
.menu .quando{display:flex;justify-content:space-between;padding:11px 20px 4px;font-size:13.5px;color:var(--ink2)}
.menu .quando b{color:var(--verm);font-weight:600}
.menu .numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:12px 20px 4px}
.menu .numeros div{background:var(--fundo);border-radius:12px;padding:11px;text-align:center}
.menu .numeros b{display:block;font-size:18px;font-weight:700}
.menu .numeros span{font-size:11.5px;color:var(--ink2)}
.menu .diag{padding:10px 20px 0;font-size:13px;color:var(--ink3)}
.menu .diag .ruim{color:var(--verm)}
.menu .sair{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 40px);
  margin:16px 20px 0;background:none;border:1px solid var(--linha);border-radius:12px;padding:14px;
  font:inherit;font-size:15px;color:var(--verm);font-weight:600;cursor:pointer}

/* ---- faixa de dias ---- */
.dias{flex:none;background:var(--papel);border-bottom:1px solid var(--linha);padding:8px 0 10px}
.dias .tira{display:flex;gap:10px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.dias .tira::-webkit-scrollbar{display:none}
.dia{flex:none;width:52px;text-align:center;background:none;border:none;cursor:pointer;font:inherit;padding:0}
.dia .rot{font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.dia .num{width:46px;height:46px;border-radius:50%;background:#EFF1F3;color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;margin:0 auto}
.dia.hoje .rot{font-weight:600;color:var(--ink)}
.dia.sel .num{background:var(--azul);color:#fff}
.dia .badge{display:inline-block;margin-top:4px;background:var(--verm);color:#fff;font-size:11px;
  font-weight:600;border-radius:20px;padding:1px 9px;min-width:24px}
.dia .badge.zero{background:#D7DBE0;color:#6B7280}
.resumo-dia{text-align:center;font-size:13px;color:var(--ink2);padding:9px 16px 0}
.resumo-dia .pt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--verm);
  margin-right:7px;vertical-align:1px}

/* ---- busca ---- */
.barra{flex:none;background:var(--fundo);padding:10px 14px 4px;display:flex;gap:10px}
.busca{flex:1;display:flex;align-items:center;gap:10px;background:var(--papel);border:1px solid var(--linha);
  border-radius:12px;padding:0 14px;box-shadow:var(--sombra)}
.busca input{flex:1;border:none;outline:none;padding:12px 0;font:inherit;font-size:14.5px;background:none;color:var(--ink)}
.quad{flex:none;width:48px;height:48px;background:var(--papel);border:1px solid var(--linha);border-radius:12px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);box-shadow:var(--sombra)}
.quad.on{color:var(--verm)}

.corpo{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px 26px}

/* ---- cartao de loja ---- */
.loja{background:var(--papel);border-radius:14px;box-shadow:var(--sombra);margin-bottom:12px;
  border-left:4px solid var(--azul);overflow:hidden}
.loja.feita{border-left-color:var(--verde)}
.loja.alta{border-left-color:var(--verm)}
.loja .dentro{padding:13px 15px}
.loja .cab{display:flex;gap:10px;align-items:flex-start}
.loja .titulo{flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.25}
.loja .titulo i{font-style:normal;color:var(--ink3);font-weight:600;margin-right:4px}
.selos{flex:none;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.selo{font-size:12px;font-weight:500;border-radius:8px;padding:3px 10px;white-space:nowrap}
.selo.alta{background:var(--verm-bg);color:var(--verm)}
.selo.pend{background:var(--azul-bg);color:var(--azul)}
.selo.feito{background:var(--verde-bg);color:var(--verde)}
.loja .hora{font-size:13px;color:var(--ink2);text-align:right;margin-top:6px}
.loja .end{font-size:13px;color:var(--ink2);margin-top:8px}
.loja .desc{font-size:13px;color:var(--ink2);margin-top:5px}
.loja .pe{display:flex;align-items:center;gap:12px;margin-top:12px}
.bolinha{width:42px;height:42px;border-radius:50%;background:var(--verm-bg);color:var(--verm);
  border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.bolinha:disabled{opacity:.4}
.progresso{flex:1;display:flex;align-items:center;gap:10px}
.trilho{flex:1;height:7px;background:#EBEDF0;border-radius:10px;overflow:hidden}
.trilho i{display:block;height:100%;background:var(--verde);border-radius:10px}
.fracao{font-size:13px;color:var(--ink2);font-weight:500;flex:none}

/* ---- geral ---- */
button{font-family:inherit}
.bt{width:100%;padding:15px;font-size:16px;font-weight:600;background:var(--verm);color:#fff;
  border:none;border-radius:12px;cursor:pointer}
.bt.sec{background:var(--papel);color:var(--ink);border:1px solid var(--linha)}
.bt:disabled{opacity:.45}
.rodape{flex:none;background:var(--papel);border-top:1px solid var(--linha);
  padding:12px 14px calc(12px + var(--base));display:flex;gap:10px}
input,select{font:inherit;width:100%;padding:12px;border:1px solid var(--linha);border-radius:12px;
  background:var(--papel);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-bg)}
label{display:block;font-size:12.5px;color:var(--ink2);margin:0 0 6px}
.campo{margin-bottom:15px}
h2.tit{font-size:12px;font-weight:700;color:var(--ink2);margin:18px 0 9px;letter-spacing:.02em}
h2.tit:first-child{margin-top:2px}
.cartao{background:var(--papel);border-radius:14px;box-shadow:var(--sombra);padding:13px 15px;margin-bottom:12px}
.mod{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--papel);
  border:none;border-radius:14px;box-shadow:var(--sombra);padding:13px 15px;margin-bottom:9px;font:inherit;color:inherit;cursor:pointer}
.mod .ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--azul-bg);color:var(--azul);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.mod.alerta .ic{background:var(--verm-bg);color:var(--verm)}
.mod.pronto .ic{background:var(--verde);color:#fff}
.mod .txt{flex:1;min-width:0}
.mod .txt b{display:block;font-size:14.5px;font-weight:600}
.mod .txt span{font-size:13px;color:var(--ink2)}
.item{background:var(--papel);border-radius:14px;box-shadow:var(--sombra);padding:12px 14px;margin-bottom:10px}
.item.crit{border-left:4px solid var(--verm)}
.item.aten{border-left:4px solid var(--amb)}
.item .nome{font-size:14.5px;font-weight:600;line-height:1.3}
.item .emb{font-size:12.5px;color:var(--ink3);margin-top:2px}
.nums{display:flex;gap:9px;margin-top:11px;align-items:flex-end}
.nums>div{flex:1}.nums label{font-size:11.5px;margin-bottom:4px}
.nums input{padding:11px;text-align:center;font-size:16px;font-weight:600}
.pilha{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pilha button{flex:1 1 auto;min-width:86px;padding:10px 8px;font-size:12.5px;background:var(--papel);
  border:1px solid var(--linha);border-radius:10px;color:var(--ink2);cursor:pointer}
.pilha button.on{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:500}
.pilha button.on.mau{background:var(--verm);border-color:var(--verm)}
.pilha button.on.meio{background:var(--amb);border-color:var(--amb)}
.aviso{padding:12px 14px;border-radius:12px;font-size:13.5px;margin-bottom:12px}
.aviso.err{background:var(--verm-bg);color:var(--verm-esc)}
.aviso.inf{background:var(--azul-bg);color:var(--azul)}
.aviso.amb{background:var(--amb-bg);color:var(--amb)}
.vazio{text-align:center;color:var(--ink3);padding:38px 18px;font-size:14px}
.fila{flex:none;background:var(--amb-bg);color:var(--amb);font-size:13px;padding:8px 16px;text-align:center;display:none}
.fila.on{display:block}
.oculto{display:none!important}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:290px;margin:0 auto}
.pin button{padding:17px;font-size:21px;background:var(--papel);border:1px solid var(--linha);
  border-radius:12px;cursor:pointer;box-shadow:var(--sombra)}
.bolas{display:flex;gap:15px;justify-content:center;margin:24px 0 28px}
.bola{width:13px;height:13px;border-radius:50%;border:2px solid var(--linha)}
.bola.on{background:var(--verm);border-color:var(--verm)}
.msg{max-width:84%;margin-bottom:9px;padding:9px 12px;border-radius:14px;box-shadow:var(--sombra);
  background:var(--papel);word-wrap:break-word}
.msg.minha{margin-left:auto;background:var(--verde-bg)}
.msg .quem{font-size:11.5px;font-weight:600;color:var(--azul);margin-bottom:2px}
.msg.minha .quem{color:var(--verde)}
.msg .txt{font-size:14px;white-space:pre-wrap}
.msg .h{font-size:10.5px;color:var(--ink3);text-align:right;margin-top:3px}
.msg .anexo{font-size:12px;color:var(--ink2);background:var(--fundo);border-radius:9px;padding:7px 9px;margin-top:5px}
.diamsg{text-align:center;font-size:11.5px;color:var(--ink3);margin:12px 0 9px}
.cartao-msg{margin-top:7px;border:1px solid var(--linha);border-radius:11px;overflow:hidden;background:var(--fundo)}
.cartao-msg .cab{background:var(--azul-bg);color:var(--azul);padding:7px 11px;font-size:12.5px;font-weight:600}
.cartao-msg .cab.rup{background:var(--verm-bg);color:var(--verm)}
.cartao-msg .cab.val{background:var(--amb-bg);color:var(--amb)}
.cartao-msg ul{margin:0;padding:6px 11px 8px;list-style:none}
.cartao-msg li{font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--linha)}
.cartao-msg li:last-child{border:none}
.cartao-msg li b{font-weight:600;display:block}
.cartao-msg li span{color:var(--ink2)}
.cartao-msg .pe{font-size:11px;color:var(--ink3);padding:0 11px 8px}
.anexar{flex:none;width:42px;height:42px;border-radius:50%;background:var(--papel);
  border:1px solid var(--linha);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.escrever{display:flex;gap:8px;align-items:flex-end;width:100%}
.escrever textarea{flex:1;font:inherit;font-size:14.5px;border:1px solid var(--linha);border-radius:18px;
  padding:10px 14px;resize:none;max-height:110px;background:var(--fundo);color:var(--ink);outline:none}
.escrever textarea:focus{border-color:var(--azul);background:var(--papel)}
.escrever .env{flex:none;width:42px;height:42px;border-radius:50%;background:var(--verm);color:#fff;
  border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.escrever .env:disabled{opacity:.4}
.abas{display:flex;gap:8px;margin-bottom:12px}
.abas button{flex:1;padding:10px;font:inherit;font-size:13px;background:var(--papel);
  border:1px solid var(--linha);border-radius:10px;color:var(--ink2);cursor:pointer}
.abas button.on{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:500}
.sino{position:absolute;top:8px;right:10px;background:var(--verm);color:#fff;font-size:10.5px;
  font-weight:700;border-radius:20px;padding:1px 6px;min-width:18px;text-align:center}
.mod{position:relative}
.foto{display:flex;gap:9px;align-items:center;margin-top:10px}
.foto .bt-foto{flex:none;display:flex;align-items:center;gap:8px;background:var(--papel);
  border:1px solid var(--linha);border-radius:10px;padding:9px 13px;font:inherit;font-size:12.5px;
  color:var(--ink2);cursor:pointer}
.foto .bt-foto.tem{border-color:var(--verde);color:var(--verde);font-weight:500}
.foto img{width:46px;height:46px;object-fit:cover;border-radius:9px;border:1px solid var(--linha)}
.foto .est{font-size:12px;color:var(--ink3)}
.foto .est.env{color:var(--amb)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="sombra-menu" id="sombra"></div>
<aside class="menu" id="menu"></aside>
<div id="app">
  <div class="topo" id="topo"></div>
  <div class="fila" id="fila"></div>
  <div id="dias" class="oculto"></div>
  <div id="barra" class="oculto"></div>
  <div class="corpo" id="corpo"></div>
  <div class="rodape oculto" id="rodape"></div>
</div>
<script>
"use strict";
/* ===================== CONFIGURACAO ===================== */
const CFG = { url:"", chave:"", dominio:"merch.local" };
/* ======================================================== */

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const guarda=(()=>{ const mem={}; let ok=true;
  try{ localStorage.setItem("_t","1"); localStorage.removeItem("_t"); }catch(e){ ok=false; }
  const g={ ler:k=>{try{return ok?localStorage.getItem(k):(mem[k]??null)}catch(e){return mem[k]??null}},
    por:(k,v)=>{try{ ok?localStorage.setItem(k,v):(mem[k]=v) }catch(e){ mem[k]=v }},
    tira:k=>{try{ ok?localStorage.removeItem(k):delete mem[k] }catch(e){ delete mem[k] }} };
  g.lerJ=k=>{ try{ return JSON.parse(g.ler(k)||"null") }catch(e){ return null } };
  g.porJ=(k,v)=>g.por(k,JSON.stringify(v)); return g; })();

let URLB=guarda.ler("url")||CFG.url, CHAVE=guarda.ler("chave")||CFG.chave;
let DIA=null, LOJA=null, TELA="carregando", DATA=null, FILTRO="";

const hojeIso=()=>{const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
const agora=()=>new Date().toTimeString().slice(0,8);
const dataBr=s=>s?String(s).slice(0,10).split("-").reverse().join("/"):"—";
const uid=()=>crypto.randomUUID();
const diasAte=d=>Math.round((new Date(String(d).slice(0,10)+"T12:00:00")-new Date(hojeIso()+"T12:00:00"))/864e5);
const editavel=()=>DATA===hojeIso();

const IC={
  volta:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  sinc:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 01-9 9 9 9 0 01-7.5-4M3 12a9 9 0 019-9 9 9 0 017.5 4"/><path d="M21 3v5h-5M3 21v-5h5"/></svg>',
  sair:'<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5a1 1 0 00-1 1v14a1 1 0 001 1h5"/><path d="M16 15l4-3-4-3M20 12H9"/></svg>',
  lupa:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  filtro:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
  lista:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  mapa:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
  pessoa:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20a6.5 6.5 0 0113 0"/></svg>',
  fone:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h3l2 5-2.5 1.5a12 12 0 006 6L16 13l5 2v3a2 2 0 01-2.2 2A17 17 0 014 5.2 2 2 0 016 3z"/></svg>',
  fala:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 15a2 2 0 01-2 2H8l-4 3V6a2 2 0 012-2h12a2 2 0 012 2z"/></svg>',
  mais:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  env:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 12L4 4l6 8-6 8z"/></svg>',
  cam:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8.5h3.2L8 6h8l1.8 2.5H21v11H3z"/><circle cx="12" cy="14" r="3.4"/></svg>',
  seta:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 18-8-5-8 5z"/></svg>'
};

/* --------------------------- rede --------------------------- */
async function api(caminho,opc={},retry=true){
  const tok=guarda.ler("token");
  const r=await fetch(URLB.replace(/\/+$/,"")+caminho,{...opc,
    headers:{"apikey":CHAVE,"Content-Type":"application/json",
      ...(tok?{"Authorization":"Bearer "+tok}:{}),...(opc.headers||{})}});
  if(r.status===401&&retry&&guarda.ler("refresh")&&await renovar()) return api(caminho,opc,false);
  const t=await r.text(); let c=null;
  try{ c=t?JSON.parse(t):null }catch(e){ c={raw:t} }
  if(!r.ok){
    /* Resposta em HTML nao veio do banco, veio de um servidor web. Quase
       sempre significa endereco errado no CFG. Despejar o HTML na tela nao
       ajuda ninguem: melhor dizer o que fazer. */
    let m=c?.message||c?.error_description||c?.msg||c?.raw||("HTTP "+r.status);
    if(/^\s*<(!doctype|html)/i.test(String(m)))
      m="O endereço do sistema parece errado. Fale com seu líder: o app está "
       +"tentando falar com o lugar errado (HTTP "+r.status+").";
    throw Object.assign(new Error(m),{status:r.status});
  }
  return c;
}
async function renovar(){ try{
    const d=await api("/auth/v1/token?grant_type=refresh_token",
      {method:"POST",body:JSON.stringify({refresh_token:guarda.ler("refresh")})},false);
    guarda.por("token",d.access_token); guarda.por("refresh",d.refresh_token); return true;
  }catch(e){ return false } }
const emailDaRota=c=>`rota-${String(c).trim().toLowerCase()}@${CFG.dominio}`;

/* ---------------------- fila de envio ------------------------ */
const fila={ itens:()=>guarda.lerJ("fila")||[],
  poe(i){ const f=this.itens(); f.push({...i,fid:uid(),tentativas:0}); guarda.porJ("fila",f); pintaFila(); },
  tira(fid){ guarda.porJ("fila",this.itens().filter(x=>x.fid!==fid)); pintaFila(); } };
let enviando=false;
async function escoar(){
  if(enviando||!navigator.onLine) return;
  const f=fila.itens(); if(!f.length) return;
  enviando=true;
  for(const it of f){
    if(it.parado) continue;
    try{ await api(`/rest/v1/${it.tabela}?on_conflict=${it.chave}`,{method:"POST",
        body:JSON.stringify(it.corpo),headers:{"Prefer":"resolution=merge-duplicates,return=minimal"}});
      fila.tira(it.fid);
    }catch(e){ it.tentativas=(it.tentativas||0)+1; it.erro=e.message;
      /* Depois de 5 tentativas o item sai da frente. NAO e apagado: fica
         marcado e aparece no painel para voce decidir. Antes disso, um unico
         registro com defeito segurava tudo o que viesse depois dele. */
      if(it.tentativas>=5) it.parado=true;
      guarda.porJ("fila",fila.itens().map(x=>x.fid===it.fid?it:x));
      if(!it.parado) break; }
  }
  enviando=false; pintaFila();
  if(!fila.itens().length) guarda.por("sinc",new Date().toISOString());
}
async function pintaFila(){
  const f=fila.itens(), el=$("fila");
  let fotos=0; try{ fotos=((await cofreFoto.todas())||[]).length; }catch(e){}
  const n=f.length+fotos;
  if(!n){ el.classList.remove("on"); return; }
  const parados=f.filter(x=>x.parado).length;
  const detalhe=fotos?`${f.length} ${f.length===1?"registro":"registros"} e ${fotos} ${fotos===1?"foto":"fotos"}`
    :`${n} ${n===1?"envio pendente":"envios pendentes"}`;
  el.textContent=parados
    ? `${parados} ${parados===1?"envio parado":"envios parados"} · toque no seu nome`
    : `${detalhe}${navigator.onLine?"":" · sem sinal"}`;
  el.classList.add("on");
}
addEventListener("online",escoar); setInterval(escoar,20000);

/* ======================= FOTOS =============================
   Foto nao cabe na fila de texto: uma so ja passa do limite do
   armazenamento do navegador. Por isso a fila de foto e separada,
   guardada em IndexedDB, que aguenta arquivo.

   A ordem importa: sobe a imagem primeiro, e so depois manda o
   registro apontando para ela. Se mandasse junto, um envio que
   falhasse deixaria o registro com endereco de foto que nao existe.

   Comprime SEMPRE antes de enviar. Foto de celular tem 3 a 5 MB;
   depois de reduzir para 1280px e qualidade 0,65 fica em ~130 KB.
   Isso e a diferenca entre enviar em 3G de loja e nao enviar.
============================================================ */
const LARGURA_MAX=1280, QUALIDADE=0.65, IDADE_MAX_MIN=5;

const cofreFoto=(()=>{ let bd=null;
  const abrir=()=>new Promise((ok,nok)=>{ if(bd) return ok(bd);
    const r=indexedDB.open("fotos",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("f",{keyPath:"id"});
    r.onsuccess=()=>{ bd=r.result; ok(bd); }; r.onerror=()=>nok(r.error); });
  const tx=async(modo,fn)=>{ const d=await abrir();
    return new Promise((ok,nok)=>{ const t=d.transaction("f",modo), st=t.objectStore("f");
      const req=fn(st); t.oncomplete=()=>ok(req&&req.result); t.onerror=()=>nok(t.error); }); };
  return {
    poe:it=>tx("readwrite",st=>st.put(it)),
    tira:id=>tx("readwrite",st=>st.delete(id)),
    todas:()=>tx("readonly",st=>st.getAll()),
    pega:id=>tx("readonly",st=>st.get(id))
  };
})();

async function comprimir(arquivo){
  const bmp=await createImageBitmap(arquivo);
  const escala=Math.min(1, LARGURA_MAX/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");
  c.width=Math.round(bmp.width*escala); c.height=Math.round(bmp.height*escala);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  bmp.close&&bmp.close();
  return new Promise(ok=>c.toBlob(ok,"image/jpeg",QUALIDADE));
}

/* Verifica se a foto acabou de ser tirada. Sem isto, o repositor pode
   escolher da galeria uma foto de semanas atras e ninguem percebe. */
function recemTirada(arquivo){
  if(!arquivo.lastModified) return true;
  return (Date.now()-arquivo.lastModified) < IDADE_MAX_MIN*60000;
}

async function guardaFoto(arquivo, alvo){
  if(!recemTirada(arquivo)) throw new Error("Essa foto não foi tirada agora. Use a câmera.");
  const blob=await comprimir(arquivo);
  const id=uid();
  const caminho=`${LOJA.codigo}/${DIA.data}/${alvo.tabela}-${alvo.registro_id}-${id}.jpg`;
  await cofreFoto.poe({id, caminho, blob, alvo, tentativas:0});
  escoarFotos();
  return {id, caminho, url:URL.createObjectURL(blob)};
}

let enviandoFoto=false;
async function escoarFotos(){
  if(enviandoFoto||!navigator.onLine) return;
  let lista=[]; try{ lista=await cofreFoto.todas()||[]; }catch(e){ return; }
  if(!lista.length) return;
  enviandoFoto=true;
  for(const f of lista){
    try{
      const r=await fetch(URLB.replace(/\/+$/,"")+"/storage/v1/object/fotos/"+f.caminho,{
        method:"POST", headers:{"apikey":CHAVE,"Authorization":"Bearer "+guarda.ler("token"),
          "Content-Type":"image/jpeg","x-upsert":"true"}, body:f.blob});
      if(r.status===401){ if(await renovar()) continue; throw new Error("sessão expirada"); }
      if(!r.ok&&r.status!==409) throw new Error("HTTP "+r.status);
      // so agora o registro aponta para a foto
      fila.poe({tabela:f.alvo.tabela, chave:f.alvo.chave,
        corpo:{...f.alvo.corpo, foto_url:f.caminho}});
      await cofreFoto.tira(f.id);
      if(DIA){ // tira o "enviando..." da tela
        (DIA.lojas||[]).forEach(l=>["validades","exposicoes","materiais","concorrentes"].forEach(k=>
          (l[k]||[]).forEach(r=>{ if(r.foto_url===f.caminho) r._foto_pendente=false; })));
        salvarCache();
      }
      escoar();
    }catch(e){
      f.tentativas=(f.tentativas||0)+1; f.erro=e.message;
      await cofreFoto.poe(f); break;
    }
  }
  enviandoFoto=false; pintaFila();
}
addEventListener("online",escoarFotos); setInterval(escoarFotos,25000);

/* Monta o bloco de foto de um registro qualquer. */
function blocoFoto(reg){
  const tem=reg.foto_url||reg._foto_local;
  return `<div class="foto">
    <button class="bt-foto ${tem?"tem":""}" data-foto="1">${IC.cam} ${tem?"Trocar foto":"Tirar foto"}</button>
    ${reg._foto_local?`<img src="${reg._foto_local}" alt="">`:""}
    ${reg._foto_pendente?`<span class="est env">enviando…</span>`:tem?`<span class="est">foto anexada</span>`:""}
    <input type="file" accept="image/*" capture="environment" hidden></div>`;
}
function ligaFoto(caixa, reg, alvo, depois){
  const b=caixa.querySelector("[data-foto]"), inp=caixa.querySelector('input[type=file]');
  if(!b||!inp) return;
  b.onclick=()=>{ if(!exigeVisita()) return; inp.click(); };
  inp.onchange=async()=>{
    const a=inp.files&&inp.files[0]; if(!a) return;
    b.disabled=true; b.textContent="Preparando…";
    try{
      const f=await guardaFoto(a, {...alvo, registro_id:reg.id||reg.produto_id});
      reg._foto_local=f.url; reg._foto_pendente=true; reg.foto_url=f.caminho;
      salvarCache(); depois&&depois();
    }catch(e){ alerta(e.message); b.disabled=false; b.textContent="Tirar foto"; }
  };
}

async function entrarComRota(rota,senha){
  const email=emailDaRota(rota);
  const logar=()=>api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password:senha})},false);
  let d;
  try{ d=await logar(); }
  catch(e){ if(!/invalid login|credentials/i.test(e.message)) throw e;
    await api("/auth/v1/signup",{method:"POST",body:JSON.stringify({email,password:senha})},false);
    d=await logar(); }
  guarda.por("token",d.access_token); guarda.por("refresh",d.refresh_token);
  await api("/rest/v1/rpc/vincular_rota",{method:"POST",body:JSON.stringify({p_codigo:rota})});
}
function traduz(m){ const s=String(m).toLowerCase();
  if(s.includes("invalid login")||s.includes("credentials")) return "Rota ou senha não conferem.";
  if(s.includes("não existe")||s.includes("nao existe")) return "Essa rota não existe. Confira o código com seu líder.";
  if(s.includes("vinculada")) return "Esta rota já está em outro aparelho. Seu líder precisa liberar.";
  if(s.includes("vinculado")) return "Sua rota está sem repositor cadastrado. Fale com seu líder.";
  if(s.includes("failed to fetch")) return "Sem conexão com o sistema agora.";
  if(s.includes("nada para mandar")) return "Não há nada para mandar neste cartão. Registre na visita primeiro.";
  if(s.includes("nao participa")) return "Você não participa desta conversa.";
  if(s.includes("already registered")) return "Rota já cadastrada. Confira a senha.";
  return m; }

async function hash(t){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join(""); }
function telaPin(modo){ montar(()=>{ TELA="pin"; esconderTudo();
  let buf="",primeiro=null; const criar=modo==="criar";
  $("topo").innerHTML=`<h1 style="padding-left:14px">${criar?"Criar seu código":"Seu código"}</h1>`;
  const desenhar=av=>{
    $("corpo").innerHTML=`<p style="text-align:center;color:var(--ink2);font-size:15px;margin:10px 0 0">
      ${criar?(primeiro?"Digite de novo para confirmar":"Escolha 4 números. Só você usa este aparelho."):"Digite seu código de 4 números"}</p>
      <div class="bolas">${[0,1,2,3].map(i=>`<div class="bola ${i<buf.length?"on":""}"></div>`).join("")}</div>
      ${av?`<div class="aviso err">${esc(av)}</div>`:""}
      <div class="pin">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}
      <button data-a="sair">Sair</button><button data-n="0">0</button><button data-a="apagar">\u2190</button></div>`;
    $("corpo").querySelectorAll("button").forEach(b=>b.onclick=()=>toque(b.dataset)); };
  const toque=async d=>{
    if(d.a==="apagar"){ buf=buf.slice(0,-1); return desenhar(); }
    if(d.a==="sair"){ ["token","refresh","pin"].forEach(guarda.tira); return telaLogin(); }
    if(buf.length>=4) return; buf+=d.n; desenhar();
    if(buf.length<4) return;
    const h=await hash(buf);
    if(criar){ if(!primeiro){ primeiro=h; buf=""; return desenhar(); }
      if(primeiro!==h){ primeiro=null; buf=""; return desenhar("Os códigos não bateram. Comece de novo."); }
      guarda.por("pin",h); return carregarDia(hojeIso()); }
    if(h===guarda.ler("pin")) return carregarDia(hojeIso());
    buf=""; desenhar("Código errado."); };
  rodape(null); desenhar();
});}

/* --------------------------- o dia --------------------------- */
async function carregarDia(data,forcar){
  DATA=data||hojeIso();
  const cache=guarda.lerJ("dia:"+DATA);
  if(cache&&!forcar){ DIA=cache; telaVisitas(); escoar(); buscarNaoLidas(); return; }
  esconderTudo(); $("topo").innerHTML=`<h1 style="padding-left:14px">Carregando…</h1>`;
  $("corpo").innerHTML=`<div class="vazio">Buscando seu roteiro…</div>`; rodape(null);
  try{ DIA=await api("/rest/v1/rpc/meu_dia",{method:"POST",body:JSON.stringify({p_data:DATA})});
    guarda.porJ("dia:"+DATA,DIA); guarda.por("sinc",new Date().toISOString()); telaVisitas(); escoar(); buscarNaoLidas();
  }catch(e){ if(cache){ DIA=cache; telaVisitas(); alerta("Sem sinal. Mostrando o que estava guardado."); return; }
    if(e.status===401) return telaLogin();
    $("topo").innerHTML=`<h1 style="padding-left:14px">Erro</h1>`;
    $("corpo").innerHTML=`<div class="aviso err">${esc(traduz(e.message))}</div>`;
    rodape(`<button class="bt" onclick="carregarDia(DATA,true)">Tentar de novo</button>`); }
}

/* proximos dias uteis a partir de segunda desta semana */
function faixaDias(){
  const hoje=new Date(hojeIso()+"T12:00:00"), lista=[];
  for(let i=-1;i<=5;i++){ const d=new Date(hoje); d.setDate(d.getDate()+i);
    if(d.getDay()===0) continue;
    lista.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`); }
  return lista.slice(0,7);
}
function pintaDias(){
  const rot=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const dias=faixaDias();
  const feitas=DIA.lojas.filter(l=>l.visita&&l.visita.hora_fim).length;
  const pend=DIA.lojas.length-feitas;
  $("dias").className="dias";
  $("dias").innerHTML=`<div class="tira">${dias.map(d=>{
    const dt=new Date(d+"T12:00:00"), eh=d===hojeIso(), sel=d===DATA;
    const c=guarda.lerJ("dia:"+d);
    const n=c?c.lojas.length:null;
    return `<button class="dia ${sel?"sel":""} ${eh?"hoje":""}" data-d="${d}">
      <div class="rot">${rot[dt.getDay()]}</div>
      <div class="num">${dt.getDate()}</div>
      ${n===null?"":`<span class="badge ${n?"":"zero"}">${n}</span>`}</button>`; }).join("")}</div>
    <div class="resumo-dia">${pend?`<span class="pt"></span>${pend} ${pend===1?"pendente":"pendentes"} · `:""}${
      DATA===hojeIso()?`hoje é ${rot[new Date(DATA+"T12:00:00").getDay()]} ${dataBr(DATA).slice(0,5)}`
      :`vendo ${dataBr(DATA).slice(0,5)}`}</div>`;
  $("dias").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>carregarDia(b.dataset.d));
}
function pintaBarra(){
  $("barra").className="barra";
  $("barra").innerHTML=`<div class="busca">${IC.lupa}<input id="q" placeholder="Buscar visitas" value="${esc(FILTRO)}"></div>
    <button class="quad" id="bfil">${IC.filtro}</button>
    <button class="quad on" id="blista">${IC.lista}</button>
    <button class="quad" id="bmapa">${IC.mapa}</button>`;
  $("q").oninput=e=>{ FILTRO=e.target.value; pintaLojas(); };
  $("bfil").onclick=()=>{ FILTRO=FILTRO?"":""; alerta("Use a busca para filtrar por nome ou bairro."); };
  $("bmapa").onclick=()=>{ const l=lojasFiltradas()[0];
    if(!l||l.gps_lat==null) return alerta("Sem coordenada para abrir o mapa.");
    open(`https://www.google.com/maps/search/?api=1&query=${l.gps_lat},${l.gps_lon}`,"_blank"); };
}
function lojasFiltradas(){
  const f=FILTRO.trim().toLowerCase();
  const ls=(DIA.lojas||[]);
  if(!f) return ls;
  return ls.filter(l=>String(l.nome).toLowerCase().includes(f)||String(l.bairro||"").toLowerCase().includes(f));
}
function prioridade(l){
  const atras=(l.notas||[]).some(n=>n.dias>0);
  const venc=(l.validades||[]).some(v=>diasAte(v.vence_em)<0);
  return atras||venc?"Alta":"Normal";
}
function modulosFeitos(l){
  const lim=DIA.dias_alerta_validade||30, cat=l.catalogo||[];
  let n=0;
  if(cat.length&&cat.filter(x=>x.contagem&&(x.contagem.gondola!=null||x.contagem.deposito!=null||x.contagem.ruptura)).length===cat.length) n++;
  if((l.validades||[]).length) n++;
  if((l.notas||[]).length&&(l.notas||[]).every(x=>x.conferido)) n++;
  if((l.exposicoes||[]).length) n++;
  if(cat.some(x=>x.contagem&&x.contagem.preco!=null)) n++;
  if((l.materiais||[]).length) n++;
  return n;
}

        <div class="pe">

          <div class="progresso"><div class="trilho"><i style="width:${Math.round(k/6*100)}%"></i></div>

        </div></div></div>`; }).join("")
    : `<div class="vazio">${FILTRO?"Nenhuma loja com esse nome.":"Nenhuma loja no roteiro deste dia."}</div>`;
  $("corpo").querySelectorAll(".loja").forEach(c=>{
    const l=DIA.lojas[+c.dataset.i];
    c.querySelector(".dentro").onclick=e=>{ if(e.target.closest("[data-a]")) return; telaLoja(l); };
    c.querySelectorAll("[data-a]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation();

}

/* ---------------------- entrada da loja ---------------------- */
const MODULOS=[
  {k:"contagem", ic:"1", nome:"Contagem e ruptura",      tela:()=>telaContagem()},
  {k:"validade", ic:"2", nome:"Validade",                tela:()=>telaValidade()},
  {k:"chegadas", ic:"3", nome:"Chegadas",                tela:()=>telaChegadas()},
  {k:"exposicao",ic:"4", nome:"Exposição e ponto extra", tela:()=>telaExposicao()},
  {k:"preco",    ic:"5", nome:"Preço e concorrência",    tela:()=>telaPreco()},
  {k:"pdv",      ic:"6", nome:"Materiais e geladeira",   tela:()=>telaPdv()},
  {k:"conversa", ic:"7", nome:"Conversa",                tela:()=>telaConversa()}
];
let NAOLIDAS={};   // loja_id -> {nao_lidas, consultor_nao_viu, ...}
function resumo(k){
  const l=LOJA, cat=l.catalogo||[], lim=DIA.dias_alerta_validade||30;
  if(k==="contagem"){ const c=cat.filter(x=>x.contagem&&(x.contagem.gondola!=null||x.contagem.deposito!=null||x.contagem.ruptura)).length;
    const r=cat.filter(x=>x.contagem&&x.contagem.ruptura).length;
    return {txt:`${c} de ${cat.length} itens${r?` · ${r} em ruptura`:""}`, pronto:cat.length>0&&c===cat.length, alerta:r>0}; }
  if(k==="validade"){ const v=l.validades||[], crit=v.filter(x=>diasAte(x.vence_em)<=lim).length;
    return {txt:v.length?`${v.length} ${v.length===1?"registro":"registros"}${crit?` · ${crit} em alerta`:""}`:"nada registrado",
      pronto:v.length>0&&crit===0, alerta:crit>0}; }
  if(k==="chegadas"){ const n=l.notas||[], falta=n.filter(x=>!x.conferido).length;
    return {txt:n.length?`${n.length-falta} de ${n.length} conferidas`:"nenhuma nota prevista",
      pronto:n.length>0&&falta===0, alerta:n.some(x=>x.dias>0&&!x.conferido)}; }
  if(k==="exposicao"){ const e=l.exposicoes||[], ruim=e.filter(x=>x.situacao==="ausente").length;
    return {txt:e.length?`${e.length} ${e.length===1?"ponto":"pontos"}${ruim?` · ${ruim} ausente`:""}`:"nada registrado",
      pronto:e.length>0&&ruim===0, alerta:ruim>0}; }
  if(k==="preco"){ const pr=cat.filter(x=>x.contagem&&x.contagem.preco!=null).length, cc=(l.concorrentes||[]).length;
    return {txt:`${pr} ${pr===1?"preço":"preços"}${cc?` · ${cc} concorrente`:""}`, pronto:pr>0, alerta:false}; }
  if(k==="pdv"){ const m=l.materiais||[], ruim=m.filter(x=>x.situacao!=="ok").length;
    return {txt:m.length?`${m.length} ${m.length===1?"item":"itens"}${ruim?` · ${ruim} com problema`:""}`:"nada registrado",
      pronto:m.length>0&&ruim===0, alerta:ruim>0}; }
  if(k==="conversa"){ const n=naoLidas(l.id), v=semVer(l.id);
    const partes=[];
    if(n) partes.push(`${n} ${n===1?"mensagem nova":"mensagens novas"}`);
    if(v) partes.push(`${v} sem o consultor ver`);
    return {txt:partes.join(" · ")||"falar com o líder ou o consultor",
      pronto:false, alerta:n>0||v>0, badge:n||null}; }
  return {txt:"",pronto:false,alerta:false};
}
function telaLoja(l){ montar(()=>{ TELA="loja"; if(l) LOJA=l; esconderTudo();

      ${LOJA.consultor?`<div style="font-size:13.5px;color:var(--ink3);margin-top:6px">Consultor: ${esc(LOJA.consultor)}${LOJA.consultor_tel?` · ${esc(LOJA.consultor_tel)}`:""}</div>`:""}</div>
    ${!editavel()?`<div class="aviso amb">Você está vendo ${dataBr(DATA)}. Só dá para registrar no dia de hoje.</div>`

    <h2 class="tit">O QUE FAZER AQUI</h2>

        ${r.badge?`<span class="sino">${r.badge}</span>`:""}
        <span class="ic">${r.pronto?"\u2713":m.ic}</span>

  $("corpo").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>MODULOS[+b.dataset.m].tela());
  rodape(!editavel()?null
    :fim?`<button class="bt sec" disabled>Concluída às ${esc(String(v.hora_fim).slice(0,5))}</button>`
    :v?`<button class="bt" id="fim">Encerrar visita</button>`

  if($("ini")) $("ini").onclick=iniciarVisita;
  if($("fim")) $("fim").onclick=encerrarVisita;

/* -------------------- 1. contagem e ruptura ------------------ */
const MOTIVOS=[["sem_pedido","Não pediu"],["pedido_nao_chegou","Pedido não chegou"],
  ["sem_espaco","Sem espaço"],["concorrente_ocupou","Concorrente ocupou"],
  ["deposito_cheio","Tem no depósito"],["outro","Outro"]];
/* contagem NAO leva pessoa_id: quem guarda a pessoa e a visita, e a contagem
   aponta para ela. Cada tabela tem os campos dela, nao um bloco generico. */
function enviaContagem(p){ const c=p.contagem||{};
  grava("contagem","visita_id,produto_id",{
    visita_id:LOJA.visita?LOJA.visita.id:null, loja_id:LOJA.id,
    produto_id:p.produto_id, data:DIA.data,
    estoque_gondola:c.gondola==null?null:c.gondola,
    estoque_deposito:c.deposito==null?null:c.deposito,
    ruptura:!!c.ruptura, ruptura_motivo:c.ruptura?(c.motivo||null):null,
    preco:c.preco==null?null:c.preco, preco_promocional:c.promo==null?null:c.promo}); }

function telaContagem(){ montar(()=>{ TELA="mod"; esconderTudo(); const cat=LOJA.catalogo||[];
  topo("Contagem", ()=>telaLoja(), "");
  $("corpo").innerHTML=`<div class="busca" style="margin-bottom:12px">${IC.lupa}
    <input id="q" placeholder="Buscar produto" autocapitalize="off"></div><div id="lista"></div>`;
  const pinta=f=>{
    const vis=cat.map((p,i)=>({p,i})).filter(o=>!f||o.p.nome.toLowerCase().includes(f.toLowerCase()));
    $("lista").innerHTML=vis.length?vis.map(o=>{ const p=o.p,c=p.contagem||{};
      return `<div class="item"><div class="nome">${esc(p.nome)}</div><div class="emb">${esc(p.embalagem||"")}</div>
        <div class="nums" data-p="${o.i}">
          <div><label>Gôndola</label><input type="number" inputmode="numeric" min="0" data-c="gondola" value="${c.gondola==null?"":c.gondola}"></div>
          <div><label>Depósito</label><input type="number" inputmode="numeric" min="0" data-c="deposito" value="${c.deposito==null?"":c.deposito}"></div></div>
        <div class="pilha" data-r="${o.i}"><button class="${c.ruptura?"on mau":""}" data-t="rup">Ruptura</button></div>
        <div class="pilha ${c.ruptura?"":"oculto"}" data-mo="${o.i}">
          ${MOTIVOS.map(m=>`<button class="${c.motivo===m[0]?"on meio":""}" data-v="${m[0]}">${m[1]}</button>`).join("")}
        </div></div>`; }).join(""):`<div class="vazio">Nenhum produto com esse nome.</div>`;
    ligar(); };
  const ligar=()=>{
    $("lista").querySelectorAll("[data-p]").forEach(g=>{ const p=cat[+g.dataset.p];
      g.querySelectorAll("input").forEach(inp=>inp.onchange=()=>{ if(!exigeVisita()){ inp.value=""; return; }
        p.contagem=p.contagem||{}; p.contagem[inp.dataset.c]=inp.value===""?null:Number(inp.value);
        enviaContagem(p); }); });
    $("lista").querySelectorAll("[data-r]").forEach(g=>{ const i=+g.dataset.r, p=cat[i];
      g.querySelector("[data-t=rup]").onclick=e=>{ if(!exigeVisita()) return;
        p.contagem=p.contagem||{}; p.contagem.ruptura=!p.contagem.ruptura;
        e.target.classList.toggle("on",p.contagem.ruptura); e.target.classList.toggle("mau",p.contagem.ruptura);
        const mo=$("lista").querySelector('[data-mo="'+i+'"]'); if(mo) mo.classList.toggle("oculto",!p.contagem.ruptura);
        if(!p.contagem.ruptura) p.contagem.motivo=null; enviaContagem(p); }; });
    $("lista").querySelectorAll("[data-mo]").forEach(g=>{ const p=cat[+g.dataset.mo];
      g.querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(!exigeVisita()) return;
        p.contagem=p.contagem||{}; p.contagem.motivo=b.dataset.v;
        g.querySelectorAll("button").forEach(x=>x.classList.remove("on","meio"));
        b.classList.add("on","meio"); enviaContagem(p); }); }); };
  $("q").oninput=e=>pinta(e.target.value); pinta("");
  const rup=cat.filter(x=>x.contagem&&x.contagem.ruptura).length;
  rodape(`<button class="bt sec" onclick="telaLoja()">Voltar</button>`+(rup?botaoAvisar("ruptura"):""));
  ligaAvisar();
});}

/* --------------------------- 7. conversa ---------------------
   A conversa e presa a LOJA, nao a pessoa. Daqui a tres meses quem
   abrir esta loja encontra o que foi combinado aqui.

   Dois canais: interno (repositor e lider) e consultor. Separados de
   proposito, porque no interno se fala do consultor.

   Sem fila offline: mensagem so vale se chegou. Guardar para mandar
   depois faria o repositor achar que avisou quando nao avisou. Sem
   sinal, o botao diz isso na cara. */
let CANAL=null, CANAL_TIPO="interno", RELOGIO=null, CONVITE=null, CONVITE_ERRO=null, PAPEL="consultor";

function telaConversa(){ montar(()=>{ TELA="mod"; esconderTudo();
  topo("Conversa", ()=>{ pararRelogio(); telaLoja(); }, "");
  $("corpo").innerHTML=`
    <div class="abas">
      <button class="${CANAL_TIPO==="interno"?"on":""}" data-t="interno">Meu líder</button>
      <button class="${CANAL_TIPO==="consultor"?"on":""}" data-t="consultor">Comercial</button>
    </div><div id="fio"><div class="vazio">Abrindo…</div></div>`;
  $("corpo").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    CANAL_TIPO=b.dataset.t; telaConversa(); });
  rodape(`<div class="escrever">
    <button class="anexar" id="anx" aria-label="Anexar dados">${IC.mais}</button>
    <textarea id="txt" rows="1" placeholder="Escreva para ${CANAL_TIPO==="interno"?"seu líder":"o consultor"}"></textarea>
    <button class="env" id="env" aria-label="Enviar">${IC.env}</button></div>`);
  $("anx").onclick=telaAnexar;
  $("txt").addEventListener("input",e=>{ e.target.style.height="auto";
    e.target.style.height=Math.min(e.target.scrollHeight,110)+"px"; });
  $("env").onclick=enviarMensagem;
  abrirCanal();
});}

function pararRelogio(){ if(RELOGIO){ clearInterval(RELOGIO); RELOGIO=null; } }

async function abrirCanal(){
  try{
    CANAL=await api("/rest/v1/rpc/abrir_canal",{method:"POST",
      body:JSON.stringify({p_loja:LOJA.id, p_tipo:CANAL_TIPO})});
    pintaFio();
    await api("/rest/v1/rpc/marcar_lido",{method:"POST",body:JSON.stringify({p_canal:CANAL.canal_id})});
    if(NAOLIDAS[LOJA.id]) NAOLIDAS[LOJA.id].nao_lidas=0;
    /* O link do consultor e preparado AGORA, nao na hora do toque. O
       navegador so deixa abrir o WhatsApp como resposta direta a um toque;
       se houver espera de rede no meio, ele bloqueia em silencio. */
    if(CANAL_TIPO==="consultor") prepararConvite(PAPEL);
    pararRelogio();
    /* 15 segundos enquanto a tela esta aberta. Conexao aberta seria mais
       elegante e nao aguenta 233 aparelhos ao mesmo tempo; assim escala
       sem mudar nada depois. */
    RELOGIO=setInterval(()=>{ if(!document.hidden && TELA==="mod" && $("fio")) atualizarFio(); },15000);
  }catch(e){
    if($("fio")) $("fio").innerHTML=`<div class="aviso err">${esc(traduz(e.message))}</div>`;
  }
}
async function atualizarFio(){
  try{ CANAL=await api("/rest/v1/rpc/abrir_canal",{method:"POST",
      body:JSON.stringify({p_loja:LOJA.id, p_tipo:CANAL_TIPO})}); pintaFio(); }catch(e){}
}

/* Um desenhador so para todos os tipos: o servidor entrega sempre o mesmo
   formato, com titulo e uma lista de linhas. */
function desenhaCartao(c){
  if(!c) return "";
  const rotulo={ruptura:"Ruptura",validade:"Validade",preco:"Preço",
                geladeira:"Materiais",estoque:"Estoque"}[c.tipo]||c.tipo;
  const cor=c.tipo==="ruptura"?"rup":c.tipo==="validade"?"val":"";
  return `<div class="cartao-msg">
    <div class="cab ${cor}">${rotulo} · ${esc(c.titulo)}</div>
    <ul>${(c.linhas||[]).map(l=>`<li><b>${esc(l.n)}</b><span>${esc(l.d)}</span></li>`).join("")}</ul>
    <div class="pe">${esc(c.loja||"")} · ${dataBr(c.data)} · por ${esc(String(c.autor||"").split(" ")[0])}</div>
  </div>`;
}
const horaDe=d=>new Date(d).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const diaDe=d=>new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});

function pintaFio(){
  const el=$("fio"); if(!el) return;
  const ms=(CANAL&&CANAL.mensagens)||[];
  const conv=CANAL&&CANAL.convite;
  const quem=(CANAL&&CANAL.quem)||[];
  const rot={consultor:"Consultor",supervisor:"Supervisor",gerencia:"Gerência"};
  const cabeca = CANAL_TIPO!=="consultor" ? ""
    : !/^https?:$/.test(location.protocol)
      ? `<div class="aviso err">Este app está aberto como arquivo, não por um endereço da internet.
         A conversa com o comercial só funciona com o app publicado.</div>`
      : (semVer(LOJA.id)
          ? `<div class="aviso err"><b>Ninguém do comercial viu ${semVer(LOJA.id)} ${semVer(LOJA.id)===1?"mensagem":"mensagens"}.</b><br>
             Mande o link de novo para quem precisa ver.</div>` : "")
        + `<div class="aviso inf" style="padding-bottom:6px">
             <b>Quem pode entrar nesta conversa</b>
             ${quem.map(q=>`<div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">
               <span style="flex:1;min-width:130px;font-size:13px">
                 <b>${rot[q.papel]}</b><br>${esc(q.nome||"— não cadastrado")}
                 ${q.ultimo_uso?`<br><span style="color:var(--verde)">abriu em ${diaDe(q.ultimo_uso)}</span>`
                   :q.convidado?`<br><span style="color:var(--amb)">tem o link, não abriu</span>`:""}
               </span>
               ${q.nome?`<button class="pap" data-p="${q.papel}"
                 style="padding:8px 12px;font-size:12.5px;border:1px solid var(--linha);
                 border-radius:9px;background:var(--papel);color:var(--ink)">
                 ${q.convidado?"Reenviar":"Chamar"}</button>`:""}
             </div>`).join("")}
             ${CONVITE_ERRO?`<div style="color:var(--verm);margin-top:8px;font-size:13px">${esc(CONVITE_ERRO)}</div>`:""}
             ${CONVITE?`<div class="pilha"><button id="bwa">Mandar link de ${rot[PAPEL]} no WhatsApp</button>
               <button id="bcopia">Copiar link</button></div>`:""}
           </div>`;
  el.innerHTML = cabeca + (ms.length ? (()=>{ let ult="";
      return ms.map(m=>{ const d=diaDe(m.criado_em);
        const sep=d!==ult?`<div class="diamsg">${d===diaDe(new Date())?"Hoje":d}</div>`:""; ult=d;
        return sep+`<div class="msg ${m.eu?"minha":""}">
          <div class="quem">${esc(m.eu?"Você":(m.autor||"—"))}</div>
          ${m.texto?`<div class="txt">${esc(m.texto)}</div>`:""}
          ${desenhaCartao(m.cartao)}
          ${m.anexo_url?`<div class="anexo">foto anexada</div>`:""}
          <div class="h">${horaDe(m.criado_em)}</div></div>`; }).join(""); })()
    : `<div class="vazio">${CANAL_TIPO==="interno"
        ?"Nada falado sobre esta loja ainda."
        :"Nenhuma conversa com o consultor desta loja."}</div>`);
  $("fio").querySelectorAll(".pap").forEach(b=>b.onclick=()=>prepararConvite(b.dataset.p));
  if($("bwa")) $("bwa").onclick=chamarConsultor;
  if($("bcopia")) $("bcopia").onclick=copiarLink;
  const c=document.querySelector(".corpo"); if(c) c.scrollTop=c.scrollHeight;
}

/* O que o repositor pode anexar. O numero de cada um vem do que ele
   registrou hoje, entao ele ve antes de mandar se ha conteudo. */
const CARTOES=[
  {k:"ruptura",  t:"Ruptura",   d:"itens faltando na gôndola"},
  {k:"validade", t:"Validade",  d:"produtos perto de vencer"},
  {k:"estoque",  t:"Estoque",   d:"o que foi contado hoje"},
  {k:"preco",    t:"Preço",     d:"preços e concorrência"},
  {k:"geladeira",t:"Materiais", d:"geladeira e PDV com problema"}
];
function quantos(k){
  const l=LOJA, cat=l.catalogo||[], lim=DIA.dias_alerta_validade||30;
  if(k==="ruptura")  return cat.filter(x=>x.contagem&&x.contagem.ruptura).length;
  if(k==="validade") return (l.validades||[]).filter(v=>diasAte(v.vence_em)<=lim).length;
  if(k==="estoque")  return cat.filter(x=>x.contagem&&(x.contagem.gondola!=null||x.contagem.deposito!=null)).length;
  if(k==="preco")    return cat.filter(x=>x.contagem&&x.contagem.preco!=null).length+(l.concorrentes||[]).length;
  if(k==="geladeira")return (l.materiais||[]).filter(m=>m.situacao&&m.situacao!=="ok").length;
  return 0;
}
function telaAnexar(){ montar(()=>{ TELA="mod"; esconderTudo();
  topo("Anexar dados", telaConversa, "");
  $("corpo").innerHTML=`<div class="aviso inf">O cartão leva os números que você registrou hoje nesta loja.</div>`+
    CARTOES.map((c,i)=>{ const n=quantos(c.k);
      return `<button class="mod" data-c="${i}" ${n?"":"disabled style=opacity:.45"}>
        <span class="ic">${n}</span>
        <span class="txt"><b>${c.t}</b><span>${n?c.d:"nada registrado hoje"}</span></span>
        <span style="color:var(--ink3);font-size:22px">\u203a</span></button>`; }).join("");
  $("corpo").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>mandarCartao(CARTOES[+b.dataset.c].k));
  rodape(null);
});}

/* Atalho de avisar dentro do modulo. O momento de avisar e quando ele acabou
   de registrar, nao depois de navegar ate a conversa. */
function botaoAvisar(tipo){
  return `<button class="bt" id="avisar" data-t="${tipo}">Avisar sobre isto</button>`;
}
function ligaAvisar(){
  const b=$("avisar"); if(!b) return;
  b.onclick=()=>{
    const tipo=b.dataset.t;
    if(!quantos(tipo)) return alerta("Registre alguma coisa antes de avisar.");
    $("corpo").scrollTop=0;
    const cx=document.createElement("div");
    cx.className="aviso inf";
    cx.innerHTML=`Avisar quem?<div class="pilha">
      <button data-p="interno">Meu líder</button>
      <button data-p="consultor">Consultor</button>
      <button data-p="x">Cancelar</button></div>`;
    $("corpo").prepend(cx);
    cx.querySelectorAll("button").forEach(x=>x.onclick=async()=>{
      const p=x.dataset.p; cx.remove();
      if(p==="x") return;
      CANAL_TIPO=p;
      try{
        const c=await api("/rest/v1/rpc/abrir_canal",{method:"POST",
          body:JSON.stringify({p_loja:LOJA.id, p_tipo:p})});
        await api("/rest/v1/rpc/mandar_cartao",{method:"POST",
          body:JSON.stringify({p_canal:c.canal_id, p_tipo:tipo})});
        CANAL=c; telaConversa();
      }catch(e){ alerta(traduz(e.message)); }
    });
  };
}

async function mandarCartao(tipo){
  if(!navigator.onLine) return alerta("Sem sinal. Cartão não é fila: mande quando voltar.");
  if(!CANAL) return alerta("Abra a conversa primeiro.");
  try{
    await api("/rest/v1/rpc/mandar_cartao",{method:"POST",
      body:JSON.stringify({p_canal:CANAL.canal_id, p_tipo:tipo})});
    telaConversa();
  }catch(e){ alerta(traduz(e.message)); }
}

async function enviarMensagem(){
  const t=$("txt").value.trim(); if(!t||!CANAL) return;
  if(!navigator.onLine) return alerta("Sem sinal. Mensagem não é fila: mande quando voltar.");
  const b=$("env"); b.disabled=true;
  try{
    await api("/rest/v1/mensagem",{method:"POST",
      headers:{"Prefer":"return=minimal"},
      body:JSON.stringify({id:uid(), canal_id:CANAL.canal_id, autor_id:DIA.pessoa.id, texto:t})});
    $("txt").value=""; $("txt").style.height="auto";
    await atualizarFio();
  }catch(e){ alerta(traduz(e.message)); }
  finally{ b.disabled=false; }
}

async function prepararConvite(papel){
  PAPEL=papel||"consultor"; CONVITE=null; CONVITE_ERRO=null; pintaFio();
  try{
    CONVITE=await api("/rest/v1/rpc/convidar_comercial",{method:"POST",
      body:JSON.stringify({p_loja:LOJA.id, p_papel:PAPEL,
        p_base_url:location.href.replace(/[^/]*$/,"")})});
  }catch(e){ CONVITE_ERRO=traduz(e.message); }
  pintaFio();
}

/* Abre o WhatsApp do consultor com o texto e o link prontos. Sem espera de
   rede aqui dentro: tem que ser resposta direta ao toque, senao o navegador
   bloqueia a janela em silencio. */
function chamarConsultor(){
  if(!CONVITE) return alerta(CONVITE_ERRO||"O link ainda está sendo preparado. Tente em instantes.");
  const tel=String(CONVITE.telefone||"").replace(/\D/g,"");
  const msg=encodeURIComponent(CONVITE.texto+CONVITE.link);
  open(tel?`https://wa.me/55${tel.slice(-11)}?text=${msg}`:`https://wa.me/?text=${msg}`,"_blank");
}
function copiarLink(){
  if(!CONVITE) return alerta(CONVITE_ERRO||"O link ainda está sendo preparado.");
  const t=CONVITE.texto+CONVITE.link;
  if(navigator.clipboard) navigator.clipboard.writeText(t)
    .then(()=>alerta("Link copiado. Cole onde quiser.")).catch(()=>alerta(CONVITE.link));
  else alerta(CONVITE.link);
}

/* --------------------------- visita -------------------------- */
function posicao(){ return new Promise(res=>{
  if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(
    p=>res({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}),
    ()=>res(null),{enableHighAccuracy:true,timeout:8000,maximumAge:0}); }); }
async function iniciarVisita(){
  const b=$("ini"); if(b){ b.disabled=true; b.textContent="Localizando…"; }
  const g=await posicao();
  const v={id:uid(), pessoa_id:DIA.pessoa.id, rota_id:DIA.rota?DIA.rota.id:null, loja_id:LOJA.id,
    data:DIA.data, hora_inicio:agora(), situacao:"em_andamento",
    gps_lat:g?g.lat:null, gps_lon:g?g.lon:null, gps_acc:g?g.acc:null};
  LOJA.visita={id:v.id,situacao:"em_andamento",hora_inicio:v.hora_inicio,hora_fim:null};
  grava("visita","pessoa_id,loja_id,data",v); telaLoja();
  if(!g) alerta("Sem GPS agora. A visita foi registrada assim mesmo.");
}
function encerrarVisita(){
  const cat=LOJA.catalogo||[];
  const c=cat.filter(p=>p.contagem&&(p.contagem.gondola!=null||p.contagem.deposito!=null||p.contagem.ruptura)).length;
  if(c<cat.length&&!confirm(`Você contou ${c} de ${cat.length} itens. Encerrar assim mesmo?`)) return;
  LOJA.visita.hora_fim=agora(); LOJA.visita.situacao="concluida";
  grava("visita","pessoa_id,loja_id,data",{id:LOJA.visita.id, pessoa_id:DIA.pessoa.id,
    rota_id:DIA.rota?DIA.rota.id:null, loja_id:LOJA.id, data:DIA.data,
    hora_inicio:LOJA.visita.hora_inicio, hora_fim:LOJA.visita.hora_fim, situacao:"concluida"});
  telaVisitas();
}

function enderecoValido(u){ return /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(String(u||"").trim().replace(/\/+$/,"")); }

montar(()=>{ pintaFila();
  if(!URLB||!CHAVE) return telaConfig();
  /* Endereco torto trava o app com erro que nao explica nada. Melhor barrar
     aqui, com texto que diz onde esta o problema. */
  if(!enderecoValido(URLB)){
    esconderTudo();
    $("topo").innerHTML=`<h1 style="padding-left:14px">Configuração</h1>`;

      Está gravado como:<br><code style="word-break:break-all">${esc(URLB||"(vazio)")}</code><br><br>
      Deveria ser parecido com <code>https://xxxxxxxx.supabase.co</code>, sem barra no fim.
      Mostre esta tela ao seu líder.</div>`;

      ($("lim").onclick=()=>{["url","chave"].forEach(guarda.tira);URLB="";CHAVE="";telaConfig();});
  }
  if(!guarda.ler("token")) return telaLogin();
  if(guarda.ler("pin")) return telaPin("conferir");
  carregarDia(hojeIso()); });
