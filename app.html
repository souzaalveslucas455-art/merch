<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Merchandising</title>
<style>
:root{
  --verm:#E4002B; --verm-bg:#FDE7EC; --verm-esc:#B80022;
  --azul:#1E6FD9; --azul-bg:#E9F1FC;
  --ink:#1A1D21; --ink2:#6B7280; --ink3:#9CA3AF;
  --linha:#E5E7EB; --papel:#FFF; --fundo:#F2F3F5;
  --verde:#0F7A52; --verde-bg:#E6F4EE;
  --amb:#96620F; --amb-bg:#FDF2DC;
  --roxo:#6D4BC4; --roxo-bg:#F0EBFB;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sombra:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --topo:env(safe-area-inset-top,0px); --base:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior-y:contain}
body{background:var(--fundo);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---- barra de topo ---- */
.topo{flex:none;background:var(--papel);padding:calc(8px + var(--topo)) 8px 8px;
  display:flex;align-items:center;gap:4px;min-height:0;border-bottom:1px solid var(--linha)}
.avatar{flex:none;width:37px;height:37px;border-radius:50%;background:var(--verm-bg);color:var(--verm);
  border:none;font:inherit;font-weight:700;font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.icone{flex:none;width:40px;height:40px;border:none;background:none;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.icone.verm{color:var(--verm)}
.topo h1{font-size:18px;font-weight:600;margin:0;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
svg{display:block}

/* ---- menu lateral ---- */
.sombra-menu{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:40;display:none}
.sombra-menu.on{display:block}
.menu{position:fixed;left:0;right:0;bottom:0;background:var(--papel);z-index:41;
  border-radius:18px 18px 0 0;transform:translateY(102%);transition:transform .2s ease;
  padding-bottom:calc(14px + var(--base));max-height:88%;overflow-y:auto;
  box-shadow:0 -8px 30px rgba(16,24,40,.16)}
.menu.on{transform:none}
.puxador{width:40px;height:4px;border-radius:4px;background:#D7DBE0;margin:10px auto 4px}
.menu .perfil{display:flex;gap:14px;align-items:center;padding:14px 20px 16px}
.menu .bolota{width:48px;height:48px;border-radius:50%;background:var(--verm-bg);color:var(--verm);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
.menu .perfil b{display:block;font-size:16.5px;font-weight:600}
.menu .perfil span{font-size:13px;color:var(--ink2)}
.menu .sinc{margin:0 20px;width:calc(100% - 40px);background:var(--verm);color:#fff;border:none;
  border-radius:12px;padding:15px;font-size:16px;font-weight:600;display:flex;align-items:center;
  justify-content:center;gap:10px;cursor:pointer;font-family:inherit}
.menu .quando{display:flex;justify-content:space-between;padding:11px 20px 4px;font-size:13.5px;color:var(--ink2)}
.menu .quando b{color:var(--verm);font-weight:600}
.menu .numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:12px 20px 4px}
.menu .numeros div{background:var(--fundo);border-radius:12px;padding:11px;text-align:center}
.menu .numeros b{display:block;font-size:18px;font-weight:700}
.menu .numeros span{font-size:11.5px;color:var(--ink2)}
.menu .diag{padding:10px 20px 0;font-size:13px;color:var(--ink3)}
.menu .diag .ruim{color:var(--verm)}
.menu .sair{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 40px);
  margin:16px 20px 0;background:none;border:1px solid var(--linha);border-radius:12px;padding:14px;
  font:inherit;font-size:15px;color:var(--verm);font-weight:600;cursor:pointer}

/* ---- faixa de dias ---- */
.dias{flex:none;background:var(--papel);border-bottom:1px solid var(--linha);padding:8px 0 10px}
.dias .tira{display:flex;gap:10px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.dias .tira::-webkit-scrollbar{display:none}
.dia{flex:none;width:52px;text-align:center;background:none;border:none;cursor:pointer;font:inherit;padding:0}
.dia .rot{font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.dia .num{width:46px;height:46px;border-radius:50%;background:#EFF1F3;color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;margin:0 auto}
.dia.hoje .rot{font-weight:600;color:var(--ink)}
.dia.sel .num{background:var(--azul);color:#fff}
.dia .badge{display:inline-block;margin-top:4px;background:var(--verm);color:#fff;font-size:11px;
  font-weight:600;border-radius:20px;padding:1px 9px;min-width:24px}
.dia .badge.zero{background:#D7DBE0;color:#6B7280}
.resumo-dia{text-align:center;font-size:13px;color:var(--ink2);padding:9px 16px 0}
.resumo-dia .pt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--verm);
  margin-right:7px;vertical-align:1px}

/* ---- busca ---- */
.barra{flex:none;background:var(--fundo);padding:10px 14px 4px;display:flex;gap:10px}
.busca{flex:1;display:flex;align-items:center;gap:10px;background:var(--papel);border:1px solid var(--linha);
  border-radius:12px;padding:0 14px;box-shadow:var(--sombra)}
.busca input{flex:1;border:none;outline:none;padding:12px 0;font:inherit;font-size:14.5px;background:none;color:var(--ink)}
.quad{flex:none;width:48px;height:48px;background:var(--papel);border:1px solid var(--linha);border-radius:12px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);box-shadow:var(--sombra)}
.quad.on{color:var(--verm)}

.corpo{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px 26px}

/* ---- cartao de loja ---- */
.loja{background:var(--papel);border-radius:14px;box-shadow:var(--sombra);margin-bottom:12px;
  border-left:4px solid var(--azul);overflow:hidden}
.loja.feita{border-left-color:var(--verde)}
.loja.alta{border-left-color:var(--verm)}
.loja .dentro{padding:13px 15px}
.loja .cab{display:flex;gap:10px;align-items:flex-start}
.loja .titulo{flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.25}
.loja .titulo i{font-style:normal;color:var(--ink3);font-weight:600;margin-right:4px}
.selos{flex:none;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.selo{font-size:12px;font-weight:500;border-radius:8px;padding:3px 10px;white-space:nowrap}
.selo.alta{background:var(--verm-bg);color:var(--verm)}
.selo.pend{background:var(--azul-bg);color:var(--azul)}
.selo.feito{background:var(--verde-bg);color:var(--verde)}
.loja .hora{font-size:13px;color:var(--ink2);text-align:right;margin-top:6px}
.loja .end{font-size:13px;color:var(--ink2);margin-top:8px}
.loja .desc{font-size:13px;color:var(--ink2);margin-top:5px}
.loja .pe{display:flex;align-items:center;gap:12px;margin-top:12px}
.bolinha{width:42px;height:42px;border-radius:50%;background:var(--verm-bg);color:var(--verm);
  border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.bolinha:disabled{opacity:.4}
a.bolinha{text-decoration:none}
a.bolinha.sem{opacity:.35;pointer-events:none}
.ficha{padding:4px 20px 6px}
.ficha h3{margin:4px 0 2px;font-size:17px;font-weight:700}
.ficha .sub{font-size:13px;color:var(--ink2)}
.ficha .bloco{margin-top:14px;padding-top:12px;border-top:1px solid var(--linha)}
.ficha .rot{font-size:11.5px;font-weight:700;color:var(--ink3);letter-spacing:.03em;margin-bottom:4px}
.ficha .lin{display:flex;align-items:center;gap:10px;padding:5px 0}
.ficha .lin span{flex:1;font-size:14px}
.ficha .lin a{flex:none;font-size:13px;font-weight:600;color:var(--verm);text-decoration:none;
  padding:7px 12px;border:1px solid var(--linha);border-radius:9px}
.prox{background:var(--papel);border-radius:14px;box-shadow:var(--sombra);padding:13px 15px;margin-bottom:10px;
  display:flex;align-items:center;gap:12px;width:100%;border:none;font:inherit;text-align:left;cursor:pointer;color:inherit}
.prox .quando{flex:none;width:52px;text-align:center}
.prox .quando b{display:block;font-size:20px;font-weight:700}
.prox .quando span{font-size:11.5px;color:var(--ink2)}
.prox .quais{flex:1;min-width:0;font-size:13.5px;color:var(--ink2)}
.prox .quais b{color:var(--ink);font-size:14.5px}
.progresso{flex:1;display:flex;align-items:center;gap:10px}
.trilho{flex:1;height:7px;background:#EBEDF0;border-radius:10px;overflow:hidden}
.trilho i{display:block;height:100%;background:var(--verde);border-radius:10px}
.fracao{font-size:13px;color:var(--ink2);font-weight:500;flex:none}

/* ---- geral ---- */
button{font-family:inherit}
.bt{width:100%;padding:15px;font-size:16px;font-weight:600;background:var(--verm);color:#fff;
  border:none;border-radius:12px;cursor:pointer}
.bt.sec{background:var(--papel);color:var(--ink);border:1px solid var(--linha)}
.bt:disabled{opacity:.45}
.rodape{flex:none;background:var(--papel);border-top:1px solid var(--linha);
  padding:12px 14px calc(12px + var(--base));display:flex;gap:10px}
input,select{font:inherit;width:100%;padding:12px;border:1px solid var(--linha);border-radius:12px;
  background:var(--papel);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-bg)}
label{display:block;font-size:12.5px;color:var(--ink2);margin:0 0 6px}
.campo{margin-bottom:15px}
h2.tit{font-size:12px;font-weight:700;color:var(--ink2);margin:18px 0 9px;letter-spacing:.02em}
h2.tit:first-child{margin-top:2px}
.cartao{background:var(--papel);border-radius:14px;box-shadow:var(--sombra);padding:13px 15px;margin-bottom:12px}
.mod{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--papel);
  border:none;border-radius:14px;box-shadow:var(--sombra);padding:13px 15px;margin-bottom:9px;font:inherit;color:inherit;cursor:pointer}
.mod .ic{flex:none;width:36px;height:36px;border-radius:10px;background:var(--azul-bg);color:var(--azul);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.mod.alerta .ic{background:var(--verm-bg);color:var(--verm)}
.mod.pronto .ic{background:var(--verde);color:#fff}
.mod .txt{flex:1;min-width:0}
.mod .txt b{display:block;font-size:14.5px;font-weight:600}
.mod .txt span{font-size:13px;color:var(--ink2)}
.item{background:var(--papel);border-radius:14px;box-shadow:var(--sombra);padding:12px 14px;margin-bottom:10px}
.item.crit{border-left:4px solid var(--verm)}
.item.aten{border-left:4px solid var(--amb)}
.item .nome{font-size:14.5px;font-weight:600;line-height:1.3}
.item .emb{font-size:12.5px;color:var(--ink3);margin-top:2px}
.nums{display:flex;gap:9px;margin-top:11px;align-items:flex-end}
.nums>div{flex:1}.nums label{font-size:11.5px;margin-bottom:4px}
.nums input{padding:11px;text-align:center;font-size:16px;font-weight:600}
.pilha{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pilha button{flex:1 1 auto;min-width:86px;padding:10px 8px;font-size:12.5px;background:var(--papel);
  border:1px solid var(--linha);border-radius:10px;color:var(--ink2);cursor:pointer}
.pilha button.on{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:500}
.pilha button.on.mau{background:var(--verm);border-color:var(--verm)}
.pilha button.on.meio{background:var(--amb);border-color:var(--amb)}
.aviso{padding:12px 14px;border-radius:12px;font-size:13.5px;margin-bottom:12px}
.aviso.err{background:var(--verm-bg);color:var(--verm-esc)}
.aviso.inf{background:var(--azul-bg);color:var(--azul)}
.aviso.amb{background:var(--amb-bg);color:var(--amb)}
.vazio{text-align:center;color:var(--ink3);padding:38px 18px;font-size:14px}
.fila{flex:none;background:var(--amb-bg);color:var(--amb);font-size:13px;padding:8px 16px;text-align:center;display:none}
.fila.on{display:block}
.oculto{display:none!important}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:290px;margin:0 auto}
.pin button{padding:17px;font-size:21px;background:var(--papel);border:1px solid var(--linha);
  border-radius:12px;cursor:pointer;box-shadow:var(--sombra)}
.bolas{display:flex;gap:15px;justify-content:center;margin:24px 0 28px}
.bola{width:13px;height:13px;border-radius:50%;border:2px solid var(--linha)}
.bola.on{background:var(--verm);border-color:var(--verm)}
.msg{max-width:84%;margin-bottom:9px;padding:9px 12px;border-radius:14px;box-shadow:var(--sombra);
  background:var(--papel);word-wrap:break-word}
.msg.minha{margin-left:auto;background:var(--verde-bg)}
.msg .quem{font-size:11.5px;font-weight:600;color:var(--azul);margin-bottom:2px}
.msg.minha .quem{color:var(--verde)}
.msg .txt{font-size:14px;white-space:pre-wrap}
.msg .h{font-size:10.5px;color:var(--ink3);text-align:right;margin-top:3px}
.msg .anexo{font-size:12px;color:var(--ink2);background:var(--fundo);border-radius:9px;padding:7px 9px;margin-top:5px}
.diamsg{text-align:center;font-size:11.5px;color:var(--ink3);margin:12px 0 9px}
.cartao-msg{margin-top:7px;border:1px solid var(--linha);border-radius:11px;overflow:hidden;background:var(--fundo)}
.cartao-msg .cab{background:var(--azul-bg);color:var(--azul);padding:7px 11px;font-size:12.5px;font-weight:600}
.cartao-msg .cab.rup{background:var(--verm-bg);color:var(--verm)}
.cartao-msg .cab.val{background:var(--amb-bg);color:var(--amb)}
.cartao-msg ul{margin:0;padding:6px 11px 8px;list-style:none}
.cartao-msg li{font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--linha)}
.cartao-msg li:last-child{border:none}
.cartao-msg li b{font-weight:600;display:block}
.cartao-msg li span{color:var(--ink2)}
.cartao-msg .pe{font-size:11px;color:var(--ink3);padding:0 11px 8px}
.anexar{flex:none;width:42px;height:42px;border-radius:50%;background:var(--papel);
  border:1px solid var(--linha);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.escrever{display:flex;gap:8px;align-items:flex-end;width:100%}
.escrever textarea{flex:1;font:inherit;font-size:14.5px;border:1px solid var(--linha);border-radius:18px;
  padding:10px 14px;resize:none;max-height:110px;background:var(--fundo);color:var(--ink);outline:none}
.escrever textarea:focus{border-color:var(--azul);background:var(--papel)}
.escrever .env{flex:none;width:42px;height:42px;border-radius:50%;background:var(--verm);color:#fff;
  border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.escrever .env:disabled{opacity:.4}
.abas{display:flex;gap:8px;margin-bottom:12px}
.abas button{flex:1;padding:10px;font:inherit;font-size:13px;background:var(--papel);
  border:1px solid var(--linha);border-radius:10px;color:var(--ink2);cursor:pointer}
.abas button.on{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:500}
.sino{position:absolute;top:8px;right:10px;background:var(--verm);color:#fff;font-size:10.5px;
  font-weight:700;border-radius:20px;padding:1px 6px;min-width:18px;text-align:center}
.mod{position:relative}
.foto{display:flex;gap:9px;align-items:center;margin-top:10px}
.foto .bt-foto{flex:none;display:flex;align-items:center;gap:8px;background:var(--papel);
  border:1px solid var(--linha);border-radius:10px;padding:9px 13px;font:inherit;font-size:12.5px;
  color:var(--ink2);cursor:pointer}
.foto .bt-foto.tem{border-color:var(--verde);color:var(--verde);font-weight:500}
.foto img{width:46px;height:46px;object-fit:cover;border-radius:9px;border:1px solid var(--linha)}
.foto .est{font-size:12px;color:var(--ink3)}
.foto .est.env{color:var(--amb)}
#mapa{position:absolute;inset:0;z-index:1}
.mapa-caixa{position:relative;flex:1;min-height:0;height:100%}
.mapa-pe{position:absolute;left:12px;right:12px;bottom:12px;z-index:400;display:flex;gap:8px}
.mapa-pe button{flex:1;padding:13px;font-size:14px;font-weight:600;border:none;border-radius:11px;
  background:var(--verm);color:#fff;box-shadow:0 2px 10px rgba(16,24,40,.25);cursor:pointer}
.mapa-pe button.sec{background:var(--papel);color:var(--ink);border:1px solid var(--linha)}
.pino{background:var(--verm);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:700;
  box-shadow:0 1px 4px rgba(0,0,0,.4);border:2px solid #fff}
.pino.feita{background:var(--verde)}
.leaflet-container{font-family:var(--sans)}
.ped{background:var(--papel);border:1px solid #D9DDE2;border-radius:16px;box-shadow:var(--sombra);
  padding:14px 15px;margin-bottom:12px;cursor:pointer}
.ped .topo-ped{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:9px}
.ped .lin{display:flex;align-items:center;gap:9px;font-size:14.5px;margin:5px 0;color:var(--ink)}
.ped .lin.forte{font-weight:700}
.ped .lin svg{flex:none;color:var(--ink3)}
.ped .prods{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 4px}
.ped .prods span{font-size:11.5px;background:var(--fundo);border:1px solid var(--linha);border-radius:8px;
  padding:4px 8px;color:var(--ink2);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ped .num3{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:6px;margin-top:10px;align-items:end}
.ped .num3 small{display:flex;gap:5px;align-items:center;font-size:12.5px;color:var(--ink3)}
.ped .num3 b{display:block;font-size:15.5px;margin-top:2px}
.ped .compart{width:44px;height:44px;border-radius:50%;background:var(--verm-bg);color:var(--verm);
  border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.tl{background:var(--papel);border-radius:14px;box-shadow:var(--sombra);padding:13px 15px;margin-bottom:12px}
.tl .p{display:flex;gap:11px;padding:7px 0;position:relative}
.tl .p .b{flex:none;width:11px;height:11px;border-radius:50%;background:var(--linha);margin-top:4px}
.tl .p.ok .b{background:var(--verde)} .tl .p.al .b{background:var(--amb)} .tl .p.mau .b{background:var(--verm)}
.tl .p div{font-size:13.5px} .tl .p small{display:block;color:var(--ink3);font-size:12px}
.pi{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--linha)}
.pi:last-child{border:none}
.pi .n{font-size:14px;font-weight:700;line-height:1.3}
.pi .g{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:6px;margin-top:7px}
.pi .g small{display:block;font-size:12px;color:var(--ink3)} .pi .g b{font-size:14px}
.pi .un{font-size:12px;color:var(--ink2);margin-top:5px} .pi .un b{color:var(--verde)}
.sw-lin{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0}
.sw-lin span{font-size:14.5px;color:var(--ink);line-height:1.35}
.sw{position:relative;flex:none;width:50px;height:28px;cursor:pointer}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:#D7DBE0;border-radius:28px;transition:background .15s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+i{background:var(--verm)}
.sw input:checked+i:after{transform:translateX(22px)}
.sw input:focus-visible+i{outline:3px solid var(--azul-bg)}
.ativo{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:14px;margin-bottom:12px}
.ativo .cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ativo .cab b{font-size:15px}
.ativo .x{background:none;border:none;color:var(--verm);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px}
.fotobox{width:112px;height:112px;border:2px dashed #7FB8D6;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;color:#3B8FBF;font-size:13px;cursor:pointer;background:none;
  overflow:hidden;padding:0}
.fotobox img{width:100%;height:100%;object-fit:cover}
.fotobox .mais{font-size:30px;line-height:1}
.ptm{display:flex;gap:8px;margin-top:6px}
.ptm input{flex:1}
.ptm button{flex:none;background:#3B8FBF;color:#fff;border:none;border-radius:12px;padding:0 18px;
  font:inherit;font-weight:600;cursor:pointer}
.adic{width:100%;border:2px dashed #7CC4A6;border-radius:14px;background:none;color:var(--verde);
  font:inherit;font-weight:600;padding:14px;cursor:pointer;margin-bottom:14px}
.leitor{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
.leitor video{flex:1;width:100%;object-fit:cover;min-height:0}
.leitor .mira{position:absolute;left:12%;right:12%;top:38%;height:22%;border:3px solid #fff;border-radius:12px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.leitor p{position:absolute;left:0;right:0;top:64%;text-align:center;color:#fff;font-size:14px;margin:0}
.leitor button{margin:14px;padding:15px;border:none;border-radius:12px;font:inherit;font-weight:600}
/* --------- oportunidade de estoque --------- */
.st-fila{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 4px;scrollbar-width:none}
.st-fila::-webkit-scrollbar{display:none}
.st{flex:none;min-width:94px;text-align:left;background:var(--papel);border:1.5px solid var(--linha);
  border-radius:14px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink);box-shadow:var(--sombra);
  transition:transform .12s,background .12s}
.st:active{transform:scale(.97)}
.st .rot{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.st .rot i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink3))}
.st .n{display:block;font-size:24px;font-weight:700;line-height:1.1;margin-top:4px;color:var(--c,var(--ink))}
.st .cx{display:block;font-size:11px;color:var(--ink3);margin-top:1px;white-space:nowrap}
.st.on{background:var(--c,var(--ink));border-color:var(--c,var(--ink))}
.st.on .rot,.st.on .n,.st.on .cx{color:#fff}.st.on .rot i{background:#fff}
.op{background:var(--papel);border-radius:16px;box-shadow:var(--sombra);margin-bottom:12px;overflow:hidden;
  border-left:5px solid var(--c)}
.op .cab{padding:13px 14px 0;display:flex;gap:10px;align-items:flex-start}
.op .cab .nm{flex:1;min-width:0;font-size:15px;font-weight:700;line-height:1.3}
.op .cab .em{font-size:12px;color:var(--ink3);font-weight:400;margin-top:2px}
.op .tag{flex:none;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;background:var(--cb);color:var(--c)}
.op .met{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--linha);margin:11px 14px 0;
  border-radius:11px;overflow:hidden}
.op .met div{background:var(--fundo);padding:8px 9px}
.op .met small{display:block;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em}
.op .met b{display:block;font-size:14.5px;margin-top:2px}
.op .barra{margin:10px 14px 0;height:6px;border-radius:6px;background:var(--linha);position:relative}
.op .barra span{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--c)}
.op .barra em{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink2);border-radius:2px}
.op .barra-leg{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin:4px 14px 0}
.op .corpo-op{padding:6px 14px 14px}
.op .onde{font-size:12px;font-weight:600;color:var(--ink2);margin:12px 0 6px}
.op .locs{display:flex;flex-wrap:wrap;gap:7px}
.op .locs button{border:1.5px solid var(--linha);background:var(--papel);border-radius:22px;padding:8px 13px;
  font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
.op .locs button.on{border-color:var(--c);background:var(--cb);color:var(--c);font-weight:600}
.op .locs button.nt.on{border-color:var(--ink2);background:var(--fundo);color:var(--ink);}
.op .qtds{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.op .qtds label{font-size:12px;color:var(--ink2);margin:0 0 4px;display:block}
.op .tot{margin-top:9px;font-size:12.5px;color:var(--ink2)}
.op .fazer{margin:10px 14px 0;font-size:13.5px;line-height:1.4;color:var(--ink);background:var(--cb);border-radius:11px;padding:9px 11px}
.op .fazer b:first-child{color:var(--c)}
.op .pares{margin:10px 14px 0;font-size:13px;color:var(--ink2);background:var(--roxo-bg);border-radius:11px;padding:9px 11px}
.op .pares b{color:var(--roxo)}
.orig{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.02em;
  padding:5px 10px;border-radius:9px;background:var(--ob,#E7F3FB);color:var(--oc,#1672A8)}
.orig svg{flex:none}
.rv{background:var(--papel);border-radius:16px;box-shadow:var(--sombra);padding:14px 15px;margin-bottom:14px}
.rv .t{font-size:11.5px;font-weight:700;color:var(--ink3);letter-spacing:.04em}
.rv .g3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:8px}
.rv .g3 b{display:block;font-size:19px;line-height:1.15} .rv .g3 small{font-size:11.5px;color:var(--ink3)}
.rv .sit{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:20px}
.rv .canais{display:flex;height:8px;border-radius:8px;overflow:hidden;margin-top:12px;background:var(--linha)}
.rv .leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:12px;color:var(--ink2)}
.rv .leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.ped .prods img.pfoto{width:46px;height:46px;object-fit:contain;background:#fff;border:1px solid var(--linha);border-radius:9px;padding:2px}
.ped .prods .mais{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:9px;
  background:var(--fundo);border:1px solid var(--linha);color:var(--ink2);font-weight:700;font-size:14px;max-width:none;padding:0}
.pi .pifoto{flex:none;width:68px;height:68px;object-fit:contain;border-radius:11px;background:#fff;border:1px solid var(--linha);padding:3px}
.pi .semfoto{flex:none;width:68px;height:68px;border-radius:11px;background:var(--fundo);border:1px solid var(--linha);
  display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:11px;text-align:center;line-height:1.2}
.qt2{display:flex;gap:10px;margin-top:4px}
.qt2 span{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.qt2 small{font-size:12px;color:var(--ink3)}
.qt2 input.calc{color:var(--ink3);font-style:italic;background:var(--fundo)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="app">

  <div class="fila" id="fila"></div>
  <div id="dias" class="oculto"></div>
  <div id="barra" class="oculto"></div>
  <div class="corpo" id="corpo"></div>

</div>

async function api(caminho,opc={},retry=true){
  const tok=guarda.ler("token");
  const r=await fetch(URLB.replace(/\/+$/,"")+caminho,{...opc,
    headers:{"apikey":CHAVE,"Content-Type":"application/json",
      ...(tok?{"Authorization":"Bearer "+tok}:{}),...(opc.headers||{})}});
  if(r.status===401&&retry&&guarda.ler("refresh")&&await renovar()) return api(caminho,opc,false);
  const t=await r.text(); let c=null;
  try{ c=t?JSON.parse(t):null }catch(e){ c={raw:t} }
  if(!r.ok){
    /* Resposta em HTML nao veio do banco, veio de um servidor web. Quase
       sempre significa endereco errado no CFG. Despejar o HTML na tela nao
       ajuda ninguem: melhor dizer o que fazer. */
    let m=c?.message||c?.error_description||c?.msg||c?.raw||("HTTP "+r.status);
    if(/^\s*<(!doctype|html)/i.test(String(m)))
      m="O endereço do sistema parece errado. Fale com seu líder: o app está "
       +"tentando falar com o lugar errado (HTTP "+r.status+").";
    throw Object.assign(new Error(m),{status:r.status});
  }
  return c;
}

        body:JSON.stringify(it.corpo),headers:{"Prefer":"resolution=merge-duplicates,return=minimal"}});
      fila.tira(it.fid);
    }catch(e){ it.tentativas=(it.tentativas||0)+1; it.erro=e.message;
      /* Depois de 5 tentativas o item sai da frente. NAO e apagado: fica
         marcado e aparece no painel para voce decidir. Antes disso, um unico
         registro com defeito segurava tudo o que viesse depois dele. */
      if(it.tentativas>=5) it.parado=true;
      guarda.porJ("fila",fila.itens().map(x=>x.fid===it.fid?it:x));
      if(!it.parado) break; }
  }
  enviando=false; pintaFila();
  if(!fila.itens().length) guarda.por("sinc",new Date().toISOString());
}
async function pintaFila(){
  const f=fila.itens(), el=$("fila");
  let fotos=0; try{ fotos=((await cofreFoto.todas())||[]).length; }catch(e){}
  const n=f.length+fotos;
  if(!n){ el.classList.remove("on"); return; }
  const parados=f.filter(x=>x.parado).length;
  const detalhe=fotos?`${f.length} ${f.length===1?"registro":"registros"} e ${fotos} ${fotos===1?"foto":"fotos"}`
    :`${n} ${n===1?"envio pendente":"envios pendentes"}`;
  el.textContent=parados
    ? `${parados} ${parados===1?"envio parado":"envios parados"} · toque no seu nome`
    : `${detalhe}${navigator.onLine?"":" · sem sinal"}`;
  el.classList.add("on");
}
/* Envio parado (falhou 5 vezes) ganha uma nova tentativa ao abrir o app e
   quando a internet volta: muitas vezes a causa foi do lado do banco (um
   arquivo SQL ainda nao rodado) e ja foi resolvida. Se falhar de novo, para. */
function reanimarParados(){ const f=fila.itens(); let mudou=false;
  f.forEach(x=>{ if(x.parado){ x.parado=false; x.tentativas=Math.min(x.tentativas||0,4); mudou=true; } });
  if(mudou){ guarda.porJ("fila",f); pintaFila(); escoar(); } }

/* ======================= FOTOS =============================
   Foto nao cabe na fila de texto: uma so ja passa do limite do
   armazenamento do navegador. Por isso a fila de foto e separada,
   guardada em IndexedDB, que aguenta arquivo.

   A ordem importa: sobe a imagem primeiro, e so depois manda o
   registro apontando para ela. Se mandasse junto, um envio que
   falhasse deixaria o registro com endereco de foto que nao existe.

   Comprime SEMPRE antes de enviar. Foto de celular tem 3 a 5 MB;
   depois de reduzir para 1280px e qualidade 0,65 fica em ~130 KB.
   Isso e a diferenca entre enviar em 3G de loja e nao enviar.
============================================================ */
const LARGURA_MAX=1280, QUALIDADE=0.65, IDADE_MAX_MIN=5;

const cofreFoto=(()=>{ let bd=null;
  const abrir=()=>new Promise((ok,nok)=>{ if(bd) return ok(bd);
    const r=indexedDB.open("fotos",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("f",{keyPath:"id"});
    r.onsuccess=()=>{ bd=r.result; ok(bd); }; r.onerror=()=>nok(r.error); });
  const tx=async(modo,fn)=>{ const d=await abrir();
    return new Promise((ok,nok)=>{ const t=d.transaction("f",modo), st=t.objectStore("f");
      const req=fn(st); t.oncomplete=()=>ok(req&&req.result); t.onerror=()=>nok(t.error); }); };
  return {
    poe:it=>tx("readwrite",st=>st.put(it)),
    tira:id=>tx("readwrite",st=>st.delete(id)),
    todas:()=>tx("readonly",st=>st.getAll()),
    pega:id=>tx("readonly",st=>st.get(id))
  };
})();

async function comprimir(arquivo){
  const bmp=await createImageBitmap(arquivo);
  const escala=Math.min(1, LARGURA_MAX/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");
  c.width=Math.round(bmp.width*escala); c.height=Math.round(bmp.height*escala);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  bmp.close&&bmp.close();
  return new Promise(ok=>c.toBlob(ok,"image/jpeg",QUALIDADE));
}

/* Verifica se a foto acabou de ser tirada. Sem isto, o repositor pode
   escolher da galeria uma foto de semanas atras e ninguem percebe. */
function recemTirada(arquivo){
  if(!arquivo.lastModified) return true;
  return (Date.now()-arquivo.lastModified) < IDADE_MAX_MIN*60000;
}

async function guardaFoto(arquivo, alvo){
  if(!recemTirada(arquivo)) throw new Error("Essa foto não foi tirada agora. Use a câmera.");
  const blob=await comprimir(arquivo);
  const id=uid();
  const caminho=`${LOJA.codigo}/${DIA.data}/${alvo.tabela}-${alvo.registro_id}-${id}.jpg`;
  await cofreFoto.poe({id, caminho, blob, alvo, tentativas:0});
  escoarFotos();
  return {id, caminho, url:URL.createObjectURL(blob)};
}

let enviandoFoto=false;
async function escoarFotos(){
  if(enviandoFoto||!navigator.onLine) return;
  let lista=[]; try{ lista=await cofreFoto.todas()||[]; }catch(e){ return; }
  if(!lista.length) return;
  enviandoFoto=true;
  for(const f of lista){
    try{
      const r=await fetch(URLB.replace(/\/+$/,"")+"/storage/v1/object/fotos/"+f.caminho,{
        method:"POST", headers:{"apikey":CHAVE,"Authorization":"Bearer "+guarda.ler("token"),
          "Content-Type":"image/jpeg","x-upsert":"true"}, body:f.blob});
      if(r.status===401){ if(await renovar()) continue; throw new Error("sessão expirada"); }
      if(!r.ok&&r.status!==409) throw new Error("HTTP "+r.status);
      // so agora o registro aponta para a foto. O censo e excecao: ele grava
      // tudo de uma vez no Enviar, e a foto so precisa estar no armazenamento.
      if(!f.alvo.semRegistro) fila.poe({tabela:f.alvo.tabela, chave:f.alvo.chave,
        corpo:{...f.alvo.corpo, foto_url:f.caminho}});
      await cofreFoto.tira(f.id);
      if(DIA){ // tira o "enviando..." da tela
        (DIA.lojas||[]).forEach(l=>["validades","exposicoes","materiais","concorrentes"].forEach(k=>
          (l[k]||[]).forEach(r=>{ if(r.foto_url===f.caminho) r._foto_pendente=false; })));
        salvarCache();
      }
      escoar();
    }catch(e){
      f.tentativas=(f.tentativas||0)+1; f.erro=e.message;
      await cofreFoto.poe(f); break;
    }
  }
  enviandoFoto=false; pintaFila();
}
addEventListener("online",escoarFotos); setInterval(escoarFotos,25000);

function ligaFoto(caixa, reg, alvo, depois){
  const b=caixa.querySelector("[data-foto]"), inp=caixa.querySelector('input[type=file]');
  if(!b||!inp) return;
  b.onclick=()=>{ if(!exigeVisita()) return; inp.click(); };
  inp.onchange=async()=>{
    const a=inp.files&&inp.files[0]; if(!a) return;
    b.disabled=true; b.textContent="Preparando…";
    try{
      const f=await guardaFoto(a, {...alvo, registro_id:reg.id||reg.produto_id});
      reg._foto_local=f.url; reg._foto_pendente=true; reg.foto_url=f.caminho;
      salvarCache(); depois&&depois();
    }catch(e){ alerta(e.message); b.disabled=false; b.textContent="Tirar foto"; }
  };
}

async function entrarComRota(rota,senha){
  const email=emailDaRota(rota);
  const logar=()=>api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password:senha})},false);
  let d;
  try{ d=await logar(); }
  catch(e){ if(!/invalid login|credentials/i.test(e.message)) throw e;
    await api("/auth/v1/signup",{method:"POST",body:JSON.stringify({email,password:senha})},false);
    d=await logar(); }
  guarda.por("token",d.access_token); guarda.por("refresh",d.refresh_token);
  await api("/rest/v1/rpc/vincular_rota",{method:"POST",body:JSON.stringify({p_codigo:rota})});
}
function traduz(m){ const s=String(m).toLowerCase();
  if(s.includes("invalid login")||s.includes("credentials")) return "Rota ou senha não conferem.";
  if(s.includes("não existe")||s.includes("nao existe")) return "Essa rota não existe. Confira o código com seu líder.";
  if(s.includes("vinculada")) return "Esta rota já está em outro aparelho. Seu líder precisa liberar.";
  if(s.includes("vinculado")) return "Sua rota está sem repositor cadastrado. Fale com seu líder.";
  if(s.includes("failed to fetch")) return "Sem conexão com o sistema agora.";
  if(s.includes("nada para mandar")) return "Não há nada para mandar neste cartão. Registre na visita primeiro.";
  if(s.includes("nao participa")) return "Você não participa desta conversa.";
  if(s.includes("already registered")) return "Rota já cadastrada. Confira a senha.";
  return m; }

async function hash(t){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join(""); }
function telaPin(modo){ montar(()=>{ TELA="pin"; esconderTudo();
  let buf="",primeiro=null; const criar=modo==="criar";
  $("topo").innerHTML=`<h1 style="padding-left:14px">${criar?"Criar seu código":"Seu código"}</h1>`;
  const desenhar=av=>{
    $("corpo").innerHTML=`<p style="text-align:center;color:var(--ink2);font-size:15px;margin:10px 0 0">
      ${criar?(primeiro?"Digite de novo para confirmar":"Escolha 4 números. Só você usa este aparelho."):"Digite seu código de 4 números"}</p>
      <div class="bolas">${[0,1,2,3].map(i=>`<div class="bola ${i<buf.length?"on":""}"></div>`).join("")}</div>
      ${av?`<div class="aviso err">${esc(av)}</div>`:""}
      <div class="pin">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}
      <button data-a="sair">Sair</button><button data-n="0">0</button><button data-a="apagar">\u2190</button></div>`;
    $("corpo").querySelectorAll("button").forEach(b=>b.onclick=()=>toque(b.dataset)); };
  const toque=async d=>{
    if(d.a==="apagar"){ buf=buf.slice(0,-1); return desenhar(); }
    if(d.a==="sair"){ ["token","refresh","pin"].forEach(guarda.tira); return telaLogin(); }
    if(buf.length>=4) return; buf+=d.n; desenhar();
    if(buf.length<4) return;
    const h=await hash(buf);
    if(criar){ if(!primeiro){ primeiro=h; buf=""; return desenhar(); }
      if(primeiro!==h){ primeiro=null; buf=""; return desenhar("Os códigos não bateram. Comece de novo."); }
      guarda.por("pin",h); return carregarDia(hojeIso()); }
    if(h===guarda.ler("pin")) return carregarDia(hojeIso());
    buf=""; desenhar("Código errado."); };
  rodape(null); desenhar();
});}

async function carregarDia(data,forcar){

  const cache=guarda.lerJ("dia:"+DATA);

    return;
  }
  esconderTudo(); $("topo").innerHTML=`<h1 style="padding-left:14px">Carregando…</h1>`;

    guarda.porJ("dia:"+DATA,DIA); guarda.por("sinc",new Date().toISOString()); telaVisitas(); escoar(); buscarSemana(); buscarTudoDoDia(DATA);
  }catch(e){ if(cache){ DIA=cache; telaVisitas(); alerta("Sem sinal. Mostrando o que estava guardado."); return; }
    if(e.status===401) return telaLogin();
    $("topo").innerHTML=`<h1 style="padding-left:14px">Erro</h1>`;
    $("corpo").innerHTML=`<div class="aviso err">${esc(traduz(e.message))}</div>`;

}

/* Mostra o dia guardado na hora, e por tras busca a versao do servidor.
   So troca se nao houver envio pendente: com fila cheia, o que esta na tela
   tem coisa que o servidor ainda nao sabe, e trocar faria a contagem que o
   repositor acabou de digitar sumir da tela. */
/* As oportunidades vem numa chamada propria e ficam guardadas por dia, para
   o repositor trabalhar sem sinal dentro da loja. */
async function buscarOportunidades(data){
  const guardado=guarda.lerJ("oport:"+data);
  if(guardado){ OPORT=guardado; CARREGADO.oport=data; }
  if(!navigator.onLine) return;
  try{
    const o=await api("/rest/v1/rpc/minhas_oportunidades",{method:"POST",body:JSON.stringify({p_data:data})});
    if(data!==DATA) return;
    /* Os numeros vem sempre do servidor. Com envio pendente, a CONTAGEM que o
       repositor digitou e ainda nao subiu e preservada, produto por produto. */
    const novo=o||{};
    if(guardado && pendentes()){
      for(const [lid,lj] of Object.entries(novo)){ const velho=guardado[lid]; if(!velho||!lj||!lj.itens) continue;
        const loc={}; (velho.itens||[]).forEach(x=>{ if(x.contagem) loc[x.produto_id]=x.contagem; });
        lj.itens.forEach(x=>{ if(loc[x.produto_id]&&!x.contagem) x.contagem=loc[x.produto_id]; }); }
    }
    OPORT=novo; CARREGADO.oport=data; delete ERRO_BUSCA.oport; guarda.porJ("oport:"+data,OPORT); guarda.por("oport_em:"+data,new Date().toISOString());
    if(TELA==="home") pintaLojas(); else if(TELA==="loja") telaLoja();
  }catch(e){ ERRO_BUSCA.oport=e.message; }
}
const oportDe=l=>(OPORT&&OPORT[l.id])||{total:0,itens:[],limite:15};

let PEDIDOS=null;   // loja_id -> lista de notas com produtos

/* A resposta do banco passou a ser {resumo, pedidos} por loja. O formato
   antigo, so a lista, continua lido: pode estar guardado no celular. */
const pedidosDe=l=>{ const x=PEDIDOS&&PEDIDOS[l.id]; return Array.isArray(x)?x:((x&&x.pedidos)||[]); };
const resumoVendasDe=l=>{ const x=PEDIDOS&&PEDIDOS[l.id]; return (x&&!Array.isArray(x)&&x.resumo)||null; };

/* ------------------------- regras de tarefa --------------------------
   Cada modulo tem uma regra. Vem do banco (app_meta.regras_modulos), entao
   muda sem atualizar o app. Estes sao os padroes, caso o banco nao responda.
------------------------------------------------------------------------ */
const REGRA_PADRAO={oportunidade:"toda_visita", validade:"toda_visita", chegadas:"informativo",
  exposicao:"desligado", preco:"desligado", pdv:"semanal", conversa:"desligado", demandas:"ferramenta", estoque:"semana_inicio", entrega:"ferramenta"};
const MOD_REGRA={contagem:"oportunidade", validade:"validade", chegadas:"chegadas",
  exposicao:"exposicao", preco:"preco", pdv:"pdv", conversa:"conversa", demandas:"demandas", estoque:"estoque", entrega:"entrega"};
let OBRIG=null;   // {regras, lojas:{loja_id:{semana, hoje, tarefas, ultima_visita_da_semana}}}
async function buscarObrigacoes(data){
  const guardado=guarda.lerJ("obrig:"+data);
  if(guardado) OBRIG=guardado;
  if(!navigator.onLine) return;
  try{
    const r=await api("/rest/v1/rpc/obrigacoes_do_dia",{method:"POST",body:JSON.stringify({p_data:data})});
    if(data!==DATA) return;
    /* O que foi concluido ou respondido aqui e ainda esta na fila vale mais. */
    const loc=(guardado&&guardado.lojas)||{};
    OBRIG=r||{regras:{},lojas:{}};
    for(const [id,v] of Object.entries(loc)){ const n=OBRIG.lojas[id]; if(!n) continue;
      n.hoje=Object.assign({}, n.hoje||{}, v.hoje||{});
      for(const [m,sv] of Object.entries(v.semana||{})) if(sv&&sv.feito_em&&!(n.semana[m]||{}).feito_em) n.semana[m]=sv;
      (v.tarefas||[]).forEach(tl=>{ if(!tl.resposta) return;
        const tn=(n.tarefas||[]).find(x=>x.id===tl.id); if(tn&&!tn.resposta) tn.resposta=tl.resposta; });
    }
    guarda.porJ("obrig:"+data,OBRIG);
    if(TELA==="loja") telaLoja();
  }catch(e){}
}
const obrigDe=l=>(OBRIG&&OBRIG.lojas&&OBRIG.lojas[l.id])||{semana:{},hoje:{},tarefas:[]};
const regraDe=k=>((OBRIG&&OBRIG.regras)||REGRA_PADRAO)[MOD_REGRA[k]]||REGRA_PADRAO[MOD_REGRA[k]];
const salvaObrig=()=>{ if(OBRIG) guarda.porJ("obrig:"+DATA,OBRIG); };

/* Como cada modulo esta nesta loja, hoje. */
function estadoModulo(l,k){
  const rg=regraDe(k), mod=MOD_REGRA[k], o=obrigDe(l);
  if(rg==="informativo") return {k:"info"};
  if(rg==="ferramenta")  return {k:"tool"};
  /* Contagem de estoque: obrigatoria a partir da primeira visita da semana, ate ser feita. */
  if(rg==="semana_inicio"){
    const fe=((o.semana||{})[mod]||{}).feito_em||((o.hoje||{})[mod]&&DATA);
    return fe ? {k:"feito", txt:`feito esta semana em ${dataBr(fe).slice(0,5)}`} : {k:"obrig", txt:"obrigatório: contagem da semana"};
  }
  /* Validade na entrega: obrigatoria quando ha entrega prevista hoje. */
  if(rg==="entrega"){
    const es=entregasDe(l).filter(p=>p.hoje);
    if(!es.length) return {k:"info", txt:"nenhuma entrega prevista hoje"};
    const falta=es.filter(p=>!p.conferencia).length;
    return falta ? {k:"obrig", txt:`${falta} ${falta===1?"entrega para conferir":"entregas para conferir"}`} : {k:"feito", txt:"entregas de hoje conferidas"};
  }
  if(rg==="toda_visita"){
    return (o.hoje||{})[mod] ? {k:"feito", txt:"concluído nesta visita"} : {k:"obrig", txt:"obrigatório nesta visita"};
  }
  const feitoEm=((o.semana||{})[mod]||{}).feito_em || (mod==="pdv"&&censoDe(l).feito_na_semana&&(censoDe(l).feito_em||DATA));
  if(feitoEm) return {k:"feito", txt:`feito esta semana em ${dataBr(feitoEm).slice(0,5)}`};
  if(o.ultima_visita_da_semana) return {k:"obrig", txt:"obrigatório hoje: última visita da semana"};
  return {k:"pend", txt:"pendente esta semana"};
}
const tarefasDe=(l,mod)=>(obrigDe(l).tarefas||[]).filter(t=>!mod||t.modulo===mod);
const tarefaAberta=t=>!t.resposta||t.resposta.situacao!=="feita";
const tarefaVencida=t=>tarefaAberta(t)&&!t.resposta&&t.prazo&&String(t.prazo).slice(0,10)<=DATA;

/* Concluir um modulo: grava a checagem e marca aqui na hora. */
function concluirModulo(k, resultado){
  const mod=MOD_REGRA[k];
  grava("checagem_modulo","visita_id,modulo",{id:uid(), visita_id:LOJA.visita.id, loja_id:LOJA.id,
    pessoa_id:DIA.pessoa.id, modulo:mod, resultado:resultado||"feito", data:DIA.data});
  OBRIG=OBRIG||{regras:{},lojas:{}}; OBRIG.lojas=OBRIG.lojas||{};
  const o=OBRIG.lojas[LOJA.id]=OBRIG.lojas[LOJA.id]||{semana:{},hoje:{},tarefas:[]};
  o.hoje=o.hoje||{}; o.hoje[mod]=resultado||"feito";
  if(regraDe(k)==="semanal"||regraDe(k)==="semana_inicio"){ o.semana=o.semana||{}; o.semana[mod]={feito_em:DATA}; }
  salvaObrig();
}

/* Lotes perto de vencer em acompanhamento: vivem entre visitas, ate zerar. */
let VENC=null;   // loja_id -> [lotes]
async function buscarVencimentos(data){
  const guardado=guarda.lerJ("venc:"+data);
  if(guardado){ VENC=guardado; CARREGADO.venc=data; }
  if(!navigator.onLine) return;
  try{
    const r=await api("/rest/v1/rpc/meus_vencimentos",{method:"POST",body:JSON.stringify({p_data:data})});
    if(data!==DATA) return;
    /* O que foi contado aqui e ainda esta na fila vale mais que o servidor. */
    const loc=guardado||{}; VENC=r||{}; CARREGADO.venc=data;
    for(const [id,lotes] of Object.entries(loc)){ const srv=VENC[id]||(VENC[id]=[]);
      lotes.forEach(lt=>{ const n=srv.find(x=>x.id===lt.id);
        if(!n&&lt.registrado_hoje) srv.push(lt);
        else if(n&&lt.hoje&&!n.hoje) Object.assign(n,{hoje:lt.hoje,quantidade_atual:lt.quantidade_atual,status:lt.status}); }); }
    guarda.porJ("venc:"+data,VENC);
    if(TELA==="loja") telaLoja(); else if(TELA==="home") pintaLojas();
  }catch(e){}
}
const lotesDe=l=>(VENC&&VENC[l.id])||[];
const lotesAtivos=l=>lotesDe(l).filter(x=>x.status!=="encerrado");
const salvaVenc=()=>{ if(VENC) guarda.porJ("venc:"+DATA,VENC); };
function nivelLote(x){
  const d=diasAte(x.vence_em), crit=DIA.dias_critico_validade||20, lim=DIA.dias_alerta_validade||30;
  if(d<0) return {k:"vencido", t:`vencido há ${-d} ${-d===1?"dia":"dias"}`, cor:"var(--verm)", bg:"var(--verm-bg)"};
  if(d<=crit) return {k:"critico", t:`vence em ${d} ${d===1?"dia":"dias"}`, cor:"var(--verm)", bg:"var(--verm-bg)"};
  if(d<=lim) return {k:"atencao", t:`vence em ${d} dias`, cor:"var(--amb)", bg:"var(--amb-bg)"};
  return {k:"ok", t:`vence em ${d} dias`, cor:"var(--ink2)", bg:"var(--fundo)"};
}
/* Precisa ser contado nesta visita: ativo, e nao registrado agora mesmo. */
/* Contado e ter QUANTIDADE salva hoje. So escolher a acao nao conta. */
const pedeContagem=x=>x.status!=="encerrado" && !x.registrado_hoje && !(x.hoje&&x.hoje.quantidade!=null);

let CENSO=null;   // loja_id -> {feito_na_semana, feito_em, obrigatorio_hoje, anteriores}
async function buscarCenso(data){
  const guardado=guarda.lerJ("censo:"+data);
  if(guardado) CENSO=guardado;
  if(!navigator.onLine) return;
  try{
    const r=await api("/rest/v1/rpc/censo_semana",{method:"POST",body:JSON.stringify({p_data:data})});
    if(data!==DATA) return;
    /* O que foi enviado daqui e ainda nao chegou ao servidor vale mais. */
    const local=guardado||{};
    CENSO=r||{};
    for(const [k,v] of Object.entries(local)) if(v&&v.enviado_aqui&&CENSO[k]) Object.assign(CENSO[k],
      {feito_na_semana:true, feito_em:v.feito_em, obrigatorio_hoje:false, enviado_aqui:true});
    guarda.porJ("censo:"+data,CENSO);
    if(TELA==="loja") telaLoja();
  }catch(e){}
}
const censoDe=l=>(CENSO&&CENSO[l.id])||{};

/* TUDO o que o dia busca por tras fica aqui, e os dois caminhos de abrir o
   dia chamam esta funcao. Antes cada caminho tinha a sua lista, e as edicoes
   cairam so num deles: baixando o dia do zero, o app nao buscava as
   solicitacoes nem a regra da semana. Uma lista so nao deixa isso voltar. */
function buscarTudoDoDia(data){
  buscarNaoLidas(); buscarOportunidades(data); buscarPedidos(data);
  buscarCenso(data); buscarObrigacoes(data); buscarVencimentos(data); buscarDemandas(); buscarEquipamentos(data); buscarEstoque(data); buscarEntregas(data);
}

async function revalidarDia(data){

  try{
    const novo=await api("/rest/v1/rpc/meu_dia",{method:"POST",body:JSON.stringify({p_data:data})});

    DIA=novo;

}

/* A semana vem numa chamada so e leve. E ela que faz os numeros embaixo de
   cada dia aparecerem ao logar, em vez de so depois de tocar em cada dia. */
async function buscarSemana(){
  try{
    SEMANA=await api("/rest/v1/rpc/minha_semana",{method:"POST",
      body:JSON.stringify({p_inicio:hojeIso()})})||[];
    SEMANA_ERRO=null;
    guarda.porJ("semana",SEMANA);
  }catch(e){
    /* Antes este erro era engolido em silencio, e foi assim que a falta do
       20-semana.sql passou despercebida: o app so parecia "nao mostrar". */
    SEMANA_ERRO=/could not find|nao existe|does not exist/i.test(e.message)
      ? "O sistema ainda não sabe montar sua semana. Avise seu líder."
      : null;
  }
  if(pularSeHojeVazio()) return;
  if(TELA==="home"){ pintaDias(); pintaLojas(); }
}

/* Hoje sem loja: abre direto a proxima visita, uma vez so por abertura do
   app. Se pulasse sempre, o repositor nunca conseguiria olhar o dia de hoje.
   Nao ha risco de registro no dia errado: dia que nao e hoje abre so leitura. */
function pularSeHojeVazio(){
  if(JA_TENTOU_PULAR || TELA!=="home" || DATA!==hojeIso() || !DIA) return false;
  if((DIA.lojas||[]).length){ JA_TENTOU_PULAR=true; return false; }
  /* A semana ainda nao chegou do servidor: nao decide agora. Se marcasse
     "ja tentei", quando ela chegasse um instante depois o app nao pularia. */
  if(!(SEMANA||[]).length) return false;
  JA_TENTOU_PULAR=true;
  const prox=(SEMANA||[]).find(x=>String(x.data).slice(0,10)>DATA && (x.lojas||[]).length);
  if(!prox) return false;
  PULOU_DE_HOJE=true;
  carregarDia(String(prox.data).slice(0,10));
  return true;
}
const lojasNoDia=d=>{ const x=(SEMANA||[]).find(s=>String(s.data).slice(0,10)===d); return x?x.lojas:null; };

/* proximos dias uteis a partir de segunda desta semana */
function faixaDias(){
  const hoje=new Date(hojeIso()+"T12:00:00"), lista=[];
  for(let i=-1;i<=5;i++){ const d=new Date(hoje); d.setDate(d.getDate()+i);
    if(d.getDay()===0) continue;
    lista.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`); }
  return lista.slice(0,7);
}
function pintaDias(){
  const rot=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const dias=faixaDias();
  const feitas=DIA.lojas.filter(l=>l.visita&&l.visita.hora_fim).length;
  const pend=DIA.lojas.length-feitas;
  $("dias").className="dias";
  $("dias").innerHTML=`<div class="tira">${dias.map(d=>{
    const dt=new Date(d+"T12:00:00"), eh=d===hojeIso(), sel=d===DATA;
    const daSemana=lojasNoDia(d), c=guarda.lerJ("dia:"+d);
    const n=daSemana?daSemana.length:(c?c.lojas.length:null);
    return `<button class="dia ${sel?"sel":""} ${eh?"hoje":""}" data-d="${d}">
      <div class="rot">${rot[dt.getDay()]}</div>
      <div class="num">${dt.getDate()}</div>
      ${n===null?"":`<span class="badge ${n?"":"zero"}">${n}</span>`}</button>`; }).join("")}</div>
    ${PULOU_DE_HOJE&&DATA!==hojeIso()?`<div class="resumo-dia" style="color:var(--azul);font-weight:600">
      Hoje não tem loja no seu roteiro · mostrando sua próxima visita</div>`:""}
    <div class="resumo-dia">${pend?`<span class="pt"></span>${pend} ${pend===1?"pendente":"pendentes"} · `:""}${
      DATA===hojeIso()?`hoje é ${rot[new Date(DATA+"T12:00:00").getDay()]} ${dataBr(DATA).slice(0,5)}`
      :`vendo ${dataBr(DATA).slice(0,5)}`}</div>`;
  $("dias").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ PULOU_DE_HOJE=false; carregarDia(b.dataset.d); });
}
function pintaBarra(){
  $("barra").className="barra";
  $("barra").innerHTML=`<div class="busca">${IC.lupa}<input id="buscaVis" placeholder="Buscar visitas" value="${esc(FILTRO)}"></div>
    <button class="quad" id="bfil">${IC.filtro}</button>
    <button class="quad on" id="blista">${IC.lista}</button>
    <button class="quad" id="bmapa">${IC.mapa}</button>`;

  $("bfil").onclick=()=>{ FILTRO=FILTRO?"":""; alerta("Use a busca para filtrar por nome ou bairro."); };
  $("bmapa").onclick=telaMapa;
}
function lojasFiltradas(){
  const f=FILTRO.trim().toLowerCase();
  const ls=(DIA.lojas||[]);
  if(!f) return ls;
  return ls.filter(l=>String(l.nome).toLowerCase().includes(f)||String(l.bairro||"").toLowerCase().includes(f));
}
/* O cartao da loja fala dos pedidos do movimento. As notas antigas so entram
   quando ainda nao ha movimento carregado: sem carga nova de notas, as que
   estavam em aberto ficariam "previstas" para sempre. */
function linhaPedidos(l){
  const ps=pedidosDe(l);
  if(ps.length){ const cam=ps.filter(n=>n.status!=="ACERTADA"&&!(n.dias>0)).length, ab=ps.filter(n=>n.status!=="ACERTADA"&&n.dias>0).length;
    return (cam?` · ${cam} ${cam===1?"pedido a caminho":"pedidos a caminho"}`:"")+(ab?` · ${ab} em aberto`:""); }
  const ns=l.notas||[]; return ns.length?` · ${ns.length} nota(s) prevista(s)`:"";
}
function prioridade(l){
  const ps=pedidosDe(l);
  const atras=ps.length ? ps.some(n=>n.status!=="ACERTADA"&&n.dias>0) : (l.notas||[]).some(n=>n.dias>0);
  const venc=lotesAtivos(l).some(x=>{ const k=nivelLote(x).k; return k==="vencido"||k==="critico"; });
  return atras||venc?"Alta":"Normal";
}
function modulosFeitos(l){
  /* So conta modulo de tarefa. Informativo e ferramenta nao sao trabalho. */
  return modulosAtivos().filter(m=>{ const e=estadoModulo(l,m.k); return e.k==="feito"; }).length;
}
function modulosDeTarefa(){ return modulosAtivos().filter(m=>{ const rg=regraDe(m.k); return rg==="toda_visita"||rg==="semanal"; }).length; }
function pintaLojas(){
  const ls=lojasFiltradas(), dn=demandasParaResponder().length;
  const avisoDem = dn ? `<button class="aviso amb" id="avDem" style="display:block;width:100%;text-align:left;border:none;font:inherit;cursor:pointer">
      <b>${dn} ${dn===1?"demanda do líder":"demandas do líder"} para responder.</b> Toque para ver.</button>` : "";
  $("corpo").innerHTML=avisoDem+(ls.length?ls.map((l,i)=>{
    const v=l.visita, fim=v&&v.hora_fim, pr=prioridade(l), k=modulosFeitos(l);
    const idx=(DIA.lojas||[]).indexOf(l);
    return `<div class="loja ${fim?"feita":pr==="Alta"?"alta":""}" data-i="${idx}">
      <div class="dentro">
        <div class="cab"><div class="titulo"><i>${i+1}.</i>${esc(String(l.nome).toUpperCase())}</div>
          <div class="selos">
            <span class="selo ${pr==="Alta"?"alta":"pend"}">${pr}</span>
            <span class="selo ${fim?"feito":"pend"}">${fim?"Concluída":v?"Em andamento":"Pendente"}</span>
          </div></div>
        ${fim?`<div class="hora">${esc(String(v.hora_inicio||"").slice(0,5))} – ${esc(String(v.hora_fim).slice(0,5))}</div>`:""}
        <div class="end">${esc([l.bairro,l.cidade].filter(Boolean).join(", ").toUpperCase())}</div>
        <div class="desc">${(l.catalogo||[]).length} itens de contagem${linhaPedidos(l)}${
          naoLidas(l.id)?` · <b style="color:var(--verm)">${naoLidas(l.id)} mensagem(ns)</b>`:""}${
          semVer(l.id)?` · <b style="color:var(--amb)">consultor não viu</b>`:""}</div>
        <div class="pe">
          <button class="bolinha" data-a="ficha" aria-label="Dados do cliente">${IC.pessoa}</button>
          ${temGps(l)
            ? `<a class="bolinha" href="${mapaDe(l)}" target="_blank" rel="noopener" aria-label="Navegar até a loja">${IC.seta}</a>`
            : `<a class="bolinha sem" aria-label="Sem localização">${IC.seta}</a>`}
          <div class="progresso"><div class="trilho"><i style="width:${Math.round(k/modulosDeTarefa()*100)}%"></i></div>
            <span class="fracao">${k}/${modulosDeTarefa()}</span></div>
        </div></div></div>`; }).join("")
    : FILTRO ? `<div class="vazio">Nenhuma loja com esse nome.</div>` : diaVazio())
    /* a versao a vista: quando algo nao bate com o esperado, a primeira pergunta e se o aparelho esta com o app novo */
    +`<div class="mut" style="text-align:center;font-size:12px;margin:18px 0 6px">Versão do app ${VERSAO_APP}</div>`;
  if($("avDem")) $("avDem").onclick=()=>telaDemandas();
  $("corpo").querySelectorAll(".loja").forEach(c=>{
    const l=DIA.lojas[+c.dataset.i];
    /* Toque no cartao abre a loja; toque num botao faz so a acao dele. */
    c.querySelector(".dentro").onclick=e=>{ if(e.target.closest("[data-a],a")) return; telaLoja(l); };
    c.querySelectorAll("a.bolinha").forEach(a=>a.addEventListener("click",ev=>ev.stopPropagation()));
    const bf=c.querySelector('[data-a="ficha"]');
    if(bf) bf.onclick=ev=>{ ev.stopPropagation(); abrirFicha(l); }; });
  $("corpo").querySelectorAll("[data-ir]").forEach(b=>b.onclick=()=>carregarDia(b.dataset.ir));
}
/* Dia sem loja nao pode ser tela em branco. Mostra as proximas visitas da
   semana, cada uma tocavel, para o repositor ver na hora onde vai trabalhar. */
function diaVazio(){
  const rot=["","seg","ter","qua","qui","sex","sáb","dom"];
  const eh=DATA===hojeIso();
  const prox=(SEMANA||[]).filter(x=>String(x.data).slice(0,10)>DATA && (x.lojas||[]).length).slice(0,4);
  return `<div class="vazio" style="padding:26px 18px 14px">${eh?"Hoje não tem loja no seu roteiro.":"Nenhuma loja no roteiro deste dia."}</div>`
    + (SEMANA_ERRO?`<div class="aviso amb">${esc(SEMANA_ERRO)}</div>`:"")
    + (prox.length
      ? `<h2 class="tit">PRÓXIMAS VISITAS</h2>` + prox.map(x=>{ const d=String(x.data).slice(0,10), dt=new Date(d+"T12:00:00");
          const ls=x.lojas||[];
          return `<button class="prox" data-ir="${d}">
            <span class="quando"><b>${dt.getDate()}</b><span>${rot[x.dia_semana]}</span></span>
            <span class="quais"><b>${ls.length} ${ls.length===1?"loja":"lojas"}</b><br>
              ${esc(ls.slice(0,3).map(l=>l.nome).join(" · "))}${ls.length>3?" …":""}</span>
            <span style="color:var(--ink3);font-size:22px">\u203a</span></button>`; }).join("")
      : (SEMANA&&SEMANA.length?`<div class="vazio" style="padding-top:0">Nenhuma visita nos próximos dias.</div>`:""));
}

/* Telefone e mapa como LINK de verdade, nao como janela aberta por codigo.
   O celular reconhece tel: e o endereco do mapa na hora; abrir por codigo
   e bloqueado por varios navegadores e nao faz nada. */
const soDigitos=t=>String(t||"").replace(/\D/g,"");
function telLink(tel, icone, rotulo){
  const d=soDigitos(tel);
  return d.length>=10
    ? `<a class="bolinha" href="tel:${d}" aria-label="${rotulo}">${icone}</a>`
    : `<a class="bolinha sem" aria-label="Sem telefone">${icone}</a>`;
}
const mapaDe=l=>`https://www.google.com/maps/search/?api=1&query=${l.gps_lat},${l.gps_lon}`;
/* Coordenada so vale se cair dentro do Brasil. Ja aconteceu de chegar numero
   torto do importador e o mapa mandar para -90,-80, na Antartida. Coordenada
   errada e pior que nenhuma: manda o repositor para o lugar errado com toda
   a confianca. Fora da faixa, o app trata como sem localizacao. */
const temGps=l=>{ const a=Number(l&&l.gps_lat), o=Number(l&&l.gps_lon);
  return l&&l.gps_lat!=null&&l.gps_lon!=null&&isFinite(a)&&isFinite(o)
    && a>=-34 && a<=6 && o>=-74 && o<=-34; };
const zapDe=t=>{ const d=soDigitos(t); return d?`https://wa.me/55${d.slice(-11)}`:""; };

function abrirFicha(l){
  const linha=(rot,nome,tel)=>!nome?"":`<div class="lin"><span>${esc(nome)}${tel?`<br><span style="font-size:12.5px;color:var(--ink2)">${esc(tel)}</span>`:""}</span>
    ${soDigitos(tel).length>=10?`<a href="tel:${soDigitos(tel)}">Ligar</a><a href="${zapDe(tel)}" target="_blank" rel="noopener">WhatsApp</a>`:""}</div>`;
  $("menu").innerHTML=`<div class="puxador"></div><div class="ficha">
    <h3>${esc(l.nome)}</h3>
    <div class="sub">${esc([l.endereco,l.bairro].filter(Boolean).join(" · "))}</div>
    <div class="sub">${esc([l.cep,l.cidade].filter(Boolean).join(" · "))}</div>
    ${temGps(l)?`<div class="lin" style="margin-top:8px"><span style="font-size:13px;color:var(--ink2)">
      ${Number(l.gps_lat).toFixed(5)}, ${Number(l.gps_lon).toFixed(5)}</span>
      <a href="${mapaDe(l)}" target="_blank" rel="noopener">Navegar</a></div>`:""}
    <div class="bloco"><div class="rot">LOJA</div>${linha("Loja","Telefone da loja",l.telefone)||`<div class="sub">sem telefone cadastrado</div>`}</div>
    <div class="bloco"><div class="rot">COMERCIAL</div>
      ${linha("Consultor",l.consultor&&l.consultor!=="ROTA SEM VENDEDOR"?`Consultor · ${l.consultor}`:"",l.consultor_tel)}
      ${l.supervisor?`<div class="lin"><span>Supervisor · ${esc(l.supervisor)}</span></div>`:""}
      ${l.gerencia?`<div class="lin"><span>Gerência · ${esc(l.gerencia)}</span></div>`:""}
      ${!l.consultor||l.consultor==="ROTA SEM VENDEDOR"?`<div class="sub">loja sem consultor cadastrado</div>`:""}
    </div></div>
    <button class="sair" id="fabrir" style="color:var(--ink)">Abrir a loja</button>`;
  $("fabrir").onclick=()=>{ fecharMenu(); telaLoja(l); };

}

/* ------------------------- mapa do dia -----------------------
   A biblioteca do mapa e carregada so quando alguem abre, para nao pesar a
   abertura do app todo dia por causa de uma tela nem sempre usada.
   Sem sinal o mapa nao desenha, porque os ladrilhos vem da internet. Nesse
   caso a tela diz isso em vez de ficar cinza sem explicacao. */
let MAPA=null;
function carregarMapa(){
  if(window.L) return Promise.resolve();
  return new Promise((ok,nok)=>{
    const css=document.createElement("link"); css.rel="stylesheet";
    css.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const js=document.createElement("script");
    js.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js";
    js.onload=ok; js.onerror=()=>nok(new Error("sem sinal"));
    document.head.appendChild(js);
  });
}
function rotaDoDia(){
  const ls=(DIA.lojas||[]).filter(temGps);
  if(!ls.length) return alerta("Nenhuma loja com coordenada hoje.");
  /* O Google Maps aceita cerca de 10 pontos no link e ignora o resto em
     silencio. Melhor cortar aqui e avisar do que entregar rota incompleta. */
  const usa=ls.slice(0,10), destino=usa[usa.length-1];
  const meio=usa.slice(0,-1).map(l=>l.gps_lat+","+l.gps_lon).join("|");
  open("https://www.google.com/maps/dir/?api=1&destination="+destino.gps_lat+","+destino.gps_lon
    +(meio?"&waypoints="+encodeURIComponent(meio):"")+"&travelmode=driving","_blank");
  if(ls.length>10) alerta("O mapa aceita 10 paradas. Entraram as 10 primeiras de "+ls.length+".");
}
function fecharMapa(){ $("corpo").style.padding=""; if(MAPA){ MAPA.remove(); MAPA=null; } telaVisitas(); }
function telaMapa(){ montar(()=>{ TELA="mapa"; esconderTudo();
  topo("Mapa do dia", fecharMapa, "");
  const ls=lojasFiltradas().filter(temGps);
  $("corpo").style.padding="0";
  $("corpo").innerHTML='<div class="mapa-caixa"><div id="mapa"></div>'
    +'<div class="mapa-pe"><button class="sec" id="mfechar">Lista</button>'
    +'<button id="mrota">Traçar rota do dia</button></div></div>';
  rodape(null);
  $("mfechar").onclick=fecharMapa;
  $("mrota").onclick=rotaDoDia;
  if(!ls.length){ $("mapa").innerHTML='<div class="vazio">Nenhuma loja com coordenada para mostrar.</div>'; return; }
  carregarMapa().then(()=>{
    if(MAPA){ MAPA.remove(); MAPA=null; }
    MAPA=L.map("mapa",{zoomControl:false});
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {maxZoom:19, attribution:"&copy; OpenStreetMap"}).addTo(MAPA);
    const pontos=[];
    ls.forEach((l,i)=>{
      const feita=l.visita&&l.visita.hora_fim;
      const ic=L.divIcon({className:"",iconSize:[26,26],iconAnchor:[13,13],
        html:'<div class="pino '+(feita?"feita":"")+'">'+(i+1)+'</div>'});
      L.marker([l.gps_lat,l.gps_lon],{icon:ic}).addTo(MAPA)
        .bindPopup("<b>"+esc(l.nome)+"</b><br>"+esc(l.bairro||"")
          +'<br><a href="https://www.google.com/maps/search/?api=1&query='
          +l.gps_lat+","+l.gps_lon+'" target="_blank">Navegar até aqui</a>');
      pontos.push([l.gps_lat,l.gps_lon]);
    });
    MAPA.fitBounds(pontos,{padding:[40,40],maxZoom:15});
    posicao().then(g=>{ if(g&&MAPA) L.circleMarker([g.lat,g.lon],
      {radius:7,color:"#1E6FD9",fillColor:"#1E6FD9",fillOpacity:.9,weight:2})
      .addTo(MAPA).bindPopup("Você está aqui"); });
  }).catch(()=>{
    $("mapa").innerHTML='<div class="vazio">O mapa precisa de internet para desenhar.<br>'
      +'Sem sinal, use o botão de navegar em cada loja.</div>';
  });
});}

/* ---------------------- entrada da loja ---------------------- */
/* Todos os modulos que o app sabe mostrar. Os que estao com a regra
   "desligado" (no banco, em regras_modulos) nao aparecem e nao contam no
   encerramento. Religar e so mudar a regra no banco, sem mexer no app. */
const MODULOS_TODOS=[
  {k:"contagem", ic:"1", nome:"Oportunidade de Estoque", tela:()=>telaOportunidade()},
  {k:"validade", ic:"2", nome:"Controle de Vencimentos", tela:()=>telaValidade()},
  {k:"chegadas", ic:"3", nome:"Informações de Vendas",   tela:()=>telaPedidos()},
  {k:"exposicao",ic:"4", nome:"Exposição e ponto extra", tela:()=>telaExposicao()},
  {k:"preco",    ic:"5", nome:"Preço e concorrência",    tela:()=>telaPreco()},
  {k:"pdv",      ic:"6", nome:"Materiais e Geladeiras",  tela:()=>telaEquipamentos()},
  {k:"demandas", ic:"7", nome:"Demandas",                tela:()=>telaDemandas()},
  {k:"entrega",  ic:"8", nome:"Validade na Entrega",     tela:()=>telaEntrega()},
  {k:"estoque",  ic:"9", nome:"Contagem de Estoque",     tela:()=>telaEstoque()}
];
const modulosAtivos=()=>MODULOS_TODOS.filter(m=>regraDe(m.k)!=="desligado");
let NAOLIDAS={};   // loja_id -> {nao_lidas, consultor_nao_viu, ...}
function resumo(k){
  const lista={contagem:"oport", validade:"venc", estoque:"estoque", pdv:"equip"}[k];
  if(lista&&!chegou(lista)) return {txt:navigator.onLine?"buscando os dados…":"sem sinal: os dados aparecem quando a internet voltar", pronto:false, alerta:false};
  if(k==="estoque"){ const ps=estoqueDe(LOJA), n=ps.filter(contadoEstoque).length;
    return {txt: ps.length ? `${n} de ${ps.length} produtos contados hoje` : "nenhum produto comprado na base"}; }
  if(k==="entrega"){ const es=entregasDe(LOJA), h=es.filter(p=>p.hoje);
    return {txt: h.length ? `${h.length} ${h.length===1?"pedido com entrega prevista hoje":"pedidos com entrega prevista hoje"}`
                 : es.length ? `${es.length} ${es.length===1?"entrega":"entregas"} dos últimos dias` : "nenhuma entrega prevista hoje"}; }
  if(k==="demandas"){ const n=demandasParaResponder().length, r=(DEMANDAS&&DEMANDAS.para_lider||[]).filter(d=>d.resposta&&!d.visto).length;
    return {txt:[n?`${n} do líder para responder`:"", r?`${r} ${r===1?"resposta nova":"respostas novas"}`:""].filter(Boolean).join(" · ")||"Mande e receba demandas do líder", badge:n+r}; }
  const l=LOJA, cat=l.catalogo||[], lim=DIA.dias_alerta_validade||30;
  if(k==="contagem"){ const r=resumoOport(l);
    if(!r.total) return {txt:"nenhuma oportunidade hoje", pronto:false, alerta:false};
    const p=[`${r.feitos} de ${Math.min(r.total,oportDe(l).limite||15)} registrados`];
    if(r.ruptura) p.push(`${r.ruptura} ruptura`);
    if(r.abaixo) p.push(`${r.abaixo} abaixo`);
    if(r.excesso) p.push(`${r.excesso} excesso`);
    if(r.nunca) p.push(`${r.nunca} nunca comprou`);
    return {txt:p.join(" · "), pronto:r.feitos>=Math.min(r.total,oportDe(l).limite||15)&&!r.semMotivo,
      alerta:r.semMotivo>0||r.ruptura>0}; }
  if(k==="validade"){ const at=lotesAtivos(l);
    if(!at.length) return {txt:"nenhum lote em acompanhamento", pronto:false, alerta:false};
    const venc=at.filter(x=>nivelLote(x).k==="vencido").length, crit=at.filter(x=>nivelLote(x).k==="critico").length;
    const falta=at.filter(pedeContagem).length;
    const p=[`${at.length} em acompanhamento`];
    if(venc) p.push(`${venc} vencido`); if(crit) p.push(`${crit} crítico`); if(falta) p.push(`falta contar ${falta}`);
    return {txt:p.join(" · "), pronto:false, alerta:venc>0||crit>0, badge:venc+crit||null}; }
  if(k==="chegadas"){ const ps=pedidosDe(l);
    if(!ps.length){ const n=l.notas||[];
      return {txt:n.length?`${n.length} ${n.length===1?"nota prevista":"notas previstas"}`:"pedidos e entregas da loja",
              pronto:false, alerta:false}; }
    const ab=ps.filter(x=>situacaoPedido(x).k==="aberto").length;
    const cam=ps.filter(x=>situacaoPedido(x).k==="caminho").length;
    const p=[`${ps.length} ${ps.length===1?"pedido":"pedidos"}`];
    if(cam) p.push(`${cam} a caminho`);
    if(ab) p.push(`${ab} em aberto`);
    return {txt:p.join(" · "), pronto:false, alerta:false}; }
  if(k==="exposicao"){ const e=l.exposicoes||[], ruim=e.filter(x=>x.situacao==="ausente").length;
    return {txt:e.length?`${e.length} ${e.length===1?"ponto":"pontos"}${ruim?` · ${ruim} ausente`:""}`:"nada registrado",
      pronto:e.length>0&&ruim===0, alerta:ruim>0}; }
  if(k==="preco"){ const pr=cat.filter(x=>x.contagem&&x.contagem.preco!=null).length, cc=(l.concorrentes||[]).length;
    return {txt:`${pr} ${pr===1?"preço":"preços"}${cc?` · ${cc} concorrente`:""}`, pronto:pr>0, alerta:false}; }
  if(k==="pdv"){ const e=estadoModulo(l,"pdv"), es=equipDe(l), f=es.filter(confDaSemana).length;
    return {txt: es.length?`${f} de ${es.length} ${es.length===1?"geladeira conferida":"geladeiras conferidas"} nesta semana`:"nenhuma geladeira em comodato",
      pronto:e.k==="feito", alerta:e.k==="obrig"}; }
  if(k==="conversa"){ const n=naoLidas(l.id), v=semVer(l.id);
    const partes=[];
    if(n) partes.push(`${n} ${n===1?"mensagem nova":"mensagens novas"}`);
    if(v) partes.push(`${v} sem o consultor ver`);
    return {txt:partes.join(" · ")||"falar com o líder ou o consultor",
      pronto:false, alerta:n>0||v>0, badge:n||null}; }
  return {txt:"",pronto:false,alerta:false};
}
/* A entrada da loja e um roteiro, separado por tipo:
     solicitacoes da lideranca, o obrigatorio desta visita, o da semana,
     e o que e so consulta. */
function botaoModulo(m,i,num){
  const e=estadoModulo(LOJA,m.k), r=resumo(m.k);
  const abertas=tarefasDe(LOJA,MOD_REGRA[m.k]).filter(tarefaAberta).length;
  const cls=e.k==="feito"?"pronto":e.k==="obrig"?"alerta":"";
  const cor=e.k==="feito"?"var(--verde)":e.k==="obrig"?"var(--verm)":e.k==="pend"?"var(--amb)":"var(--ink3)";
  return `<button class="mod ${cls}" data-m="${i}">
    ${abertas||r.badge?`<span class="sino">${abertas||r.badge}</span>`:""}
    <span class="ic">${e.k==="feito"?"\u2713":(num||i+1)}</span>
    <span class="txt"><b>${m.nome}</b>
      ${e.txt?`<span style="color:${cor};font-weight:500">${esc(e.txt)}</span><br>`:""}
      <span>${esc(r.txt||"")}</span></span>
    <span style="color:var(--ink3);font-size:22px">\u203a</span></button>`;
}
function cartaoTarefa(t,idx){
  const venc=tarefaVencida(t), aberta=tarefaAberta(t);
  const quem=t.de_perfil==="gerente"?"Gerente":t.de_perfil==="admin"?"Gestão":"Seu líder";
  const cor=!aberta?"var(--verde)":venc?"var(--verm)":"var(--amb)";
  return `<button class="mod ${!aberta?"pronto":venc?"alerta":""}" data-t="${idx}" style="border-left:4px solid ${cor}">
    <span class="ic">${!aberta?"\u2713":"!"}</span>
    <span class="txt"><b>${t.campanha?`<span style="color:var(--verm)">Campanha · </span>`:""}${esc(t.titulo)}</b>
      <span style="color:${cor};font-weight:500">${!aberta?"respondida":t.resposta?"não conseguiu · reenviar se fizer":
        venc?`venceu ${dataBr(t.prazo).slice(0,5)} · responda para encerrar`:t.prazo?`prazo ${dataBr(t.prazo).slice(0,5)}`:"sem prazo"}</span><br>
      <span>${quem}${t.de?" · "+esc(String(t.de).split(" ")[0]):""}${t.modulo&&t.modulo!=="livre"?" · "+esc(nomeDoModulo(t.modulo)):""}</span></span>
    <span style="color:var(--ink3);font-size:22px">\u203a</span></button>`;
}
const nomeDoModulo=mod=>{ const k=Object.keys(MOD_REGRA).find(x=>MOD_REGRA[x]===mod);
  const m=MODULOS_TODOS.find(x=>x.k===k); return m?m.nome:"Solicitação"; };

function telaLoja(l){ montar(()=>{ TELA="loja"; if(l&&l.id&&l.nome) LOJA=l; esconderTudo();
  const v=LOJA.visita, fim=v&&v.hora_fim;
  topo(LOJA.nome, telaVisitas, "");
  const tarefas=tarefasDe(LOJA);
  const g={obrig:[], semana:[], consulta:[]};
  const mods=modulosAtivos();
  mods.forEach((m,i)=>{ const e=estadoModulo(LOJA,m.k), rg=regraDe(m.k);
    if(e.k==="info"||e.k==="tool") g.consulta.push([m,i]);
    else if(rg==="toda_visita"||e.k==="obrig"||(rg==="entrega"&&e.k==="feito")) g.obrig.push([m,i]);
    else g.semana.push([m,i]); });
  /* Numerados na ordem em que aparecem na tela, grupo apos grupo. */

  const bloco=(tit,lista)=>lista.length?`<h2 class="tit">${tit}</h2>`+lista.map(([m,i])=>botaoModulo(m,i,++num)).join(""):"";
  $("corpo").innerHTML=`
    <div class="cartao"><div style="font-size:14.5px;color:var(--ink2)">${esc(LOJA.endereco||"")}</div>
      ${LOJA.cep?`<div style="font-size:14.5px;color:var(--ink2)">${esc(LOJA.cep)} · ${esc(LOJA.cidade||"")}</div>`:""}
      ${LOJA.consultor?`<div style="font-size:13.5px;color:var(--ink3);margin-top:6px">Consultor: ${esc(LOJA.consultor)}${LOJA.consultor_tel?` · ${esc(LOJA.consultor_tel)}`:""}</div>`:""}</div>
    ${!editavel()?`<div class="aviso amb">Você está vendo ${dataBr(DATA)}. Só dá para registrar no dia de hoje.</div>`
      :!v?`<div class="aviso inf">Toque em iniciar visita quando estiver dentro da loja.</div>`:""}
    ${tarefas.length?`<h2 class="tit" style="color:var(--verm)">SOLICITAÇÕES · ${tarefas.filter(tarefaAberta).length} em aberto</h2>`
      +tarefas.map((t,i)=>cartaoTarefa(t,i)).join(""):""}
    ${bloco("OBRIGATÓRIAS NESTA VISITA", g.obrig)}
    ${bloco("DA SEMANA", g.semana)}
    ${bloco("CONSULTA", g.consulta)}`;
  $("corpo").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>mods[+b.dataset.m].tela());
  $("corpo").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>telaTarefa(tarefas[+b.dataset.t]));
  rodape(!editavel()?null
    :fim?`<button class="bt sec" disabled>Concluída às ${esc(String(v.hora_fim).slice(0,5))}</button>`
    :v?`<button class="bt" id="fim">Encerrar visita</button>`
      :`<button class="bt" id="ini">Iniciar visita</button>`);
  if($("ini")) $("ini").onclick=iniciarVisita;
  if($("fim")) $("fim").onclick=encerrarVisita;
});}

/* Responder uma solicitacao. "Nao consegui" exige o motivo: e isso que o
   lider precisa para resolver, e sem motivo a resposta nao ajuda ninguem. */

function telaTarefa(t){ montar(()=>{ TELA="mod"; esconderTudo();
  const camp=!!t.campanha, itens=Array.isArray(t.itens)?t.itens:[], fmin=Number(t.fotos_min||0)||(t.exige_foto?1:0), fmax=Math.max(3,fmin);

  const f=t._form=t._form||{situacao:null, comentario:"", fotos:[], checklist:{}};
  const modK=Object.keys(MOD_REGRA).find(x=>MOD_REGRA[x]===t.modulo);
  const r=t.resposta;
  $("corpo").innerHTML=`
    <div class="cartao">
      ${camp?`<span class="selo" style="background:var(--verm-bg);color:var(--verm);font-weight:700">Campanha</span>`:""}
      <div style="font-size:12.5px;color:var(--ink3);margin-top:${camp?6:0}px">${quem}${t.de?" · "+esc(t.de):""} · ${dataBr(String(t.criado_em).slice(0,10))}</div>
      <div style="font-size:17px;font-weight:700;margin-top:6px">${esc(t.titulo)}</div>
