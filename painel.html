<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de merchandising</title>
<style>
:root{
  --verm:#E4002B; --verm-esc:#B80022; --verm-bg:#FDE7EC;
  --ink:#1A1D21; --ink2:#5B6270; --ink3:#9CA3AF; --linha:#E5E7EB; --papel:#FFF; --fundo:#F1F2F4;
  --lado:#1F2023; --lado2:#2B2C30; --lado-txt:#C9CBD1;
  --verde:#0F7A52; --verde-bg:#E6F4EE; --amb:#96620F; --amb-bg:#FDF2DC; --azul:#1E6FD9; --azul-bg:#E9F1FC;
  --teal:#2F7F86; --teal-bg:#DCEEF0; --roxo:#6D4BC4; --roxo-bg:#F0EBFB;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--fundo);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
/* menu lateral */
aside{background:var(--lado);color:var(--lado-txt);display:flex;flex-direction:column;overflow-y:auto}
.marca{display:flex;gap:10px;align-items:center;padding:18px 16px;border-bottom:1px solid #303136}
.marca .lg{width:34px;height:34px;border-radius:9px;background:var(--verm);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.marca b{color:#fff;display:block;font-size:15px} .marca small{font-size:12px}
nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
nav button{display:flex;gap:11px;align-items:center;text-align:left;border:none;background:none;color:var(--lado-txt);padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;line-height:1.25;position:relative}
nav button:hover{background:var(--lado2)}
nav button[aria-current="page"]{background:var(--lado2);color:#fff;font-weight:600}
nav button[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--verm)}
nav svg{flex:none;opacity:.85}
nav .n{margin-left:auto;background:var(--verm);color:#fff;font-size:11.5px;font-weight:700;border-radius:10px;padding:1px 7px}
/* cartao de hoje */
.hoje{margin:auto 10px 12px;background:var(--verm);color:#fff;border-radius:14px;padding:14px}
.hoje .top{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.hoje .pill{background:rgba(255,255,255,.22);border-radius:12px;padding:2px 9px;font-weight:700}
.hoje h3{margin:8px 0 2px;font-size:14px;font-weight:600}
.hoje .big{font-size:30px;font-weight:800;line-height:1.05}
.hoje .big small{font-size:14px;font-weight:600;opacity:.9}
.hoje .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.3);margin:8px 0 10px;overflow:hidden}
.hoje .bar span{display:block;height:100%;background:#fff}
.hoje .it{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.hoje .it i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:-1px}
.hoje .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.hoje .mini div{background:rgba(0,0,0,.18);border-radius:9px;text-align:center;padding:7px 2px}
.hoje .mini b{display:block;font-size:17px} .hoje .mini span{font-size:11px;opacity:.9}

main{overflow-y:auto;min-width:0}
.cab{background:var(--papel);border-bottom:1px solid var(--linha);padding:16px 26px;display:flex;gap:16px;align-items:flex-start}
.cab h1{margin:0;font-size:19px} .cab p{margin:3px 0 0;color:var(--ink2);font-size:13px}
.cab .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.bt{border:1px solid var(--linha);background:var(--papel);border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.bt.escuro{background:var(--ink);color:#fff;border-color:var(--ink)}
.bt.verm{background:var(--verm);color:#fff;border-color:var(--verm)}
.bt.xls{color:var(--verde);border-color:#9BD2B9} 
.bt:disabled{opacity:.5;cursor:default}

/* filtros */
.filtros{background:var(--papel);border-bottom:1px solid var(--linha);padding:14px 26px 16px}
.filtros .tt{display:flex;gap:10px;align-items:center}
.filtros .tt .ic{width:30px;height:30px;border-radius:8px;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center}
.filtros .tt b{font-size:14px} .filtros .tt span{color:var(--ink2);font-size:12.5px;display:block}
.rot{font-size:11.5px;font-weight:700;color:var(--ink2);letter-spacing:.04em;margin:12px 0 6px;display:flex;gap:10px;align-items:center}
.rot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--azul)}
.rot a{font-weight:500;color:var(--azul);letter-spacing:0;cursor:pointer;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;gap:7px;align-items:center;border:1.5px solid #BFD3F2;border-radius:20px;padding:5px 12px 5px 9px;cursor:pointer;color:#1B4F9C;font-weight:600;font-size:13px;background:#fff}
.chips input{accent-color:var(--azul);width:15px;height:15px;margin:0}
.chips label.off{border-color:var(--linha);color:var(--ink3)}
.lin4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:14px;align-items:end}
.lin4 select{width:100%;border:1px solid #D1D5DB;border-radius:9px;padding:8px 10px;background:#fff}

/* modulo */
.mod{padding:20px 26px 40px}
.mod h2{color:var(--verm);font-size:24px;margin:2px 0 12px;font-weight:800}
.abas{display:flex;gap:28px;border-bottom:1px solid var(--linha);margin-bottom:14px;flex-wrap:wrap}
.abas button{border:none;background:none;padding:6px 2px 10px;cursor:pointer;text-align:left;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1px}
.abas button b{display:block;font-size:14px} .abas button span{font-size:12px}
.abas button[aria-selected="true"]{color:var(--verm);border-color:var(--verm)}
.alerta{border:1.5px dashed #F0A3B3;background:#FDF1F4;color:#7A1023;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.alerta.ok{border-color:#9BD2B9;background:#F0F8F4;color:#0B5A3D}
.barraf{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--linha);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:none;background:none;padding:7px 13px;font-weight:600;cursor:pointer;color:var(--ink2);border-right:1px solid var(--linha)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.barraf .busca{margin-left:auto;border:1px solid var(--linha);border-radius:9px;padding:8px 11px;min-width:230px;background:#fff}
.mut{color:var(--ink2)}

/* tabela */
.tab{background:var(--papel);border:1px solid var(--linha);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{position:sticky;top:0;background:#FAFAFB;text-align:left;font-size:12px;color:var(--ink2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--linha);white-space:nowrap;cursor:default}
th[data-ord]{cursor:pointer} th[data-ord]:hover{color:var(--ink)}
td{padding:10px 12px;border-bottom:1px solid #EEF0F2;vertical-align:top}
tr:last-child td{border-bottom:none}
tr.clica{cursor:pointer} tr.clica:hover td{background:#F7FAFB}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub{display:block;font-size:12px;color:var(--ink3)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;white-space:nowrap}
.t-verm{background:var(--verm-bg);color:var(--verm-esc)} .t-amb{background:var(--amb-bg);color:var(--amb)}
.t-verde{background:var(--verde-bg);color:var(--verde)} .t-azul{background:var(--azul-bg);color:var(--azul)}
.t-roxo{background:var(--roxo-bg);color:var(--roxo)} .t-cinza{background:#EEF0F2;color:var(--ink2)}
.cel{display:inline-block;min-width:64px;text-align:center;border-radius:6px;padding:4px 8px;font-weight:700;background:var(--teal-bg);color:#145a60}
.cel.forte{background:var(--teal);color:#fff}
.vazio{padding:26px;text-align:center;color:var(--ink2)}
.var-up{color:var(--verde);font-weight:700;font-size:12px} .var-dn{color:var(--verm-esc);font-weight:700;font-size:12px}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:13px 15px}
.kpi span{font-size:12.5px;color:var(--ink2)} .kpi b{display:block;font-size:28px;line-height:1.15;margin-top:2px}
.kpi small{font-size:12px;color:var(--ink3)}

/* estrutura */
.arv{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:14px 16px}
.no{padding:8px 0 8px 18px;border-left:2px solid var(--linha);margin-left:8px}
.no .lin{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.no .lin b{font-size:14px}
.no details>summary{cursor:pointer;list-style:none} .no details>summary::-webkit-details-marker{display:none}
.no details>summary::before{content:"▸ ";color:var(--ink3)} .no details[open]>summary::before{content:"▾ "}
.reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin:8px 0 4px 18px}
.rep{border:1px solid var(--linha);border-radius:10px;padding:8px 10px;font-size:13px}

/* dialogo */
dialog{border:none;border-radius:16px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,22,26,.45)}
.dlg{padding:20px 22px}
.dlg h3{margin:0 0 6px;font-size:18px}
.campo{display:block;margin-top:11px} .campo span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.campo input,.campo select,.campo textarea{width:100%;border:1px solid #D1D5DB;border-radius:9px;padding:9px 11px;background:#fff}
.erro{background:var(--verm-bg);color:var(--verm-esc);border-radius:9px;padding:9px 12px;margin-top:10px;font-size:13.5px}
.okmsg{background:var(--verde-bg);color:var(--verde);border-radius:9px;padding:9px 12px;margin-bottom:12px;font-size:13.5px}

/* login */
.login{max-width:400px;margin:70px auto;background:#fff;border-radius:16px;padding:24px;border:1px solid var(--linha)}
.login h2{margin:0 0 4px}
@media (max-width:980px){ .app{grid-template-columns:1fr} aside{display:none} .lin4{grid-template-columns:1fr 1fr} .kpis{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside id="lado"></aside>
  <main id="main"></main>
</div>
<dialog id="dlg"><div class="dlg" id="dlgc"></div></dialog>

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const guarda={ler:k=>{try{return localStorage.getItem("lid_"+k);}catch(e){return null;}},
              por:(k,v)=>{try{localStorage.setItem("lid_"+k,v);}catch(e){}}, tira:k=>{try{localStorage.removeItem("lid_"+k);}catch(e){}}};
/* Mesma limpeza do banco (_so_tel) e do app do lider: o telefone vira o login. */
const soTel=t=>{ let x=String(t||"").replace(/\D/g,"").replace(/^0+/,"");
  let d=x.length>11&&x.startsWith("55")?x.slice(2).slice(-11):x.slice(-11);
  return d.length===10&&"6789".includes(d[2])?d.slice(0,2)+"9"+d.slice(2):d; };
const hoje=()=>{ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const menosDias=(iso,n)=>{ const d=new Date(iso+"T12:00"); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
const dataBr=d=>d?String(d).slice(8,10)+"/"+String(d).slice(5,7):"—";
const quando=t=>t?new Date(t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
const tit=n=>String(n||"").toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
const curto=n=>{ const p=String(n||"").split(/\s+/).filter(Boolean); return p.length>1?tit(p[0]+" "+p[p.length-1]):tit(p[0]||""); };
const plural=(n,a,b)=>`${n} ${n===1?a:b}`;
const fmt=n=>n==null?"—":Number(n).toLocaleString("pt-BR",{maximumFractionDigits:1});
const pct=(a,b)=>b?Math.round(100*a/b):null;

/* --------------------------- acesso --------------------------- */
let TOKEN=guarda.ler("token"), EU=null;
async function api(caminho, opc={}, comToken=true, tentou=false){
  let r; try{ r=await fetch(CFG.url+caminho,{...opc, headers:{"Content-Type":"application/json","apikey":CFG.chave,...(comToken&&TOKEN?{"Authorization":"Bearer "+TOKEN}:{}),...(opc.headers||{})}}); }
  catch(e){ throw new Error("Sem conexão com o sistema agora."); }
  const t=await r.text(); let j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
  if(r.status===401&&comToken&&!tentou&&guarda.ler("refresh")){
    try{ const d=await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:guarda.ler("refresh")})},false,true);
      TOKEN=d.access_token; guarda.por("token",TOKEN); guarda.por("refresh",d.refresh_token); return api(caminho,opc,comToken,true); }
    catch(e){ sair(); throw new Error("Sua sessão terminou. Entre de novo."); } }
  if(!r.ok) throw new Error((j&&(j.message||j.error_description||j.msg||j.error))||("Erro "+r.status));
  return j;
}
const rpc=(fn,a)=>api("/rest/v1/rpc/"+fn,{method:"POST",body:JSON.stringify(a||{})});
function traduz(m){ const s=String(m||"").toLowerCase();
  if(s.includes("invalid login")||s.includes("credentials")) return "Telefone ou senha não conferem.";
  if(s.includes("nao e de nenhum lider")) return "Este telefone não é de nenhum líder ou gerente da base.";
  if(s.includes("ja foi ativado")) return "Este telefone já foi ativado em outro acesso. Fale com o administrador.";
  if(s.includes("nao e da sua equipe")) return "Isso não é da sua equipe.";
  return m; }
function sair(){ guarda.tira("token"); guarda.tira("refresh"); TOKEN=null; EU=null; telaLogin(); }
async function entrar(tel,senha){
  const email=`tel-${tel}@${CFG.dominio}`, logar=()=>api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password:senha})},false);
  let d; try{ d=await logar(); }
  catch(e){ if(!/invalid login|credentials/i.test(e.message)) throw e;
    try{ await api("/auth/v1/signup",{method:"POST",body:JSON.stringify({email,password:senha})},false); }
    catch(e2){ if(/already registered/i.test(e2.message)) throw new Error("Invalid login credentials"); throw e2; }
    d=await logar(); }
  TOKEN=d.access_token; guarda.por("token",TOKEN); guarda.por("refresh",d.refresh_token);
  try{ await rpc("vincular_por_telefone",{p_telefone:tel}); }catch(e){ guarda.tira("token"); guarda.tira("refresh"); TOKEN=null; throw e; }
}
function telaLogin(msg){
  $("lado").innerHTML=""; $("app").style.gridTemplateColumns="1fr";
  $("main").innerHTML=`<div class="login"><img src="${LOGO.coca}" alt="Coca-Cola Bandeirantes" style="display:block;width:190px;height:auto;margin:0 auto 14px"><h2>Painel de merchandising</h2><p class="mut" style="margin:0">Para gerentes e líderes. O mesmo acesso do app do líder.</p>
    <label class="campo"><span>Seu telefone, com DDD</span><input id="tel" type="tel" placeholder="(62) 99999-9999"></label>
    <label class="campo"><span>Senha</span><input id="sen" type="password"></label>
    <p class="mut" style="font-size:12.5px;margin:8px 0 0">No primeiro acesso, a senha que você digitar passa a ser a sua. Pelo menos 6 caracteres.</p>
    <div id="lerro">${msg?`<div class="erro">${esc(msg)}</div>`:""}</div>
    <button class="bt verm" id="entrar" style="width:100%;margin-top:14px;padding:11px">Entrar</button></div>`;
  const vai=async()=>{ const tel=soTel($("tel").value), sen=$("sen").value;
    if(tel.length<10) return $("lerro").innerHTML=`<div class="erro">Digite o telefone com DDD.</div>`;
    if(sen.length<6) return $("lerro").innerHTML=`<div class="erro">A senha precisa ter pelo menos 6 caracteres.</div>`;
    $("entrar").disabled=true; $("entrar").textContent="Entrando…";
    try{ await entrar(tel,sen); await abrir(); }catch(e){ $("lerro").innerHTML=`<div class="erro">${esc(traduz(e.message))}</div>`; if($("entrar")){ $("entrar").disabled=false; $("entrar").textContent="Entrar"; } } };
  $("entrar").onclick=vai; $("sen").onkeydown=e=>{ if(e.key==="Enter") vai(); };

async function abrir(){

}
async function carregar(){
  const H=hoje(), chamadas={
    oport:rpc("painel_oportunidades",{p_dias:DIAS}), venc:rpc("painel_vencimentos"), entr:rpc("entregas_da_equipe",{p_dias:DIAS}),
    estq:rpc("painel_estoque",{p_dias:30}), estqSem:rpc("estoque_da_equipe",{p_dias:7}), listas:rpc("painel_listas"),
    desemp:rpc("desempenho_da_equipe",{p_dias:DIAS}), desempAntes:rpc("desempenho_da_equipe",{p_dias:DIAS,p_fim:menosDias(H,DIAS)}),
    desempHoje:rpc("desempenho_da_equipe",{p_dias:1}), dem:rpc("demandas_da_equipe",{p_dias:30}), eu:rpc("eu_sou"),
    vis:rpc("painel_visitas",{p_dias:DIAS}), camp:rpc("campanhas_da_equipe",{p_dias:60}), equip:rpc("painel_equipamentos",{p_dias:DIAS})};
  const ks=Object.keys(chamadas), r=await Promise.allSettled(Object.values(chamadas));
  ERROS=[]; ks.forEach((k,i)=>{ if(r[i].status==="fulfilled") D[k]=r[i].value; else ERROS.push(traduz(r[i].reason.message)); });
  if(D.eu) EU=D.eu; CARREGADO_EM=new Date();

/* filtros: valem para tudo que tem lider, repositor, loja ou produto */
const lideresTodos=()=>(EU.lideres||[]).map(l=>l.nome);
const ligado=l=>F.lideres===null||F.lideres.includes(l);
function filtra(xs){ return (xs||[]).filter(x=>
  (x.lider==null||ligado(x.lider)) &&
  (!F.repositor||x.repositor===F.repositor||x.nome===F.repositor||x.de===F.repositor) &&
  (!F.loja||x.codigo===F.loja||x.loja===nomeLoja(F.loja)) &&
  (!F.produto||x.produto===F.produto) &&
  (!BUSCA||JSON.stringify(x).toLowerCase().includes(BUSCA.toLowerCase()))); }
const nomeLoja=c=>((D.listas&&D.listas.lojas)||[]).find(l=>l.codigo===c)?.nome||"";

/* ordena a tabela pelo campo clicado */
function ordena(xs, mod, padrao){ const o=ORD[mod]||padrao; if(!o) return xs;
  return xs.slice().sort((a,b)=>{ let x=a[o.campo], y=b[o.campo]; if(x==null) return 1; if(y==null) return -1;
    if(typeof x==="number"||!isNaN(Number(x))&&x!==""){ x=Number(x); y=Number(y); } return (x>y?1:x<y?-1:0)*(o.dir||1); }); }
const th=(mod,campo,txt,num)=>`<th data-ord="${campo}" data-mod="${mod}" ${num?'style="text-align:right"':""}>${txt}${ORD[mod]&&ORD[mod].campo===campo?(ORD[mod].dir>0?" ▲":" ▼"):""}</th>`;

/* exportacao: a tabela do modulo aberto vira um arquivo que o Excel abre */

function baixar(){ if(!EXPORTA||!EXPORTA.linhas.length) return;

  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));

  $("fRep").onchange=e=>{ F.repositor=e.target.value; pintar(); }; $("fLoja").onchange=e=>{ F.loja=e.target.value; ESTQ_DET=null; pintar(); };

/* --------------------------- 1. oportunidade --------------------------- */
function modOport(){
  const xs=filtra(D.oport);
  const grupos=[["naotem","Não tem","produto em falta",x=>x.ruptura],
    ["achados","Encontrados","ruptura ou abaixo, com estoque",x=>!x.ruptura&&(x.classe==="ruptura"||x.classe==="abaixo")&&x.caixas>0],
    ["abaixo","Abaixo do normal","registrados",x=>x.classe==="abaixo"&&!x.ruptura],
    ["excesso","Excesso","registrados",x=>x.classe==="excesso"],
    ["nunca","Não trabalha","oportunidade de venda",x=>x.classe==="nunca"&&!x.ruptura&&!(x.caixas>0)]];
  const lista=grupos.map(([k,t,s,f])=>[k,`${t} · ${xs.filter(f).length}`,s]);
  const at=abaAtual(lista), g=grupos.find(x=>x[0]===at), rs=ordena(xs.filter(g[3]),"oport",{campo:"data",dir:-1});
  const nt=xs.filter(x=>x.ruptura), mot={}; nt.forEach(x=>mot[x.motivo||"sem motivo"]=(mot[x.motivo||"sem motivo"]||0)+1);
  const top=Object.entries(mot).sort((a,b)=>b[1]-a[1])[0];
  EXPORTA={nome:"oportunidade-"+at, cab:["Produto","Loja","Codigo","Status","Contado (cx)","Motivo","Observacao","Data","Repositor","Lider"],
    linhas:rs.map(x=>[x.produto,x.loja,x.codigo,CLASSE[x.classe]||x.classe,x.caixas,MOTIVO[x.motivo]||"",x.obs||"",dataBr(x.data),x.repositor,x.lider])};
  return `<h2>Oportunidade de Estoque</h2>${abas(lista)}
    ${nt.length?`<div class="alerta"><b>${plural(nt.length,"produto marcado","produtos marcados")} como não tem</b> em ${plural(new Set(nt.map(x=>x.codigo)).size,"loja","lojas")} nos últimos ${DIAS} dias. Motivo mais comum: ${esc(MOTIVO[top[0]]||top[0])} (${top[1]}).</div>`
      :`<div class="alerta ok">Nenhum produto marcado como não tem nos últimos ${DIAS} dias.</div>`}
    ${barra(`<span class="mut">O que o repositor registrou na última contagem de cada produto, em cada loja.</span>`)}
    ${tabela(th("oport","produto","Produto")+th("oport","loja","Loja")+"<th>Status</th>"+th("oport","caixas","Contado",1)+"<th>Motivo e observação</th>"+th("oport","data","Data")+th("oport","repositor","Repositor")+th("oport","lider","Líder"),
      rs.map(x=>`<tr><td><b>${esc(x.produto)}</b><span class="sub">cód. ${esc(x.sku)}</span></td><td>${esc(x.loja)}<span class="sub">${esc(x.codigo)}</span></td>
        <td><span class="tag ${x.ruptura?"t-verm":x.classe==="excesso"?"t-azul":x.classe==="nunca"?"t-roxo":"t-amb"}">${x.ruptura?"Não tem":esc(CLASSE[x.classe]||x.classe)}</span></td>
        <td class="num">${x.caixas>0?`<span class="cel">${fmt(x.caixas)} cx</span>`:"—"}</td>
        <td>${x.motivo?`<b>${esc(MOTIVO[x.motivo]||x.motivo)}</b>`:""}${x.obs?`<span class="sub">"${esc(x.obs)}"</span>`:""}</td>
        <td>${dataBr(x.data)}</td><td>${esc(curto(x.repositor))}</td><td>${esc(curto(x.lider))}</td></tr>`),
      "Nenhum registro nesta aba no período.")}`;
}

function modVenc(){

  const at=abaAtual(lista), rs=ordena(at==="todos"?xs:xs.filter(x=>nivel(x)===at),"venc",{campo:"dias",dir:1});
  const vencidos=xs.filter(x=>x.dias<0), un=vencidos.reduce((a,x)=>a+(Number(x.quantidade)||0),0), parados=xs.filter(x=>Number(x.sem_atualizar)>7).length;
  EXPORTA={nome:"vencimentos-"+at, cab:["Produto","Loja","Codigo","Lote","Vence em","Dias","Quantidade inicial (un)","Quantidade agora (un)","Acompanhamento","Ultima acao","Sem contar ha (dias)","Repositor","Lider"],
    linhas:rs.map(x=>[x.produto,x.loja,x.codigo,x.lote,dataBr(x.vence_em),x.dias,x.inicial,x.quantidade,[x.inicial,...(x.historico||[]).map(m=>m.quantidade)].join(" > "),ACAO[x.acao]||"",x.sem_atualizar,x.repositor,x.lider])};
  const tag=x=>{ const n=nivel(x); return `<span class="tag ${n==="vencido"||n==="critico"?"t-verm":n==="atencao"?"t-amb":"t-cinza"}">${n==="vencido"?`vencido há ${-x.dias}d`:x.dias===0?"vence hoje":`vence em ${x.dias}d`}</span>`; };
  return `<h2>Controle de Vencimentos</h2>${abas(lista)}
    ${vencidos.length?`<div class="alerta"><b>${plural(vencidos.length,"lote vencido","lotes vencidos")} ainda na loja</b>, com ${fmt(un)} unidades. ${parados?`${plural(parados,"lote está","lotes estão")} sem contagem há mais de 7 dias.`:""}</div>`
      :`<div class="alerta ok">Nenhum lote vencido nas lojas da equipe.${parados?` ${plural(parados,"lote está","lotes estão")} sem contagem há mais de 7 dias.`:""}</div>`}

/* --------------------------- 3. entrega --------------------------- */

/* --------------------------- 4. contagem de estoque --------------------------- */
let ESTQ_DET=null;   // {chave, itens}: o detalhe buscado para um produto ou uma loja
function modEstq(){
  const lojaSel=F.loja, prodSel=F.produto, sem=filtra((D.estqSem||{}).sem_contagem_na_semana);
  const listaP=(D.listas&&D.listas.produtos)||[], listaL=(D.listas&&D.listas.lojas)||[];
  const alvo=lojaSel?{p_loja:(listaL.find(l=>l.codigo===lojaSel)||{}).id}:prodSel?{p_produto:(listaP.find(p=>p.nome===prodSel)||{}).id}:null;
  const chave=alvo?JSON.stringify(alvo):null;
  ligarModulo=()=>{ document.querySelectorAll("[data-prod]").forEach(tr=>tr.onclick=()=>{ F.produto=tr.dataset.prod; ESTQ_DET=null; pintar(); });
    if($("voltaEstq")) $("voltaEstq").onclick=()=>{ F.produto=""; F.loja=""; ESTQ_DET=null; pintar(); };
    if(chave&&(!ESTQ_DET||ESTQ_DET.chave!==chave)&&(alvo.p_loja||alvo.p_produto)){ const k=chave;
      rpc("painel_estoque",{p_dias:30,...alvo}).then(r=>{ if(chave===k){ ESTQ_DET={chave:k, itens:(r&&r.itens)||[]}; pintar(); } }).catch(e=>{ ESTQ_DET={chave:k, itens:[], erro:traduz(e.message)}; pintar(); }); } };
  const aviso=sem.length?`<div class="alerta"><b>${plural(sem.length,"loja","lojas")} sem contagem de estoque nesta semana.</b> ${sem.slice(0,6).map(x=>esc(x.loja)).join(", ")}${sem.length>6?` e mais ${sem.length-6}`:""}.</div>`:`<div class="alerta ok">Todas as lojas da equipe com contagem de estoque nesta semana.</div>`;
  if(!chave){
    const rs=ordena(filtra(((D.estq||{}).itens)||[]),"estq",{campo:"total_cx",dir:-1});

      linhas:rs.map(x=>[x.produto,x.sku,x.total_cx,x.lojas,x.lojas_sem,dataBr(x.ultima),dataBr(x.validade)])};
    return `<h2>Contagem de Estoque</h2>${abas([["prod","Por produto","última contagem de cada loja"]])}${aviso}
      ${barra(`<span class="mut">Escolha um produto (ou toque nele) para ver cada loja. Escolha uma loja no filtro para ver todos os produtos dela.</span>`)}
      ${tabela(th("estq","produto","Produto")+th("estq","total_cx","Total contado",1)+th("estq","lojas","Lojas contadas",1)+th("estq","lojas_sem","Sem estoque",1)+th("estq","ultima","Última contagem")+th("estq","validade","Validade mais próxima"),
        rs.map(x=>`<tr class="clica" data-prod="${esc(x.produto)}"><td><b>${esc(x.produto)}</b><span class="sub">cód. ${esc(x.sku)}</span></td>
          <td class="num"><span class="cel ${x.total_cx>0?"forte":""}">${fmt(x.total_cx)} cx</span></td><td class="num">${x.lojas}</td>
          <td class="num">${x.lojas_sem?`<span class="tag t-verm">${x.lojas_sem}</span>`:"0"}</td><td>${dataBr(x.ultima)}</td><td>${x.validade?dataBr(x.validade):"—"}</td></tr>`),
        "Nenhuma contagem de estoque nos últimos 30 dias.")}`;
  }
  const det=ESTQ_DET&&ESTQ_DET.chave===chave?ESTQ_DET:null, porProduto=!!alvo.p_produto;
  const rs=det?ordena(filtra(det.itens).map(x=>({...x})),"estqd",{campo:porProduto?"loja":"produto",dir:1}):[];
  const diasV=d=>d?Math.round((new Date(d+"T12:00")-new Date(hoje()+"T12:00"))/864e5):null;
  EXPORTA={nome:"contagem-"+(porProduto?prodSel:nomeLoja(lojaSel)), cab:["Produto","Loja","Codigo","Caixas","Unidades","Total (cx)","Data","Validade mais proxima","Repositor","Lider"],
    linhas:rs.map(x=>[x.produto,x.loja,x.codigo,x.caixas,x.unidades,x.total_cx,dataBr(x.data),dataBr(x.validade),x.repositor,x.lider])};
  return `<h2>Contagem de Estoque</h2>${abas([["det",porProduto?esc(prodSel):esc(nomeLoja(lojaSel)),porProduto?"em cada loja":"todos os produtos da loja"]])}${aviso}
    ${barra(`<button class="bt" id="voltaEstq">← Todos os produtos</button>`)}
    ${!det?`<div class="tab"><div class="vazio">Buscando a última contagem…</div></div>`:det.erro?`<div class="alerta">${esc(det.erro)}</div>`:
      tabela((porProduto?th("estqd","loja","Loja"):th("estqd","produto","Produto"))+th("estqd","total_cx","Na última contagem",1)+th("estqd","data","Contado em")+th("estqd","validade","Validade mais próxima")+th("estqd","repositor","Repositor")+th("estqd","lider","Líder"),
        rs.map(x=>{ const dv=diasV(x.validade); return `<tr><td><b>${esc(porProduto?x.loja:x.produto)}</b><span class="sub">${esc(porProduto?x.codigo:"cód. "+x.sku)}</span></td>
          <td class="num"><span class="cel ${x.total_cx>0?"forte":""}">${fmt(x.caixas||0)} cx${Number(x.unidades)?` + ${fmt(x.unidades)} un`:""}</span>${x.fator>1?`<span class="sub">${fmt(x.total_cx)} cx no total</span>`:""}</td>
          <td>${dataBr(x.data)}</td><td>${x.validade?`${dataBr(x.validade)} <span class="tag ${dv<0||dv<=20?"t-verm":dv<=30?"t-amb":"t-verde"}">${dv<0?"vencido":`${dv} dias`}</span>`:'<span class="mut">sem registro</span>'}</td>
          <td>${esc(curto(x.repositor))}</td><td>${esc(curto(x.lider))}</td></tr>`; }),
        "Nenhuma contagem deste filtro nos últimos 30 dias.")}`;
}

/* --------------------------- 5. desempenho --------------------------- */
function somaDesemp(rs){
  const t=(rs||[]).reduce((a,x)=>({prev:a.prev+x.previstas, vis:a.vis+x.visitadas, enc:a.enc+x.encerradas, encTot:a.encTot+(x.encerradas_total||0),
    comp:a.comp+x.completas, dem:a.dem+x.demandas, resp:a.resp+x.respondidas, venc:a.venc+x.vencidas,
    min:a.min+(x.tempo_medio_min||0)*(x.encerradas_total||0), encMin:a.encMin+(x.tempo_medio_min!=null?(x.encerradas_total||0):0),
    reg:a.reg+x.nao_tem+x.lotes+x.censos+x.contagens_estoque+x.entregas}),{prev:0,vis:0,enc:0,encTot:0,comp:0,dem:0,resp:0,venc:0,min:0,encMin:0,reg:0});
  return {...t, efet:pct(t.vis,t.prev), completas:pct(t.comp,t.encTot), resposta:pct(t.resp,t.dem), tempo:t.encMin?Math.round(t.min/t.encMin):null};
}
const delta=(a,b)=>a==null||b==null?"":a===b?`<span class="mut" style="font-size:12px">= período anterior</span>`:a>b?`<span class="var-up">▲ ${a-b} pts</span>`:`<span class="var-dn">▼ ${b-a} pts</span>`;
const cor=p=>p==null?"var(--ink3)":p>=90?"var(--verde)":p>=70?"var(--amb)":"var(--verm)";
function modDesemp(){
  const atual=filtra((D.desemp||{}).repositores), antes=filtra((D.desempAntes||{}).repositores);
  const A=somaDesemp(atual), B=somaDesemp(antes);
  const lista=[["rep","Por repositor",`${atual.length} repositores`],["lid","Por líder","compara as equipes"]];
  const at=abaAtual(lista), ant=Object.fromEntries(antes.map(x=>[x.id,x]));
  const kpi=(n,v,vb,suf,sub)=>`<div class="kpi"><span>${n}</span><b style="color:${suf==="%"?cor(v):"var(--ink)"}">${v??"—"}${v!=null?suf:""}</b><small>${sub}</small><div>${suf==="%"?delta(v,vb):""}</div></div>`;
  const cab=`<div class="kpis">${kpi("Efetividade das visitas",A.efet,B.efet,"%",`${A.vis} de ${A.prev} do roteiro`)}${kpi("Visitas completas",A.completas,B.completas,"%",`${A.comp} de ${A.encTot} encerradas`)}
    ${kpi("Resposta às demandas",A.resposta,B.resposta,"%",`${A.resp} de ${A.dem}${A.venc?` · ${plural(A.venc,"vencida","vencidas")}`:""}`)}${kpi("Registros nas lojas",A.reg,null,"",`não tem, lotes, censos, contagens e entregas · antes ${B.reg}`)}</div>`;
  let corpo;
  if(at==="lid"){
    const por={}; atual.forEach(x=>(por[x.lider]=por[x.lider]||[]).push(x)); const porB={}; antes.forEach(x=>(porB[x.lider]=porB[x.lider]||[]).push(x));
    const rs=Object.entries(por).map(([l,xs])=>({lider:l, n:xs.length, ...somaDesemp(xs), b:somaDesemp(porB[l]||[])}));
    const o=ordena(rs,"desl",{campo:"efet",dir:1});
    EXPORTA={nome:"desempenho-por-lider", cab:["Lider","Repositores","Efetividade %","Completas %","Resposta %","Tempo medio (min)","Registros"], linhas:o.map(x=>[x.lider,x.n,x.efet,x.completas,x.resposta,x.tempo,x.reg])};
    corpo=tabela(th("desl","lider","Líder")+th("desl","n","Repositores",1)+th("desl","efet","Efetividade",1)+th("desl","completas","Completas",1)+th("desl","resposta","Resposta",1)+th("desl","tempo","Tempo na loja",1)+th("desl","reg","Registros",1),
      o.map(x=>`<tr><td><b>${esc(tit(x.lider))}</b></td><td class="num">${x.n}</td><td class="num"><b style="color:${cor(x.efet)}">${x.efet??"—"}${x.efet!=null?"%":""}</b><span class="sub">${delta(x.efet,x.b.efet)}</span></td>
        <td class="num"><b style="color:${cor(x.completas)}">${x.completas??"—"}${x.completas!=null?"%":""}</b><span class="sub">${delta(x.completas,x.b.completas)}</span></td>
        <td class="num"><b style="color:${cor(x.resposta)}">${x.resposta??"—"}${x.resposta!=null?"%":""}</b>${x.venc?`<span class="sub" style="color:var(--verm-esc)">${plural(x.venc,"vencida","vencidas")}</span>`:""}</td>
        <td class="num">${x.tempo!=null?x.tempo+" min":"—"}</td><td class="num">${x.reg}</td></tr>`),"Nenhum dado no período.");
  } else {
    const rs=atual.map(x=>{ const b=ant[x.id]||{}; const e=pct(x.visitadas,x.previstas), eb=pct(b.visitadas,b.previstas);
      return {...x, efet:e, efetB:eb, comp:pct(x.completas,x.encerradas_total), resp:pct(x.respondidas,x.demandas), reg:x.nao_tem+x.lotes+x.censos+x.contagens_estoque+x.entregas,
        atencao:[x.usa_app===false?"nunca entrou no app":"", x.previstas&&e<70?"efetividade baixa":"", x.vencidas?plural(x.vencidas,"demanda vencida","demandas vencidas"):""].filter(Boolean)}; });
    const o=ordena(rs,"desr",{campo:"efet",dir:1});
    EXPORTA={nome:"desempenho-por-repositor", cab:["Repositor","Lider","Rota","Visitadas","Previstas","Efetividade %","Efetividade anterior %","Completas %","Resposta %","Tempo medio (min)","Inicio medio","Nao tem","Lotes","Censos","Contagens","Entregas"],
      linhas:o.map(x=>[x.nome,x.lider,x.rota,x.visitadas,x.previstas,x.efet,x.efetB,x.comp,x.resp,x.tempo_medio_min,x.inicio_medio,x.nao_tem,x.lotes,x.censos,x.contagens_estoque,x.entregas])};
    corpo=tabela(th("desr","nome","Repositor")+th("desr","efet","Efetividade",1)+th("desr","comp","Completas",1)+th("desr","resp","Resposta",1)+th("desr","tempo_medio_min","Tempo na loja",1)+th("desr","inicio_medio","Começa")+th("desr","reg","Registros",1)+"<th>Atenção</th>",
      o.map(x=>`<tr><td><b>${esc(tit(x.nome))}</b><span class="sub">${esc(curto(x.lider))} · rota ${esc(x.rota||"?")}</span></td>
        <td class="num"><b style="color:${cor(x.efet)}">${x.efet??"—"}${x.efet!=null?"%":""}</b><span class="sub">${x.visitadas}/${x.previstas} ${delta(x.efet,x.efetB)}</span></td>
        <td class="num">${x.comp!=null?`<b style="color:${cor(x.comp)}">${x.comp}%</b><span class="sub">${x.completas}/${x.encerradas_total}</span>`:"—"}</td>
        <td class="num">${x.resp!=null?`<b style="color:${cor(x.resp)}">${x.resp}%</b><span class="sub">${x.respondidas}/${x.demandas}</span>`:"—"}</td>
        <td class="num">${x.tempo_medio_min!=null?x.tempo_medio_min+" min":"—"}</td><td>${esc(x.inicio_medio||"—")}</td>
        <td class="num">${x.reg}<span class="sub">${[x.nao_tem?x.nao_tem+" não tem":"",x.lotes?x.lotes+" lotes":"",x.contagens_estoque?x.contagens_estoque+" contag.":""].filter(Boolean).join(" · ")}</span></td>
        <td>${x.atencao.map(a=>`<span class="tag t-amb" style="margin:0 4px 4px 0">${esc(a)}</span>`).join("")}</td></tr>`),"Nenhum repositor com roteiro no período.");
  }
  const pioraram=atual.filter(x=>{ const b=ant[x.id]; const e=pct(x.visitadas,x.previstas), eb=b?pct(b.visitadas,b.previstas):null; return e!=null&&eb!=null&&e<eb-10; }).length;
  return `<h2>Desempenho da equipe</h2>${abas(lista)}${cab}
    <div class="alerta ${pioraram?"":"ok"}">${pioraram?`<b>${plural(pioraram,"repositor caiu","repositores caíram")} mais de 10 pontos de efetividade</b> em relação aos ${DIAS} dias anteriores.`:`Ninguém caiu mais de 10 pontos de efetividade em relação aos ${DIAS} dias anteriores.`} As setas comparam com os ${DIAS} dias anteriores.</div>
    ${barra()}${corpo}`;
}

/* --------------------------- 6. demandas --------------------------- */

  let corpo;

            ${x.contexto.item_texto?`<div style="font-weight:600;margin-top:4px">${esc(x.contexto.item_texto)}</div>`:""}${x.contexto.obs?`<div style="white-space:pre-line;margin-top:3px">${esc(x.contexto.obs)}</div>`:""}`
          :`<div style="white-space:pre-line">${esc(x.texto)}</div>`}

const distTxt=m=>m<1000?`${m} m`:`${(m/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})} km`;
function geoTag(m, temLoja, raio){
  if(m==null) return `<span class="tag t-cinza">${temLoja===false?"loja sem endereço":"sem GPS"}</span>`;
  return m<=raio?`<span class="tag t-verde">na loja</span>`:m<=1000?`<span class="tag t-amb">a ${distTxt(m)}</span>`:`<span class="tag t-verm">a ${distTxt(m)}</span>`;
}
function modVis(){

  const fora=x=>(x.dist_inicio_m!=null&&x.dist_inicio_m>raio)||(x.dist_fim_m!=null&&x.dist_fim_m>raio);
  const semGps=x=>x.dist_inicio_m==null||(x.fim&&x.dist_fim_m==null);
  const comTempo=xs.filter(x=>x.tempo_min!=null&&x.fim), tMed=comTempo.length?Math.round(comTempo.reduce((a,x)=>a+x.tempo_min,0)/comTempo.length):null;
  const lista=[["todas",`Todas · ${xs.length}`,`últimos ${DIAS} dias`],["canc",`Canceladas · ${canc.length}`,"com o motivo e onde estava"],["fora",`Fora da loja · ${xs.filter(fora).length}`,`início ou fim a mais de ${raio} m`],["sem",`Sem localização · ${xs.filter(semGps).length}`,"sem GPS ou loja sem endereço"]];
  const at=abaAtual(lista), rs=ordena(at==="canc"?canc:at==="fora"?xs.filter(fora):at==="sem"?xs.filter(semGps):xs,"vis",{campo:"data",dir:-1});

  const comIni=xs.filter(x=>x.dist_inicio_m!=null), comFim=xs.filter(x=>x.dist_fim_m!=null);

  const pIni=pct(nIni,comIni.length), pFim=pct(nFim,comFim.length);
  const kpi=(n,v,c,sub)=>`<div class="kpi"><span>${n}</span><b style="color:${c||"var(--ink)"}">${v??"—"}</b><small>${sub}</small></div>`;
  EXPORTA={nome:"visitas-localizacao", cab:["Data","Repositor","Lider","Loja","Codigo","Situacao","Motivo do cancelamento","Inicio","Distancia no inicio (m)","Fim","Distancia no fim (m)","Tempo na loja (min)","Reaberturas"],
    linhas:rs.map(x=>[dataBr(x.data),x.repositor,x.lider,x.loja,x.codigo,x.situacao==="nao_atendida"?"cancelada":x.fim?"concluida":"em andamento",x.motivo||"",x.inicio,x.dist_inicio_m,x.fim,x.dist_fim_m,x.tempo_min??x.duracao_min,x.reaberturas||0])};
  return `<h2>Visitas e localização</h2>${abas(lista)}
    <div class="kpis">${kpi("Começaram na loja",pIni!=null?pIni+"%":"—",cor(pIni),`${nIni} de ${comIni.length} com GPS`)}
      ${kpi("Encerraram na loja",pFim!=null?pFim+"%":"—",cor(pFim),`${nFim} de ${comFim.length} com GPS`)}
      ${kpi("Tempo médio na loja",tMed!=null?tMed+" min":"—",null,`${comTempo.length} visitas encerradas`)}${kpi("Canceladas",canc.length,canc.length?"var(--verm)":null,`fora do raio: ${canc.filter(x=>x.dist_fim_m!=null&&x.dist_fim_m>raio).length}`)}</div>
    ${xs.filter(fora).length?`<div class="alerta"><b>${plural(xs.filter(fora).length,"visita começou ou terminou","visitas começaram ou terminaram")} longe da loja</b> nos últimos ${DIAS} dias. A distância é a do celular do repositor até o endereço da loja.</div>`
      :`<div class="alerta ok">Todas as visitas com localização começaram e terminaram na loja.</div>`}
    ${barra(`<span class="mut">"Na loja" é até ${raio} m do endereço cadastrado.</span>`)}
    ${at==="canc"
      ?tabela(th("vis","data","Data")+th("vis","repositor","Repositor")+th("vis","loja","Loja")+"<th>Motivo</th>"+th("vis","dist_fim_m","Onde cancelou")+th("vis","lider","Líder"),
        rs.map(x=>`<tr><td>${dataBr(x.data)}</td><td><b>${esc(curto(x.repositor))}</b></td><td>${esc(x.loja)}<span class="sub">${esc(x.codigo)}${x.cidade?` · ${esc(x.cidade)}`:""}</span></td>
          <td><span class="tag t-verm">${esc(x.motivo||"sem motivo")}</span></td><td>${esc(x.fim||"")} ${geoTag(x.dist_fim_m,x.loja_tem_gps,raio)}${historico(x)}</td><td>${esc(curto(x.lider))}</td></tr>`),
        "Nenhuma visita cancelada no período.")
      :tabela(th("vis","data","Data")+th("vis","repositor","Repositor")+th("vis","loja","Loja")+th("vis","dist_inicio_m","Início")+th("vis","dist_fim_m","Fim")+th("vis","tempo_min","Tempo na loja",1)+th("vis","lider","Líder"),
        rs.map(x=>`<tr><td>${dataBr(x.data)}</td><td><b>${esc(curto(x.repositor))}</b></td><td>${esc(x.loja)}<span class="sub">${esc(x.codigo)}${x.cidade?` · ${esc(x.cidade)}`:""}</span></td>

        "Nenhuma visita nesta aba.")}`;

/* A foto de uma demanda fica no armazenamento protegido: so abre com o login. */
async function verFoto(caminho){
  const fundo=document.createElement("div");
  fundo.style.cssText="position:fixed;inset:0;background:rgba(15,16,20,.85);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;cursor:pointer";
  fundo.textContent="Abrindo a foto…"; fundo.onclick=()=>fundo.remove(); document.body.appendChild(fundo);
  try{ const r=await fetch(CFG.url+"/storage/v1/object/authenticated/fotos/"+caminho,{headers:{"apikey":CFG.chave,"Authorization":"Bearer "+TOKEN}});
    if(!r.ok) throw new Error("A foto ainda não subiu do celular do repositor, ou não está mais guardada.");
    fundo.innerHTML=`<img src="${URL.createObjectURL(await r.blob())}" alt="Foto da demanda" style="max-width:100%;max-height:100%;border-radius:12px">`; }
  catch(e){ fundo.textContent=e.message+" Clique para fechar."; }
}

function novaCampanha(){
  const lids=(EU.lideres||[]).filter(l=>ligado(l.nome));
  $("dlgc").innerHTML=`<h3>Nova campanha nas lojas</h3><p class="mut" style="margin:0">Vai para cada loja como uma solicitação. O repositor confere a lista, tira as fotos e diz se fez.</p>
    <label class="campo"><span>Nome da campanha</span><input id="cTit" maxlength="120" placeholder="Ex.: Ativação Black Friday"></label>
    <label class="campo"><span>O que fazer (opcional)</span><textarea id="cDesc" rows="2"></textarea></label>
    <div class="campo"><span>O que conferir em cada loja</span><div id="cItens">${["Ex.: ponto extra montado","Ex.: preço da campanha aplicado","Ex.: material de PDV no lugar"].map(p=>`<input data-it style="margin-top:6px" placeholder="${p}">`).join("")}</div>
      <button class="bt" id="cMaisIt" style="margin-top:6px">+ mais um item</button></div>
    <div class="campo"><span>Fotos obrigatórias por loja</span><div class="seg" id="cFotos">${[0,1,2,3].map(n=>`<button data-nf="${n}" aria-pressed="${n===2}">${n===0?"Nenhuma":n}</button>`).join("")}</div></div>
    <label class="campo"><span>Lojas</span><select id="cLider"><option value="">${EU.perfil==="admin"?"Todas as lojas":"Todas as lojas das minhas equipes"}</option>${lids.map(l=>`<option value="${l.id}">Só a equipe de ${esc(tit(l.nome))}</option>`).join("")}</select></label>
    <label class="campo"><span>Prazo</span><input id="cPrazo" type="date" min="${hoje()}"></label>
    <p class="mut" style="font-size:12.5px;margin:8px 0 0">Com prazo, a loja que não responder até lá trava o encerramento da visita.</p><div id="cErro"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="bt" id="cCanc">Cancelar</button><button class="bt verm" id="cOk">Mandar para as lojas</button></div>`;
  let nf=2;
  $("cFotos").querySelectorAll("[data-nf]").forEach(b=>b.onclick=()=>{ nf=+b.dataset.nf; $("cFotos").querySelectorAll("[data-nf]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  $("cMaisIt").onclick=()=>{ if($("cItens").querySelectorAll("[data-it]").length>=6) return; const i=document.createElement("input"); i.dataset.it=""; i.style.marginTop="6px"; $("cItens").appendChild(i); i.focus(); };
  $("cCanc").onclick=fechaDlg;
  $("cOk").onclick=async()=>{ const t=$("cTit").value.trim(); if(!t) return $("cErro").innerHTML=`<div class="erro">Escreva o nome da campanha.</div>`;
    const itens=[...$("cItens").querySelectorAll("[data-it]")].map(i=>i.value.trim()).filter(Boolean);
    $("cOk").disabled=true; $("cOk").textContent="Mandando…";
    try{ const r=await rpc("criar_campanha",{p_titulo:t, p_descricao:$("cDesc").value.trim()||null, p_prazo:$("cPrazo").value||null, p_itens:itens.length?itens:null, p_fotos_min:nf, p_lider:$("cLider").value||null});
      fechaDlg(); MOD="dem"; ABA.dem="camp"; CAMP_SEL=r.campanha; await carregar(); $("mod").insertAdjacentHTML("afterbegin",`<div class="okmsg">Campanha mandada para ${plural(r.lojas,"loja","lojas")}.</div>`); }
    catch(e){ $("cErro").innerHTML=`<div class="erro">${esc(traduz(e.message))}</div>`; $("cOk").disabled=false; $("cOk").textContent="Mandar para as lojas"; } };
  $("dlg").showModal ? $("dlg").showModal() : $("dlg").setAttribute("open","");
}
window.novaCampanha=novaCampanha;


/* --------------------------- geladeiras (comodato) --------------------------- */
const MARCA_EQ={"Total Ko":"Coca-Cola","Total Monster":"Monster","Total Hnk":"Heineken"};
function situacaoGel(x){
  if(!x.data) return {k:"sem", t:"Sem conferência", cls:"t-cinza"};
  if(x.encontrado===false) return {k:"sumiu", t:"Não encontrada", cls:"t-verm"};
  if(x.ptm_status==="diferente") return {k:"ptm", t:"PTM diferente", cls:"t-verm"};
  if(x.problemas>0) return {k:"prob", t:`${x.problemas} ${x.problemas===1?"problema":"problemas"}`, cls:"t-amb"};
  return {k:"ok", t:"Conforme", cls:"t-verde"};
}
function modEquip(){
  const d=D.equip||{}, xs=filtra((d.equipamentos||[]).map(x=>({...x, nome:x.repositor}))), ex=filtra(d.extras||[]);
  const sem=xs.filter(x=>!x.conferido_semana), sit=x=>situacaoGel(x).k;
  const grupos=[["sumiu","Não encontradas","possível perda",x=>x.encontrado===false],["prob","Fora do padrão","requisito com Não",x=>x.encontrado!==false&&x.problemas>0],
    ["ptm","PTM diferente","outro equipamento?",x=>x.ptm_status==="diferente"],["semana","Sem conferência","nesta semana",x=>!x.conferido_semana],
    ["ok","Conformes","tudo Sim",x=>sit(x)==="ok"],["todas","Todas","na base",x=>true]];
  const lista=[...grupos.map(([k,t,s,f])=>[k,`${t} · ${xs.filter(f).length}`,s]),["extra",`Fora da base · ${ex.length}`,"achadas na loja"]];
  const at=abaAtual(lista);
  const kpi=(n,v,c,sub)=>`<div class="kpi"><span>${n}</span><b style="color:${c||"var(--ink)"}">${v}</b><small>${sub}</small></div>`;
  const pSem=pct(xs.length-sem.length,xs.length);
  const cab=`<div class="kpis">${kpi("Conferidas nesta semana",pSem!=null?pSem+"%":"—",cor(pSem),`${xs.length-sem.length} de ${xs.length} geladeiras`)}
    ${kpi("Não encontradas",xs.filter(x=>x.encontrado===false).length,xs.some(x=>x.encontrado===false)?"var(--verm)":null,"na última conferência")}
    ${kpi("Fora do padrão",xs.filter(x=>x.encontrado!==false&&x.problemas>0).length,null,"algum requisito com Não")}
    ${kpi("PTM diferente",xs.filter(x=>x.ptm_status==="diferente").length,null,"do registrado na primeira vez")}</div>`;
  const fotos=x=>[x.foto_equip,x.foto_ptm].filter(Boolean);
  if(at==="extra"){
    EXPORTA={nome:"geladeiras-fora-da-base", cab:["Loja","Codigo","Data","Descricao","Marca","PTM","Repositor","Observacao"],
      linhas:ex.map(x=>[x.loja,x.codigo,dataBr(x.data),(x.extra||{}).modelo,MARCA_EQ[(x.extra||{}).marca]||(x.extra||{}).marca,x.ptm,x.repositor,x.observacao])};
    return `<h2>Geladeiras</h2>${abas(lista)}${cab}
      <div class="alerta ${ex.length?"":"ok"}">${ex.length?`<b>${plural(ex.length,"geladeira foi achada","geladeiras foram achadas")} na loja sem estar na base de comodato</b> nos últimos ${DIAS} dias.`:"Nenhuma geladeira fora da base nos últimos "+DIAS+" dias."}</div>
      ${barra()}${tabela("<th>Loja</th><th>Geladeira</th><th>PTM</th><th>Fotos</th><th>Registrada</th><th>Observação</th>",
        ex.map((x,i)=>`<tr><td><b>${esc(x.loja)}</b><span class="sub">${esc(x.codigo)}</span></td><td>${esc((x.extra||{}).modelo||"—")}<span class="sub">${esc(MARCA_EQ[(x.extra||{}).marca]||(x.extra||{}).marca||"")}</span></td>
          <td>${esc(x.ptm||"—")}</td><td>${x.foto_equip?`<button class="bt" data-gfx="${i}" style="padding:4px 10px">Ver</button>`:"—"}</td><td>${dataBr(x.data)}<span class="sub">${esc(curto(x.repositor))}</span></td><td>${esc(x.observacao||"")}</td></tr>`),"Nenhuma.")}`;
  }
  const g=grupos.find(x=>x[0]===at), rs=ordena(xs.filter(g[3]),"equip",{campo:"loja",dir:1});
  ligarModulo=()=>{ document.querySelectorAll("[data-gf]").forEach(b=>b.onclick=()=>verFotos(fotos(rs[+b.dataset.gf])));
    document.querySelectorAll("[data-gfx]").forEach(b=>b.onclick=()=>verFotos([ex[+b.dataset.gfx].foto_equip].filter(Boolean))); };
  EXPORTA={nome:"geladeiras-"+at, cab:["Loja","Codigo","Cidade","Modelo","Marca","Portas","Contrato","Unidade","Situacao","Requisitos com problema","PTM registrado","PTM lido","Conferida em","Repositor","Lider","Situacao comercial","Acao sugerida"],
    linhas:rs.map(x=>[x.loja,x.codigo,x.cidade,x.modelo,MARCA_EQ[x.marca]||x.marca,x.portas,x.contrato,x.item,situacaoGel(x).t,
      Object.entries(x.respostas||{}).filter(([,v])=>v===false).map(([k])=>k).join(" | "),x.ptm,x.ptm_lido,dataBr(x.data),x.repositor,x.lider,x.situacao,x.acao_sugerida])};
  const sumiu=xs.filter(x=>x.encontrado===false);
  return `<h2>Geladeiras</h2>${abas(lista)}${cab}
    ${sumiu.length?`<div class="alerta"><b>${plural(sumiu.length,"geladeira não foi encontrada","geladeiras não foram encontradas")} na loja</b>: ${sumiu.slice(0,4).map(x=>`${esc(x.modelo)} em ${esc(x.loja)}`).join("; ")}${sumiu.length>4?` e mais ${sumiu.length-4}`:""}.</div>`
      :`<div class="alerta ok">Nenhuma geladeira dada como não encontrada.${sem.length?` ${plural(sem.length,"está","estão")} sem conferência nesta semana.`:""}</div>`}
    ${barra(`<span class="mut">Semana desde ${dataBr(d.semana_desde)}. A base de comodato entra pela página de vendas do dia.</span>`)}
    ${tabela(th("equip","loja","Loja")+th("equip","modelo","Geladeira")+"<th>Situação</th><th>Requisitos com Não</th>"+th("equip","ptm","PTM")+"<th>Fotos</th>"+th("equip","data","Conferida")+th("equip","acao_sugerida","Comercial")+th("equip","lider","Líder"),
      rs.map((x,i)=>{ const st=situacaoGel(x), fs=fotos(x), falhas=Object.entries(x.respostas||{}).filter(([,v])=>v===false).map(([k])=>k);
        return `<tr><td><b>${esc(x.loja)}</b><span class="sub">${esc(x.codigo)}${x.cidade?` · ${esc(x.cidade)}`:""}</span></td>
          <td>${esc(x.modelo)}${x.item>1?` · un. ${x.item}`:""}<span class="sub">${esc(MARCA_EQ[x.marca]||x.marca||"")}${x.portas?` · ${esc(x.portas)} portas`:""} · contrato ${esc(x.contrato)}</span></td>
          <td><span class="tag ${st.cls}">${st.t}</span>${x.encontrado===false&&x.observacao?`<span class="sub">${esc(x.observacao)}</span>`:""}</td>
          <td>${falhas.length?falhas.map(f=>`<div style="font-size:12.5px"><b style="color:var(--verm-esc)">✗</b> ${esc(f)}</div>`).join(""):'<span class="mut">—</span>'}</td>
          <td>${x.ptm?esc(x.ptm):'<span class="mut">sem registro</span>'}${x.ptm_status==="diferente"?`<span class="sub" style="color:var(--verm-esc)">lido ${esc(x.ptm_lido)}</span>`:""}</td>
          <td>${fs.length?`<button class="bt" data-gf="${i}" style="padding:4px 10px">Ver ${fs.length}</button>`:'<span class="mut">—</span>'}</td>
          <td>${x.data?`${dataBr(x.data)}<span class="sub">${esc(curto(x.repositor))}</span>`:'<span class="mut">nunca</span>'}</td>
          <td>${/renegociar|recolher|acompanhar/i.test(x.acao_sugerida||"")?`<span class="tag t-verm">${esc(x.acao_sugerida)}</span>`:`<span class="mut">${esc(x.situacao||"—")}</span>`}</td>
          <td>${esc(curto(x.lider))}</td></tr>`; }),"Nenhuma geladeira nesta aba.")}`;
}

/* --------------------------- 7. estrutura --------------------------- */
function modArv(){
  const lids=(EU.lideres||[]).filter(l=>ligado(l.nome)), reps=filtra(EU.repositores);
  const porGer={}; lids.forEach(l=>(porGer[l.gerente||"Sem gerente"]=porGer[l.gerente||"Sem gerente"]||[]).push(l));
  EXPORTA={nome:"estrutura", cab:["Gerente","Lider","Telefone do lider","Repositor","Rota","Telefone","Usa o app"],
    linhas:lids.flatMap(l=>reps.filter(r=>r.lider===l.nome).map(r=>[l.gerente,l.nome,l.telefone,r.nome,r.rota,r.telefone,r.usa_app?"sim":"nao"]))};
  const semApp=reps.filter(r=>r.usa_app===false).length, lidSemApp=lids.filter(l=>!l.ativou).length;
  return `<h2>Estrutura da equipe</h2>${abas([["arv",`${plural(lids.length,"líder","líderes")} · ${plural(reps.length,"repositor","repositores")}`,"gerente, líderes e repositores"]])}
    <div class="alerta ${semApp||lidSemApp?"":"ok"}">${semApp?`<b>${plural(semApp,"rota nunca entrou","rotas nunca entraram")} no app.</b> `:""}${lidSemApp?`${plural(lidSemApp,"líder ainda não ativou","líderes ainda não ativaram")} o acesso.`:""}${!semApp&&!lidSemApp?"Todas as rotas já entraram no app, e todos os líderes ativaram o acesso.":""}</div>
    ${barra()}
    <div class="arv">${Object.entries(porGer).map(([g,ls])=>`<div style="margin-bottom:10px"><div style="display:flex;gap:10px;align-items:center"><span class="tag t-cinza">Gerente</span><b style="font-size:15px">${esc(tit(g))}</b><span class="mut">${plural(ls.length,"líder","líderes")}</span></div>
      ${ls.map(l=>{ const rs=reps.filter(r=>r.lider===l.nome); return `<div class="no"><details ${ls.length<=3?"open":""}><summary><span class="lin" style="display:inline-flex"><span class="tag t-azul">Líder</span><b>${esc(tit(l.nome))}</b>
        <span class="mut">${plural(rs.length,"repositor","repositores")}${l.telefone?` · ${esc(l.telefone)}`:""}</span>${l.ativou?'<span class="tag t-verde">acesso ativo</span>':'<span class="tag t-amb">não ativou</span>'}</span></summary>
        <div class="reps">${rs.map(r=>`<div class="rep"><b>${esc(tit(r.nome))}</b><div class="mut">rota ${esc(r.rota||"?")}${r.telefone?` · ${esc(r.telefone)}`:""}</div>
          <div style="margin-top:4px">${r.usa_app?'<span class="tag t-verde">usa o app</span>':'<span class="tag t-verm">nunca entrou</span>'} <span class="mut">${plural((r.lojas||[]).length,"loja","lojas")}</span></div></div>`).join("")||'<span class="mut">Sem repositor.</span>'}</div></details></div>`; }).join("")}</div>`).join("")||'<div class="vazio">Nenhum líder.</div>'}</div>`;
}

if(TOKEN) abrir(); else telaLogin();
setInterval(()=>{ if(EU&&!document.hidden&&navigator.onLine&&!document.querySelector("dialog[open]")&&!document.activeElement.matches("input,textarea,select")) carregar(); }, 5*60*1000);
</script>
